/* ---------------------------------------------------------------- 搜索 */
function renderLoading(wd, n) {
  $('view').innerHTML = '<div class="center"><span class="spin"></span><br>正在搜索「'
    + esc(wd) + '」…<br><small>并发请求 ' + (n || CFG.sources.length) + ' 个接口</small></div>';
}

function renderResults(items, wd, failures, errs, pending, hint) {
  var view = $('view');
  var html = '<section><div class="sec-head"><h2>「' + esc(wd) + '」的搜索结果</h2>'
    + '<small>' + items.length + ' 条 · <button class="lnk" onclick="backHome()">返回推荐</button></small></div>';
  if (pending) {
    // hint 用来换成「正在重试」这类阶段性说明，默认是本地兜底那条
    var tip = hint || ('本地片库 ' + items.length + ' 条，正在补充接口结果…');
    html += '<div class="pooltip"><span class="spin"></span>'
      + '<span>' + esc(tip) + '</span></div>';
  }
  if (!items.length && !pending) {
    // 空结果有两种：真没有，和「请求全挂了」。把第一条错误原样贴出来，
    // 免得到别的机型上又只能凭感觉猜（鸿蒙上就吃过这个亏）
    var why = errs && errs.length ? esc(errs[0])
      : (failures ? failures + ' 个接口请求失败，可点右上角 ⚙ 测活 / 更换接口' : '换个关键词试试');
    html += '<div class="center">没有找到相关内容<br><small>' + why + '</small></div>';
  } else {
    html += '<div class="sorthint">排序：正版优先 → 集数多优先 → 片名</div>';
    html += '<div class="grid">';
    items.forEach(function(it) {
      // 本地片库的条目没有 vod_id，点进去先按片名回查源站
      html += posterHtml(it, { source: it.source, detail: !it.local });
    });
    html += '</div>';
  }
  html += '</section><div style="text-align:center;margin-bottom:20px">'
    + '<button class="btn ghost" onclick="backHome()">返回推荐</button></div>';
  view.innerHTML = html;
  fixSubs(view);
  syncBack();                      // 结果页是可以「返回推荐」的，告诉原生层
}

function backHome() {
  state.q = ''; state.items = null; state.hero = 0;
  state.more = null; state.moreShown = 60;
  $('q').value = '';
  renderHome();
}

/* ---------------------------------------------------------------- 返回键
   这是个单页应用，没有浏览器 history。以前原生返回键走的是 web.canGoBack()，
   它退的是文档本身，退完就离开 app.html（白页 / 直接结束进程），用户看到的
   就是「按返回没回上一页，而是退出软件」。
   现在改成：JS 维护「页面里还有没有上一级」，返回键先退一级，真到首页了才
   交给原生层走双击退出。

   上一级的判定顺序（与 __ltvBack 的执行顺序一致）：
     详情/设置弹层 → 搜索结果 → 全库分区视图 → 非首页分类 → 无 */
function hasInnerBack() {
  try { if (!$('sheet').classList.contains('hidden')) return true; } catch (e) {}
  if (state.q || state.more) return true;
  return !!(state.cat && state.cat !== 'featured');
}

/** 把「能不能退」同步给原生层。切视图的地方都会调一次，开销就是一次桥调用 */
function syncBack() {
  try { if (HAS_NATIVE && Android.setCanBack) Android.setCanBack(hasInnerBack()); } catch (e) {}
}

/** 原生返回键在「页面内还有上一级」时调到这儿：退一级 */
function __ltvBack() {
  var sheet = $('sheet');
  if (sheet && !sheet.classList.contains('hidden')) { closeSheet(); syncBack(); return; }
  if (state.q || state.more) { backHome(); return; }
  if (state.cat && state.cat !== 'featured') {
    state.cat = 'featured'; state.hero = 0; state.sortTouched = false;
    renderCats();
    renderHome();
    try { window.scrollTo(0, 0); } catch (e) {}
    return;
  }
  syncBack();
}

/** 本地片库里的匹配（片名包含关键词）。
    两个作用：一是源站全挂、超时、或者被系统拦掉时搜索仍有结果可选；
    二是已同步的 1000+ 部本来就在本机，没必要每次都等网络。 */
function localSearch(wd, limit) {
  var q = normTitle(wd);
  if (!q) return [];
  var hit = allRows().filter(function(r) { return normTitle(r[0]).indexOf(q) >= 0; });
  hit.sort(function(a, b) { return recommendScore(b) - recommendScore(a); });
  return hit.slice(0, limit || 60).map(function(r) {
    return {
      title: r[0], cover: r[6] || '', rating: r[3] || '', year: r[1] || '',
      area: r[4] || '', genre: r[2] || '', remarks: r[7] || '',
      source: '本地片库', local: true
    };
  });
}

/** 单源搜索。ac=videolist 单页 100~500KB，超时给得比默认值宽松 */
/** 把接口返回的 JSON 映射成卡片数据 */
/** 从一条采集记录里算出总集数。
    优先 vod_total（采集站自己声明的总集数）；没给就数 vod_play_url 有几个分集地址
    （多线路用 $$$ 分隔，取条数最多的那条）。
    注意白雪公主那种 total=16 但 play_url 有 19 条的，多出来的是花絮/预告，以 total 为准。 */
function epsOf(v) {
  var t = parseInt(v && v.vod_total, 10);
  if (t > 0) return t;
  var pu = String((v && v.vod_play_url) || '');
  if (!pu) return 0;
  var best = 0;
  pu.split('$$$').forEach(function(line) {
    var n = line ? line.split('#').length : 0;
    if (n > best) best = n;
  });
  return best;
}

function parseSearch(text, s) {
  var j = JSON.parse(text);
  var list = Array.isArray(j.list) ? j.list : [];
  return list.map(function(v) {
    return {
      // 极速资源的片名带零宽空格（​尚公主​），不抹掉的话点进去回查源站会查不到
      title: String(v.vod_name || '').replace(/[\u200b-\u200f\ufeff]/g, '').trim(),
      cover: typeof v.vod_pic === 'string' ? v.vod_pic : '',
      rating: '', year: String(v.vod_year || ''), area: String(v.vod_area || ''),
      genre: String(v.type_name || ''),
      source: s.name || '源', sourceUrl: s.url,
      vodId: String(v.vod_id || ''),
      remarks: String(v.vod_remarks || '').replace(/[\u200b-\u200f\ufeff]/g, '').trim(),
      // 总集数：完结剧要显示「全40集」，排序也要按真实集数比，不能只靠 remarks 里的字
      eps: epsOf(v)
    };
  });
}

/* 搜索走 ac=videolist（字段全：名称 / 封面 / 年份 / 地区 / 类型 / 备注 / id）。
   体积靠原生层开 gzip 解决——实测 93KB 的 JSON 压到 23KB，比换 ac=list 划算：
   list 虽然只要 18KB，但量子/暴风以外的站点不返回年份、地区和封面，
   海报墙会变成一片纯色块，得不偿失。 */
function searchOne(s, wd, tmo) {
  var t0 = Date.now();
  var url = base(s.url) + '?ac=videolist&wd=' + encodeURIComponent(wd) + '&pg=1';
  return __LTV.req(url, tmo).then(function (text) {
    var list = parseSearch(text, s);
    console.log('[search] ' + (s.name || '源') + ' ' + (Date.now() - t0) + 'ms '
      + list.length + ' 条 ' + Math.round(String(text).length / 1024) + 'KB');
    return list;
  });
}

/** 失败原因压成一行，直接展示在空结果页上，便于在真机上判断是超时还是被拦 */
function srcErr(s, e) {
  var msg = String((e && e.message) || e || '未知错误');
  if (msg.length > 80) msg = msg.slice(0, 80) + '…';
  return (s.name || '源') + '：' + msg;
}

/* ------------------------------------------------------------ 搜索缓存 / 合并
   同一个关键词 10 分钟内再搜直接秒出（返回结果 → 点进去看看 → 退回来再搜，
   在手机上非常常见），后台照常刷新，条数有变化才重绘。 */
var SCACHE_TTL = 10 * 60 * 1000;
function scacheKey(wd) { return 'ltv_sc_' + normTitle(wd); }
function scacheGet(wd) {
  try {
    var raw = localStorage.getItem(scacheKey(wd));
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || !o.t || Date.now() - o.t > SCACHE_TTL) return null;
    return (Array.isArray(o.items) && o.items.length) ? o.items : null;
  } catch (e) { return null; }
}
function scacheSet(wd, items) {
  try {
    localStorage.setItem(scacheKey(wd),
      JSON.stringify({ t: Date.now(), items: items.slice(0, 120) }));
    /* 只留最近 12 个关键词，别把 localStorage 撑爆 */
    var ks = [], i, k;
    for (i = 0; i < localStorage.length; i++) {
      k = localStorage.key(i);
      if (k && k.indexOf('ltv_sc_') === 0) ks.push(k);
    }
    if (ks.length > 12) {
      ks.map(function (kk) {
        var t = 0;
        try { t = (JSON.parse(localStorage.getItem(kk)) || {}).t || 0; } catch (e) {}
        return { k: kk, t: t };
      }).sort(function (a, b) { return a.t - b.t; })
        .slice(0, ks.length - 12)
        .forEach(function (o) { try { localStorage.removeItem(o.k); } catch (e) {} });
    }
  } catch (e) {}
}

/** 合并：源站结果去重 + 补本地片库没有的片名，精确匹配排前面 */
function mergeResults(items, local, wd) {
  var seen = {}, seenTitle = {}, merged = [];
  items.forEach(function(it) {
    if (!it.title) return;
    var key = it.sourceUrl + '_' + it.vodId;
    if (seen[key]) return;
    seen[key] = 1;
    merged.push(it);
    seenTitle[normTitle(it.title)] = 1;
  });
  local.forEach(function(it) {
    if (seenTitle[normTitle(it.title)]) return;
    seenTitle[normTitle(it.title)] = 1;
    merged.push(it);
  });
  merged.sort(function(a, b) {
    var ae = normTitle(a.title) === normTitle(wd) ? 0 : 1;
    var be = normTitle(b.title) === normTitle(wd) ? 0 : 1;
    if (ae !== be) return ae - be;
    /* 排序规则（用户要求：正版更靠前、集数多的更靠前）：
       ① 片名完全等于关键词的最前
       ② 正版 / 独家 / VIP
       ③ 集数多的靠前（已完结按 60 计，更新至N集按 N 计）
        ④ 源站排在本地片库前
       ⑤ 同分按片名聚合，同一部片的多个源挨在一起 */
    var ar = a.remarks || a[7] || '', br = b.remarks || b[7] || '';
    var av = isVip(ar) ? 1 : 0, bv = isVip(br) ? 1 : 0;
    if (av !== bv) return bv - av;
    // 集数用接口给的真实值（vod_total / 播放条数），比 remarks 里的字准得多
    var an = epOfItem(a), bn = epOfItem(b);
    if (an !== bn) return bn - an;
    if (!!a.local !== !!b.local) return a.local ? 1 : -1;
    return String(a.title).localeCompare(String(b.title), 'zh-CN');
  });
  return merged;
}

async function doSearch(wd) {
  wd = String(wd || '').trim();
  if (!wd) { if (state.q) backHome(); return; }   // 清空关键词再点搜索 = 回推荐页
  var t0 = Date.now();
  stopHeroTimer();
  state.q = wd; state.busy = true;
  state.more = null;   // 从全库视图点海报搜索时，先把全库视图关掉
  var local = localSearch(wd);

  // 没有可用接口时不至于白屏：至少给出本地片库的结果
  if (!CFG.sources.length) {
    state.items = local; state.busy = false;
    renderResults(local, wd, 0, ['尚未配置采集接口'], false);
    return;
  }

  // 只打「上次检测确认能搜、且延迟低」的源，死源和仅列表源不再浪费一次超时
  var pool = rankedSources();

  /* 第一屏尽快有内容：缓存 > 本地片库 > 转圈 */
  var cached = scacheGet(wd);
  if (cached) {
    state.items = cached;
    renderResults(cached, wd, 0, [], false);
    console.log('[search] 命中缓存 ' + cached.length + ' 条，后台校正中');
  } else if (local.length) {
    state.items = local;
    renderResults(local, wd, 0, [], true);
  } else {
    renderLoading(wd, pool.length);
  }

  var items = [], failed = 0, errs = [], bad = [], done = 0;
  var paintTimer = 0, lastPaint = 0, lastCount = -1;

  /* 增量渲染：哪个源先回来就先画出来，不再等最慢的那个。
     以前是 Promise.all 一把等，7 个源里只要有 1 个拖到 15 秒，
     用户就盯着「正在补充接口结果…」看 15 秒。 */
  function paint(final) {
    if (state.q !== wd) return;
    var run = function () {
      lastPaint = Date.now();
      var merged = mergeResults(items, local, wd);
      if (!final && !merged.length) return;      // 还没结果就别画「0 条」出来
      if (final || merged.length !== lastCount) {
        lastCount = merged.length;
        state.items = merged;
        var sc = window.scrollY || 0;
        if (final) {
          state.busy = false;
          renderResults(merged, wd, failed, errs);
        } else {
          renderResults(merged, wd, 0, [], true,
            '正在补充其它接口…（' + done + '/' + pool.length + '）');
        }
        if (sc > 0) window.scrollTo(0, sc);
      }
      if (final && merged.length) scacheSet(wd, merged);
    };
    if (final) { clearTimeout(paintTimer); return run(); }
    var gap = Date.now() - lastPaint;
    if (gap > 400) return run();                 // 节流：0.4 秒内最多重绘一次
    clearTimeout(paintTimer);
    paintTimer = setTimeout(run, 400 - gap);
  }

  try {
    var tasks = pool.map(function(s) {
      return searchOne(s, wd, 11000).then(function(list) {
        if (state.q === wd) items = items.concat(list);
      }, function(e) {
        failed++; bad.push(s); errs.push(srcErr(s, e));
      }).then(function() {
        done++;
        paint(false);
      });
    });
    await Promise.all(tasks);
  } catch (e) {
    errs.push('搜索异常：' + ((e && e.message) || e));
    console.log('[search] ' + errs.join(' | '));
  }

  /* 一个源都没回数据时再来一轮。弱网下（华为 / 鸿蒙的移动网络尤其）第一轮
     多半是超时而不是真没这片，换个更长的超时、只打最快的两个失败源，往往就通了。
     只在「真的一条都没有」时才做，正常情况不多等一秒。 */
  if (!items.length && bad.length && state.q === wd) {
    var retry = bad.slice(0, 2);
    console.log('[search] 第一轮全空，重试 ' + retry.length + ' 个源（18s）');
    renderResults(local, wd, 0, [], true,
      '接口响应较慢，正在重试 ' + retry.length + ' 个源…');
    var again = await Promise.all(retry.map(function(s) {
      return searchOne(s, wd, 18000).catch(function() { return []; });
    }));
    again.forEach(function(list) { items = items.concat(list); });
  }

  if (state.q !== wd) return;          // 用户已经换词或返回，别把旧结果糊上去
  paint(true);
  var n = (state.items && state.items.length) || 0;
  console.log('[search] ' + wd + ' → ' + n + ' 条（源 ' + items.length
    + ' / 本地 ' + local.length + ' / 失败 ' + failed + ' / 用时 '
    + (Date.now() - t0) + 'ms）' + (errs.length ? ' ' + errs[0] : ''));
}

/* ---------------------------------------------------------------- 详情 / 线路
   苹果 CMS V10 的 vod_play_url 形如「线路1$$$线路2」，
   每条线路内为「第1集$URL1#第2集$URL2」。这里保留全部线路供切换。 */
function parseLines(playUrl) {
  if (!playUrl) return [];
  return playUrl.split('$$$').map(function(g, gi) {
    var eps = g.split('#').map(function(e) {
      var p = e.split('$');
      return p.length > 1 ? p[1].trim() : '';
    }).filter(function(u){ return /^https?:\/\//.test(u); });
    return { name: '线路' + (gi + 1), eps: eps };
  }).filter(function(l){ return l.eps.length > 0; });
}

function preferredLine(lines) {
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].eps.some(function(u){ return u.indexOf('.m3u8') > -1; })) return i;
  }
  return 0;
}

function openSheet(html) {
  $('sheetIn').innerHTML = html;
  fixSubs($('sheetIn'));
  $('sheet').classList.remove('hidden');
  syncBack();                      // 弹层是最外一层，返回键先关它
}
function closeSheet() {
  $('sheet').classList.add('hidden');
  $('sheetIn').innerHTML = '';
  syncBack();
}

/* 详情请求：ac=videolist&ids= 与 ac=detail&ids= 两种动作各试一次。
   默认 9 秒对详情太短——一条记录要带全部剧集地址 + 简介 HTML，常见 50~200KB，
   弱网十几秒是常态，超时就直接变成用户眼里的「解析不成功、地址不可用」。
   另外部分采集站只实现 ac=detail，换动作往往能救回来。 */
async function reqDetail(it, round) {
  var act = round === 0 ? 'videolist' : 'detail';
  var url = base(it.sourceUrl) + '?ac=' + act + '&ids=' + encodeURIComponent(it.vodId);
  var t0 = Date.now();
  var text = await __LTV.req(url, round === 0 ? 15000 : 22000);
  var j = JSON.parse(text);
  console.log('[detail] ' + act + ' ok ' + (Date.now() - t0) + 'ms ' + text.length + 'B');
  return (j.list && j.list[0]) || (j.data && j.data[0]) || {};
}

async function openDetail(idx) {
  var it = state.items && state.items[idx];
  if (!it) return;
  var v = null, lines = [], lastErr = null;
  for (var round = 0; round < 2; round++) {
    openSheet('<button class="sheet-close" onclick="closeSheet()">×</button>'
      + '<div class="center"><span class="spin"></span><br>正在读取播放列表…'
      + (round ? '<br><small>第 2 次尝试（换用另一条详情接口）</small>' : '')
      + '</div>');
    try {
      v = await reqDetail(it, round);
    } catch (e) {
      lastErr = e; v = null;
      console.log('[detail] 第 ' + (round + 1) + ' 次失败：' + ((e && e.message) || e));
      continue;
    }
    lines = parseLines(String(v.vod_play_url || ''));
    if (lines.length) break;              // 拿到地址就不用再试
    console.log('[detail] 第 ' + (round + 1) + ' 次没有 play_url，换动作再试');
  }
  if (!v) {
    // 两条详情接口都失败：给「重试 / 换接口」，不要只剩一句超时
    openSheet('<button class="sheet-close" onclick="closeSheet()">×</button>'
      + '<div class="center">读取详情失败<br><small>'
      + esc(String((lastErr && lastErr.message) || lastErr || '未知错误'))
      + '</small><div style="margin-top:14px;display:flex;gap:8px;justify-content:center">'
      + '<button class="btn" onclick="openDetail(' + idx + ')">重试</button>'
      + '<button class="btn ghost" onclick="__LTV.settings()">换接口</button></div></div>');
    return;
  }
  try {
    if (!lines.length) lines = parseLines(String(v.vod_content || ''));
    var desc = String(v.vod_content || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    var cover = it.cover || (typeof v.vod_pic === 'string' ? v.vod_pic : '');
    var li = preferredLine(lines);
    var eps = lines.length ? lines[li].eps : [];
    var html = '<button class="sheet-close" onclick="closeSheet()">×</button>'
      + '<div class="d-top">' + posterHtml({ title: it.title, cover: cover,
          year: String(v.vod_year || it.year), area: String(v.vod_area || it.area),
          genre: String(v.type_name || it.genre), rating: '', w: 78 })
      + '<div class="d-info"><h3>' + esc(it.title) + '</h3>'
      + '<p>' + esc([v.vod_year||it.year, normArea(v.vod_area||it.area), v.type_name||it.genre].filter(Boolean).join(' · ')) + '</p>'
      /* 详情页空间足够，「画质」和「版本」都摊开写：来源：量子资源 · 4K · 已完结 */
      + '<p>来源：' + esc(it.source)
      + (badgeText(v.vod_remarks || it.remarks, epsOf(v)) ? ' · ' + esc(badgeText(v.vod_remarks || it.remarks, epsOf(v))) : '') + '</p>'
      + '<button class="btn ghost" style="margin-top:8px" onclick="__LTV.settings()">接口设置</button>'
      + '</div></div>'
      + (desc ? '<p class="d-desc">' + esc(desc) + '</p>' : '')
      + '<div class="d-sub">选集 · 共 ' + eps.length + ' 集'
      /* 这一行只补画质：集数前面「共 N 集」已经写了，
         再拼一次 badgeText 会出现「共95集 · HD · 全95集」这种重复 */
      + (qInfo(v.vod_remarks || it.remarks) ? ' · ' + esc(qInfo(v.vod_remarks || it.remarks).text) : '')
      + (lines.length > 1 ? ' · ' + lines.length + ' 条线路' : '') + '</div>';
    if (!eps.length) {
      html += '<div class="center" style="padding:14px">该接口未返回播放地址，试试其它源或换源搜索</div>';
    } else {
      html += '<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">'
        + '<button class="btn" onclick="openPlayerFromDetail(0)">▶ 应用内播放</button>'
        + '<button class="btn ghost" onclick="openExternal(0)">兼容播放</button></div>'
        + '<div class="eps">';
      eps.forEach(function(u, i) {
        html += '<button class="' + (i===0?'hot':'') + '" onclick="openPlayerFromDetail(' + i + ')">第' + (i+1) + '集</button>';
      });
      html += '</div><p style="font-size:11px;color:var(--faint);margin-top:12px">'
        + '默认在 APP 内全屏播放，支持选集 / 倍速 / 线路切换 / 断点续播；'
        + '若片源无法解码，再用「兼容播放」交给外部播放器。</p>';
    }
    openSheet(html);
    window.__LINES = lines;
    window.__LI = li;
    window.__TITLE = it.title;
    window.__COVER = cover;
    /* 预热第 1 集：用户看简介 / 挑选集的这几秒足够把真地址摸出来 */
    if (eps.length) warmUp(lines, li, 0);
  } catch (e) {
    openSheet('<button class="sheet-close" onclick="closeSheet()">×</button>'
      + '<div class="center">读取详情失败<br><small>' + esc(e.message) + '</small>'
      + '<div style="margin-top:14px;display:flex;gap:8px;justify-content:center">'
      + '<button class="btn" onclick="openDetail(' + idx + ')">重试</button>'
      + '<button class="btn ghost" onclick="__LTV.settings()">换接口</button></div></div>');
  }
}

function openPlayerFromDetail(i) {
  var lines = window.__LINES || [];
  if (!lines.length) { toast('该片源暂无播放地址'); return; }
  closeSheet();
  openPlayer(window.__TITLE, window.__COVER || '', lines, window.__LI || 0, i || 0);
}

function openExternal(i) {
  var lines = window.__LINES || [], li = window.__LI || 0;
  var l = lines[li] || lines[0];
  if (l && l.eps[i]) __LTV.external(l.eps[i], window.__TITLE + ' 第' + (i+1) + '集');
  else toast('暂无播放地址');
}

/* ---------------------------------------------------------------- 应用内播放器
   解码策略（针对真机「卡顿 / 切换增强解码」优化）：
     1) 主路径：<video src> 交 Android WebView 原生媒体栈（HLS / MP4，硬件解码、
        无 CORS 限制、无 JS 转封装开销），这是最快最稳的路径。
     2) 多地址容错：同一集在不同线路常有不同 CDN；首个地址失败或超时会自动
        尝试其他线路同一集，并按「含 .m3u8 优先」排序，跳过 html 跳转页。
     3) 不再因「4 秒未就绪」自动切 hls.js —— 那正是卡顿与「切换增强解码」
        提示的来源。hls.js 改为用户手动点「增强解码」才启用（MSE 兜底）。
     4) 仍失败 → 提示「兼容播放」交外部播放器。 */
var PL = {
  lines: [], li: 0, ei: 0, title: '', cover: '',
  hls: null, hideTimer: null,
  /* 倍速档位：慢速用于看清台词，快速用于赶进度。
     2.5~5 倍是「跳过冗长段落」的实用区间，但也容易听不清，所以放在最后。 */
  rates: [0.75, 1, 1.25, 1.5, 2, 2.5, 3, 3.5, 4, 5], ri: 1,
  seeking: false, resume: 0,
  candidates: [], attempt: 0, loadTimer: null, softTimer: null,
  usingHls: false, fitCover: false, failed: false, live: false,
  /* 稳定性：token 隔离上一路片源的迟到事件；pass 记录重试轮次；
     triedHls 保证「原生明确不支持格式」时自动试 MSE 只发生一次。
     prechecked 记录已做过清单结构预检的地址，避免重试轮反复探测；
     mseUrl 保存「原生解析不了、必须走 MSE」的那一路地址 */
  token: 0, pass: 0, triedHls: false, lastSave: 0, lastErr: '', sawCode4: false,
  prechecked: {}, mseUrl: '', webOnly: 0,
  loading: false,                    // 起播等待层是否亮着（setStatus 据此改走等待层）
  /* 手势：skipClick 用来吃掉「滑动结束后浏览器补发的 click」，
     否则每次拖完进度条都会顺手把控制条开关一次 */
  skipClick: 0
};

function setStatus(msg, buttons) {
  var el = $('pStatus');
  if (!msg) { el.classList.remove('on'); el.innerHTML = ''; return; }
  /* 起播阶段的「正在解析片源 / 正在缓冲」直接写进等待层，
     不再在画面正中弹一个突兀的小黑框（那是观感差的主要原因）。 */
  if (PL.loading && !PL.failed && !buttons) { setLoadText(msg); return; }
  el.innerHTML = '<div>' + esc(msg) + '</div>'
    + (buttons ? '<div>' + buttons + '</div>' : '');
  el.classList.add('on');
}

/* ---------------------------------------------------------- 起播等待层 */
function showLoad(name, sub) {
  var el = $('pLoad');
  if (!el) return;
  var cover = String(PL.cover || '').replace(/["'()\\]/g, '');
  $('pLoadBd').style.backgroundImage = cover ? 'url("' + cover + '")' : 'none';
  $('pLoadName').textContent = name || PL.title || '';
  $('pLoadSub').textContent = sub || '正在准备播放…';
  el.classList.remove('out');
  el.classList.add('on');
  $('player').classList.add('loading');
}
function setLoadText(sub) {
  var el = $('pLoad');
  if (!el || !el.classList.contains('on')) return;
  var t = $('pLoadSub');
  if (t.textContent !== sub) t.textContent = sub;
}
function hideLoad() {
  var el = $('pLoad');
  if (!el || !el.classList.contains('on')) return;
  $('player').classList.remove('loading');
  el.classList.add('out');
  setTimeout(function() {
    if (el.classList.contains('out')) el.classList.remove('on', 'out');
  }, 460);
}
/* 失败面板上的「重试」：整集重来一遍（含播放页重解析、候选重建），
   移动网络抖一下就判死太粗暴了 */
function retryThis() {
  PL.attempt = 0; PL.pass = 0;
  playAt(PL.ei);
}

function fail(msg) {
  PL.failed = true;
  PL.loading = false;
  hideLoad();                       // 先收起等待层，错误面板才看得清
  var btns = '<button class="btn" onclick="retryThis()">重试</button>';
  if (PL.lines.length > 1) {
    btns += '<button class="btn" onclick="retryNextLine()">换线路重试</button>';
  }
  btns += '<button class="btn" onclick="openExternalCurrent()">兼容播放</button>'
    + '<button class="btn ghost" onclick="manualHls()">增强解码</button>';
  setStatus(msg, btns);
}

function clearLoadTimers() {
  clearTimeout(PL.loadTimer); clearTimeout(PL.softTimer);
  clearTimeout(PL.startTimer);
  PL.loadTimer = null; PL.softTimer = null; PL.startTimer = null;
}
function destroyHls() {
  if (PL.hls) { try { PL.hls.destroy(); } catch (e) {} PL.hls = null; }
  PL.usingHls = false;
}

/* 候选播放地址：当前线路本集 + 其他线路同一集，m3u8 优先、去重。
   解决「首地址是 html 跳转页 / 某条 CDN 超时」导致的加载失败。 */
/* 已知正版平台的网页地址 / 普通网页后缀：采集站偶尔把「聚合搜索页」当播放地址返回
   （如建安资源整站都是爱奇艺、优酷、腾讯、芒果、B 站链接）。这类地址永远不可能
   是直链视频流，留着只会让播放器白等一轮 12 秒超时再报「格式不支持」。 */
var WEB_PAGE_HOST = /^https?:\/\/(?:[a-z0-9-]+\.)*(?:iqiyi|youku|qq|mgtv|bilibili|migu|sohu|pptv|le|tudou|wasu|acfun|douyin|kuaishou)\.(?:com|cn|tv)\//i;
var WEB_PAGE_EXT = /\.(?:html?|shtml)(?:[?#]|$)/i;
function isWebPage(u) {
  return WEB_PAGE_HOST.test(u) || WEB_PAGE_EXT.test(u);
}

/* ------------------------------------------------- 采集站「播放页」解析
   部分采集接口的 vod_play_url 给的不是媒体流，而是自家播放页，例如
     https://xxx.com/share/10381a708c9f1f122da0db7005c0f452
   这页里用脚本变量存着真地址（含签名）：
     const url = "/20261105/44933_10381a70/index.m3u8?sign=56d40a5d…"
   把它直接交给 <video> 只会换回 MEDIA_ERR_SRC_NOT_SUPPORTED，界面显示
   「格式不支持 / 地址不可用」。所以识别出这类地址后先抓页面、抠出真地址再播。 */
var MEDIA_RE = /\.(?:m3u8|mp4|flv|mkv|m4v|webm|mov|ts|mp3|m4a)(?:[?#]|$)/i;
var PAGE_PATH = /\/(?:share|play|vplay|vodplay|bf|xplay|player|video|vod)\b|\.(?:php|asp|aspx|cgi)(?:[?#]|$)/i;

function isPlayPage(u) {
  u = String(u || '');
  if (MEDIA_RE.test(u)) return false;      // 本身就是媒体文件，不用解析
  return PAGE_PATH.test(u) || isWebPage(u);
}

function absUrl(u, base) {
  if (/^https?:/i.test(u)) return u;
  try { return new URL(u, base).href; } catch (e) {}
  var m = /^(https?:\/\/[^\/]+)/i.exec(base);
  return (m ? m[1] : '') + (u.charAt(0) === '/' ? u : '/' + u);
}

/** 从播放页 HTML 里抠媒体地址：优先 m3u8，保留 sign 等查询参数 */
/** 有些采集站的分享页把地址拆成两段：
      var main = "/20261023/20013_b31b31e1/index.m3u8?sign=..."
      var redirecturl = "http://vip.okzybo.com"
    这里给出「用 redirecturl 作 base」的版本，作为同域地址的备选。
    注意：不能反过来把它当首选 —— 实测量子资源的 redirecturl 域名
    （vip.okzybo.com）已经 NXDOMAIN，真资源其实在分享页同域下。
    所以优先级是「同域 > redirecturl」，由探活最终确认。 */
function extractSplitUrl(html) {
  var s = String(html || '').replace(/\\\//g, '/');
  var m = /var\s+main\s*=\s*['"]?([^\s'";]+?\.(?:m3u8|mp4)[^\s'";]*)/i.exec(s);
  if (!m) return '';
  var path = m[1];
  if (/^https?:\/\//i.test(path)) return path;
  var b = /var\s+redirecturl\s*=\s*['"]?(https?:\/\/[^'"\s;]+)/i.exec(s);
  if (b) {
    var base = b[1].replace(/\/+$/, '');
    return base + (path.charAt(0) === '/' ? path : '/' + path);
  }
  return '';
}

/** 从播放页里列出所有可能的媒体地址，按可信度排序。
    排序原则：先用「和播放页同域」的地址，再用页面自己声明的 redirecturl，
    最后才是页面里的绝对地址。理由：有些站的 redirecturl 早就废弃了
    （实测量子资源填的 vip.okzybo.com 已 NXDOMAIN，而资源其实就在分享页
    同一域名下 —— 它的 share.js 里写的正是 window.location.host + main）。
    最终由调用方探活决定用哪个，不靠猜。 */
function extractMediaList(html, baseUrl) {
  var s = String(html || '').replace(/\\\//g, '/');
  var seen = {}, list = [];
  function push(u) {
    u = String(u || '');
    if (!/^https?:\/\//i.test(u) || seen[u]) return;
    seen[u] = 1; list.push(u);
  }
  var origin = '';
  var om = /^(https?:\/\/[^\/?#]+)/i.exec(String(baseUrl || ''));
  if (om) origin = om[1];

  /* 1) var main 拆分式：同域优先，redirecturl 作备选。
     实测 v.lzcdn27.com 这类站，资源就在分享页同一域名下
     （share.js 里写的就是 window.location.host + main），
     redirecturl 里那个域名可能早就废弃了。
     所以顺序必须是「页面同域 → redirecturl → 绝对地址」，
     再由调用方探活确认哪个真能下载。 */
  var mainM = /var\s+main\s*=\s*['"]?([^\s'";]+?\.(?:m3u8|mp4)[^\s'";]*)/i.exec(s);
  if (mainM) {
    push(absUrl(mainM[1], baseUrl));                   // 同域（首选）
    var split = extractSplitUrl(s);                    // redirecturl（备选）
    if (split) push(split);
  }

  /* 2) 绝对地址 */
  var reAbs = /https?:\/\/[^\s"'<>\)]+?\.(?:m3u8|mp4|flv|mkv|m4v|webm)(?:\?[^\s"'<>\)]*)?/gi, m;
  while ((m = reAbs.exec(s))) push(m[0]);

  /* 3) 带引号的相对路径。以 / 开头时 absUrl 就按域名根解析，
     origin + path 只是 URL 解析失败时的兜底（两者通常同值，会被去重）。 */
  var reRel = /["'](\/[^"'\s<>]+?\.(?:m3u8|mp4|flv|mkv|m4v|webm)(?:\?[^"'\s<>]*)?)["']/gi;
  while ((m = reRel.exec(s))) {
    push(absUrl(m[1], baseUrl));
    if (origin) push(origin + m[1]);
  }

  /* 4) 无引号的相对路径兜底（如 const url = /path/x.m3u8 漏了引号的情况）。
     负向前瞻 (?!\/) 必须有：否则 https:// 里的冒号会被当成赋值号，
     把 "//host/play/x.m3u8" 整段当路径，再拼出
     "https://host//host/play/x.m3u8" 这种垃圾候选。 */
  var reBare = /[=:]\s*(\/(?!\/)[^\s'";<>]+?\.(?:m3u8|mp4)(?:\?[^\s'";<>]*)?)/gi;
  while ((m = reBare.exec(s))) {
    push(absUrl(m[1], baseUrl));
    if (origin) push(origin + m[1]);
  }

  /* m3u8 优先：页面里的 mp4 往往是预告片 */
  list.sort(function (a, b) {
    return (/m3u8/i.test(b) ? 1 : 0) - (/m3u8/i.test(a) ? 1 : 0);
  });
  return list;
}

function extractMedia(html, baseUrl) {
  /* 统一走 extractMediaList，避免「同步版和异步版两套逻辑」结论不一致。
     之前就是同步版优先 redirecturl、异步版优先同域，同一页面给出两种结果。 */
  return extractMediaList(html, baseUrl)[0] || '';
}

async function resolvePlayPage(url) {
  var t0 = Date.now();
  var text = await __LTV.req(safeUrl(url), 15000);
  var list = extractMediaList(text, url);
  if (!list.length) {
    console.log('[pl] page ' + String(url).slice(0, 80) + ' -> 无候选 ' + (Date.now() - t0) + 'ms');
    throw new Error('播放页里没有媒体地址');
  }
  /* 候选可能不止一个（页面目录 / 域名根两种拼接），并发探活取第一个真能用的。
     只探前 3 个：再多就是同一批路径的重复变体，收益低。并发做，总耗时等于最慢那个。 */
  var cand = list.slice(0, 3);
  var okList = [];
  if (cand.length > 1 && HAS_NATIVE && Android.probe) {
    okList = await Promise.all(cand.map(function (u) {
      return __LTV.probe(u)
        .then(function (r) { return /#EXTM3U/i.test(String((r && r.body) || '')) ? u : ''; })
        .catch(function () { return ''; });
    }));
  }
  var real = '';
  for (var i = 0; i < okList.length; i++) if (okList[i]) { real = okList[i]; break; }
  if (!real) real = list[0];          // 都没探通就用首选，交给播放器再试一轮
  console.log('[pl] page ' + String(url).slice(0, 80) + ' -> ' + real
    + ' (候选 ' + list.length + '，探活通过 ' + okList.filter(Boolean).length + ') '
    + (Date.now() - t0) + 'ms ' + String(text || '').length + 'B');
  return real;
}

/* ------------------------------------------------------- 站点画像（加速用）
   「直链 m3u8 不带 sign 就播不了、必须抓播放页换签名」是站点级的特性，
   不是某一部片子的特性。第一次踩过之后记下来，同一个站点以后就直接
   先解析播放页，省掉那条必然失败的尝试（实测一次白等 6~9 秒）。 */
var HINT = {
  m: {},
  load: function () {
    try { this.m = JSON.parse(localStorage.getItem('ltv_hint') || '{}') || {}; }
    catch (e) { this.m = {}; }
  },
  save: function () {
    try { localStorage.setItem('ltv_hint', JSON.stringify(this.m)); } catch (e) {}
  },
  set: function (host) {
    if (!host || this.m[host]) return;
    this.m[host] = Date.now();
    this.save();
  },
  has: function (host) { return !!this.m[host]; }
};
HINT.load();

function hostOf(u) {
  var m = /^https?:\/\/([^\/?#]+)/i.exec(String(u || ''));
  return m ? m[1].toLowerCase() : '';
}

/* 预热：用户还在详情页看简介 / 选集时，后台就把这一集的地址摸出来。
   命中的话点「应用内播放」直接出画面，不用再等一次往返。 */
var WARM = { page: {}, probe: {} };

function warmUp(lines, li, ei) {
  var r = candidatesFor(lines, li, ei || 0);
  var list = r.list;
  var nPage = 0;
  for (var k in r.pageMap) if (r.pageMap[k]) nPage++;
  console.log('[warm] 候选 ' + list.length + ' 条（播放页 ' + nPage + ' / 网页 '
    + r.web + '）first=' + String(list[0] || '(空)').slice(0, 90));
  if (!list.length) return;
  /* 播放页候选（可能有好几条）先解析：解析出来就是能直接喂播放器的真地址 */
  list.filter(function (u) { return r.pageMap[u]; }).slice(0, 2).forEach(function (pg) {
    if (WARM.page[pg] && Date.now() - WARM.page[pg].t < WARM_TTL) return;
    resolvePlayPage(pg).then(function (real) {
      WARM.page[pg] = { u: real, t: Date.now() };
      console.log('[warm] page ok ' + String(real).slice(0, 90));
      /* 能换出地址说明这个站点要签名，记进画像 */
      HINT.set(hostOf(pg)); HINT.set(hostOf(real));
      /* 真地址的清单结构也顺手探掉，点播放时连 4KB 预检都不用等 */
      if (/\.m3u8(\?|$)/i.test(real)) {
        __LTV.probe(safeUrl(real)).then(function (res) {
          WARM.probe[real] = { v: scanManifest(res.body), t: Date.now() };
        }).catch(function () {});
      }
    }).catch(function () {});
  });
  /* 第一个直链顺手探一次清单结构（只读 4KB），命中就不用再请求 */
  var first = list[0];
  if (r.pageMap[first] || !/\.m3u8(\?|$)/i.test(first)) return;
  if (warmProbe(first)) return;
  __LTV.probe(safeUrl(first)).then(function (res) {
    WARM.probe[first] = { v: scanManifest(res.body), t: Date.now() };
  }).catch(function () {});
}

/* 预热缓存有效期：签名的真地址会过期，超过 2 分钟就当没有，重新解析 */
var WARM_TTL = 120000;
function warmProbe(u) {
  var c = WARM.probe[u];
  if (!c) return null;
  if (Date.now() - c.t > WARM_TTL) { delete WARM.probe[u]; return null; }
  return c.v;
}

/** 与播放状态无关的候选构建，详情页预热也能用 */
function candidatesFor(lines, li, ei) {
  var out = [], seen = {}, web = 0, pageMap = {};
  function add(u) {
    u = (u || '').replace(/\s+/g, '');   // 采集站偶尔夹带空白 / 换行
    if (!/^https?:\/\//i.test(u) || seen[u]) return;
    seen[u] = 1;
    /* 判定顺序很关键：采集站的播放页常写成 /share/xxx.html，
       先按「正版网页」丢掉就再也解析不出真地址了（候选直接空 → 只剩网页提示）。
       所以先认 PAGE_PATH，再认媒体后缀，最后才当正版网页。 */
    if (!MEDIA_RE.test(u) && PAGE_PATH.test(u)) {
      pageMap[u] = 1;                    // 采集站播放页：播放前先解析出真地址
      out.push(u);
      return;
    }
    if (isWebPage(u)) { web++; return; }  // 正版平台网页，确实播不了
    if (isPlayPage(u)) pageMap[u] = 1;
    out.push(u);
  }
  var cur = lines[li] && lines[li].eps[ei];
  if (cur && /\.m3u8/i.test(cur)) add(cur);                      // 当前线路 HLS 最优先
  lines.forEach(function(l){ if (l.eps[ei] && /\.m3u8/i.test(l.eps[ei])) add(l.eps[ei]); });
  if (cur) add(cur);
  lines.forEach(function(l){ add(l.eps[ei]); });                 // 其余（含 MP4）

  var media = [], pages = [];
  out.forEach(function(u){ (pageMap[u] ? pages : media).push(u); });
  /* 能直接播的排前面；播放页要额外抓一次才能拿到真地址，放最后再解析。
     例外：这个站点已确认「直链必须带 sign」，那播放页就是最短路径，
     直接提到最前面，不用再拿一条必然 403 的地址去撞。
     同一个 host 上的裸直链也一并剔掉——签名策略是站点级的，
     留着只会多跑一次注定失败的尝试。 */
  var needPage = pages.some(function(u){ return HINT.has(hostOf(u)); });
  if (needPage) {
    var ph = {};
    pages.forEach(function(u){ ph[hostOf(u)] = 1; });
    media = media.filter(function(u){ return !ph[hostOf(u)]; });
  }
  return { list: needPage ? pages.concat(media) : media.concat(pages),
           pageMap: pageMap, web: web };
}

function buildCandidates(i) {
  var r = candidatesFor(PL.lines, PL.li, i);
  PL.pageMap = r.pageMap;
  PL.webOnly = r.web;                  // 供 playAt 判断「是不是只有网页链接」
  return r.list;
}

/* 「铺满」的放大倍数：以 contain 为基准，最多再放大 12%。
   16:9 片源放到 20:9 屏上，真正铺满要 1.25 倍（上下各裁 10%），这里只放到 1.12，
   黑边从 10% 收到约 5%，而画面内容仍然完整——用户反馈「铺满把人脸字幕切了」就是
   因为原来直接上 object-fit:cover，放大倍率没有上限。
   竖屏时这个比值可能是 3 倍以上，同样被 1.12 挡住，不会把画面怼成一团马赛克。 */
var FIT_MAX = 1.12;
function fitScale() {
  var v = $('v'), p = $('player');
  var vw = v.videoWidth || 0, vh = v.videoHeight || 0;
  var bw = p.clientWidth || 0, bh = p.clientHeight || 0;
  if (!vw || !vh || !bw || !bh) return FIT_MAX;      // 元数据还没到，先按上限放
  var cover = Math.max(bw / vw, bh / vh);
  var contain = Math.min(bw / vw, bh / vh);
  if (!contain || !cover) return FIT_MAX;
  return Math.max(1, Math.min(cover / contain, FIT_MAX));
}
/** 按当前状态重算并应用缩放（元数据到达 / 转屏 / 切集后都要重来一次） */
function applyFit() {
  var v = $('v');
  if (!PL.fitCover) { v.classList.remove('cover'); v.style.transform = ''; return; }
  var s = fitScale();
  v.classList.add('cover');
  v.style.transform = s > 1.001 ? 'scale(' + s.toFixed(3) + ')' : '';
}
function setVideoFit(cover, silent) {
  var was = PL.fitCover;
  PL.fitCover = !!cover;
  applyFit();
  $('pFit').textContent = PL.fitCover ? '铺满' : '适应';
  $('pFit').classList.toggle('on', PL.fitCover);
  // 只在用户手动打开、且确实被上限挡住时提示一次，免得以为按钮没生效
  if (!silent && PL.fitCover && !was) {
    var v = $('v'), p = $('player');
    if (v.videoWidth && p.clientWidth) {
      var need = Math.max(p.clientWidth / v.videoWidth, p.clientHeight / v.videoHeight)
               / Math.min(p.clientWidth / v.videoWidth, p.clientHeight / v.videoHeight);
      if (need > FIT_MAX + 0.01) toast('已尽量铺满：再放大就要裁掉画面了');
    }
  }
}

function progKey() { return 'ltv_prog_' + PL.title + '_' + PL.li + '_' + PL.ei; }
function loadProgress() { try { return parseFloat(localStorage.getItem(progKey())) || 0; } catch (e) { return 0; } }
/* localStorage 写入按 5 秒节流：timeupdate 每 250ms 写一次会占用 WebView
   主线程 I/O，是「播放中偶尔一顿」的隐性来源。切换 / 暂停 / 关闭时强制落盘。 */
function saveProgress(force) {
  if (PL.live) return;                 // 直播频道不记「看到第几秒」
  try {
    var v = $('v');
    if (!v.duration || v.currentTime <= 3) return;
    var now = Date.now();
    if (!force && now - PL.lastSave < 5000) return;
    PL.lastSave = now;
    localStorage.setItem(progKey(), String(v.currentTime));
  } catch (e) {}
}

function currentUrl() {
  var l = PL.lines[PL.li];
  return l ? (l.eps[PL.ei] || '') : '';
}
function openExternalCurrent() {
  var u = '';
  for (var k = 0; k < PL.candidates.length; k++) {
    if (/\.m3u8/i.test(PL.candidates[k])) { u = PL.candidates[k]; break; }
  }
  if (!u) u = currentUrl();
  if (u) __LTV.external(u, PL.title + ' 第' + (PL.ei + 1) + '集');
  else toast('暂无播放地址');
}

/* 换下一条线路并尽量停在当前集（该线路集数不足则退到最后一集）。
   用于「当前线路整条 CDN 都不可用」时的快速兜底。 */
function retryNextLine() {
  if (PL.lines.length < 2) return;
  saveProgress(true);
  PL.li = (PL.li + 1) % PL.lines.length;
  PL.resume = 0; PL.pass = 0; PL.triedHls = false; PL.sawCode4 = false;
  renderLines(); updateSub();
  var eps = (PL.lines[PL.li] || { eps: [] }).eps || [];
  playAt(Math.max(0, Math.min(PL.ei, eps.length - 1)));
}

function showControls() {
  $('pMask').classList.remove('hide');
  clearTimeout(PL.hideTimer);
  PL.hideTimer = setTimeout(function(){
    if (!$('pEps').classList.contains('on')) $('pMask').classList.add('hide');
  }, 3500);
}

function updateSub() {
  $('pName').textContent = PL.title;
  $('pSub').textContent = PL.live
    ? ('直播 · ' + (PL.lines.length > 1 ? PL.lines[PL.li].name + '（共 ' + PL.lines.length + ' 个源）' : '单源'))
    : ((PL.lines.length > 1 ? PL.lines[PL.li].name + ' · ' : '')
      + '第' + (PL.ei + 1) + '集 / 共' + ((PL.lines[PL.li] || {eps:[]}).eps.length) + '集');
  $('pLine').textContent = '线路 ' + (PL.li + 1) + (PL.lines.length > 1 ? '/' + PL.lines.length : '');
}

function renderLines() {
  $('pLines').innerHTML = PL.lines.map(function(l, i) {
    return '<button class="' + (i === PL.li ? 'on' : '') + '" onclick="switchLine(' + i + ')">'
      + esc(l.name) + ' · ' + l.eps.length + '集</button>';
  }).join('');
}

function renderEps() {
  var eps = (PL.lines[PL.li] || {eps:[]}).eps;
  $('pEpsSub').textContent = PL.title + ' · ' + eps.length + ' 集';
  $('pEpGrid').innerHTML = eps.map(function(u, i) {
    return '<button class="' + (i === PL.ei ? 'on' : '') + '" onclick="playAt(' + i + ')">' + (i+1) + '</button>';
  }).join('');
}

function switchLine(i) {
  if (i === PL.li || !PL.lines[i]) return;
  saveProgress(true);
  PL.li = i; PL.ei = 0; PL.resume = 0;
  renderLines(); renderEps(); updateSub();
  playAt(0);
}

/* ---------------------------------------------------------------- 跳过片头/片尾
   需求：「增加选项，选择后视频可跳过片头、片尾」。
   两层配置：
     · 全局默认（ltv_skip_global）：所有片通用，适合「我看的剧片头都是 90 秒」
     · 单片覆盖（ltv_skip_map[片名]）：某部剧单独设置，优先于全局
   两者都是 {h:片头秒数, t:片尾秒数, on:是否启用}。h/t 为 0 表示不跳那一段。

   为什么不自动识别片头：公开采集源没有章节元数据，靠音频指纹/黑帧检测在
   WebView 里既不可靠又费电。所以做成「手动设定一次、之后自动跳」，这也是
   绝大多数播放器的做法。 */
var SKIP_KEY_G = 'ltv_skip_global';
var SKIP_KEY_M = 'ltv_skip_map';
var SKIP = { h: 0, t: 0, on: false, auto: true };  // 当前生效的配置（已合并）
var SKIP_UI = { shown: '', autoHead: 0, autoTail: 0 };  // 提示状态 + 本集是否已自动处理头/尾

function skipLoadGlobal() {
  try {
    var o = JSON.parse(localStorage.getItem(SKIP_KEY_G) || 'null');
    if (o && typeof o === 'object') {
      return { h: +o.h || 0, t: +o.t || 0, on: !!o.on, auto: o.auto !== false };
    }
  } catch (e) {}
  return { h: 0, t: 0, on: false, auto: true };
}
function skipSaveGlobal(v) {
  try { localStorage.setItem(SKIP_KEY_G, JSON.stringify(v)); } catch (e) {}
}
function skipMapLoad() {
  try { return JSON.parse(localStorage.getItem(SKIP_KEY_M) || '{}') || {}; } catch (e) { return {}; }
}
function skipMapSave(m) {
  try { localStorage.setItem(SKIP_KEY_M, JSON.stringify(m)); } catch (e) {}
}

/** 取当前片子的配置：单片优先，没设过就用全局 */
function skipFor(title) {
  var m = skipMapLoad();
  var one = title && m[title];
  if (one && typeof one === 'object') {
    return { h: +one.h || 0, t: +one.t || 0, on: !!one.on,
             auto: one.auto !== false, scoped: true };
  }
  var g = skipLoadGlobal();
  g.scoped = false;
  return g;
}

/** 播放开始/切集时刷新生效配置 */
function skipApply(title) {
  SKIP = skipFor(title || PL.title || '');
  SKIP_UI.shown = '';
  SKIP_UI.autoHead = 0;       // 每集重新判定自动跳过
  SKIP_UI.autoTail = 0;
  renderSkipMarks();
  var btn = $('pSkip');
  if (btn) btn.classList.remove('on');
  var cfgBtn = $('pSkipCfg');
  if (cfgBtn) cfgBtn.classList.toggle('on', !!SKIP.on);
}

/** 把片头/片尾区间画在进度条上（只在启用且有设置时） */
function renderSkipMarks() {
  var box = document.querySelector('.p-seek');
  if (!box) return;
  var oldH = box.querySelector('.p-mark.head'), oldT = box.querySelector('.p-mark.tail');
  if (oldH) oldH.remove();
  if (oldT) oldT.remove();
  var v = $('v');
  var dur = (v && v.duration) || 0;
  if (!SKIP.on || !dur) return;
  if (SKIP.h > 0) {
    var dH = document.createElement('div');
    dH.className = 'p-mark head';
    dH.style.width = Math.min(50, SKIP.h / dur * 100) + '%';
    box.appendChild(dH);
  }
  if (SKIP.t > 0) {
    var dT = document.createElement('div');
    dT.className = 'p-mark tail';
    dT.style.width = Math.min(50, SKIP.t / dur * 100) + '%';
    box.appendChild(dT);
  }
}

/** 当前集是否还有下一集（含跨线路） */
function skipHasNext() {
  var eps = (PL.lines[PL.li] || {}).eps || [];
  return (PL.ei + 1 < eps.length) || (PL.li + 1 < PL.lines.length);
}

/** 根据播放时间决定显示「跳过片头」还是「跳过片尾」。
    片头区间内 → 跳到片头结束；进入片尾区间 → 直接下一集（或跳到结尾）。
    用户手动拖回片头时不重复弹，避免烦人。 */
function updateSkipBtn(cur, dur) {
  var btn = $('pSkip');
  if (!btn) return;
  if (PL.live || !SKIP.on || !dur) { btn.classList.remove('on'); return; }

  var inHead = SKIP.h > 0 && cur < SKIP.h - 0.5;
  var inTail = SKIP.t > 0 && cur >= dur - SKIP.t;

  /* ---- 自动跳过 ----
     用户要的是「选择后即可跳过」。auto=true 时：
       · 起播落在片头里 → 直接跳到片头结束，不再等用户点
       · 进入片尾 → 直接进下一集（最后一集则跳到结尾）
     只做一次：autoHead/autoTail 记住已处理过，用户手动拖回片头不会被反复弹走。 */
  /* 片头、片尾必须用两个独立标记。
     曾经共用 autoDone：跳完片头把它设成 'head' 之后，片尾那段
     「if (SKIP.auto && !SKIP_UI.autoDone)」就永远进不来，
     结果是一集播到片尾也不会自动跳下一集（单测抓到的真实 bug）。 */
  if (SKIP.auto) {
    if (SKIP.h > 0 && cur < SKIP.h - 0.5) {
      if (!SKIP_UI.autoHead) {
        SKIP_UI.autoHead = 1;
        try { $('v').currentTime = Math.min(dur - 1, SKIP.h + 0.2); } catch (e) {}
        toast('已自动跳过片头 ' + SKIP.h + ' 秒');
        btn.classList.remove('on');
        return;
      }
    } else if (SKIP.h > 0 && cur >= SKIP.h) {
      /* 起播点本来就在片头之后 → 标记已处理，之后拖动不再触发 */
      SKIP_UI.autoHead = 1;
    }
    if (SKIP.t > 0 && cur >= dur - SKIP.t && !SKIP_UI.autoTail) {
      SKIP_UI.autoTail = 1;
      btn.classList.remove('on');
      if (skipHasNext()) { stepEp(1); toast('已自动跳过片尾'); }
      else { try { $('v').currentTime = Math.max(0, dur - 0.3); } catch (e) {} toast('已自动跳过片尾'); }
      return;
    }
  }

  if (inHead) {
    if (SKIP_UI.shown === 'head' || SKIP_UI.shown === 'headDone') return;
    SKIP_UI.shown = 'head';
    btn.textContent = '跳过片头 ›';
    btn.setAttribute('data-mode', 'head');
    btn.classList.add('on');
  } else if (inTail) {
    if (SKIP_UI.shown === 'tail' || SKIP_UI.shown === 'tailDone') return;
    SKIP_UI.shown = 'tail';
    btn.textContent = skipHasNext() ? '跳过片尾，下一集 ›' : '跳过片尾 ›';
    btn.setAttribute('data-mode', 'tail');
    btn.classList.add('on');
  } else {
    if (SKIP_UI.shown) { SKIP_UI.shown = ''; btn.classList.remove('on'); }
  }
}

/** 点跳过按钮 */
function doSkip() {
  var btn = $('pSkip');
  var v = $('v');
  if (!btn || !v) return;
  var mode = btn.getAttribute('data-mode');
  var dur = v.duration || 0;
  btn.classList.remove('on');

  if (mode === 'head') {
    SKIP_UI.shown = 'headDone';
    SKIP_UI.autoHead = 1;
    try { v.currentTime = Math.min(dur - 1, SKIP.h + 0.2); } catch (e) {}
    toast('已跳过片头 ' + SKIP.h + ' 秒');
    return;
  }
  SKIP_UI.shown = 'tailDone';
  SKIP_UI.autoTail = 1;
  if (skipHasNext()) { stepEp(1); toast('已跳过片尾'); }
  else { try { v.currentTime = Math.max(0, dur - 0.3); } catch (e) {} toast('已跳过片尾'); }
}

/** 打开跳过设置面板（播放器内） */
function openSkipCfg() {
  var cur = skipFor(PL.title || '');
  var dur = ($('v') && $('v').duration) || 0;
  function num(id, val, ph) {
    return '<input id="' + id + '" type="number" min="0" max="600" step="1"'
      + ' value="' + (val || '') + '" placeholder="' + ph + '"'
      + ' style="width:100%;box-sizing:border-box;background:var(--chip);'
      + 'border:1px solid var(--line);border-radius:8px;padding:9px 11px;'
      + 'color:var(--text);font-size:14px;font-family:inherit">';
  }
  var html = '<h4>跳过片头 / 片尾</h4>'
    + '<div class="sub">' + esc(PL.title || '') + (dur ? ' · 本集时长 ' + fmtTime(dur) : '') + '</div>'
    + '<div class="skip-cfg">'
    + '<label><span>片头</span>' + num('skHead', cur.h, '秒，如 90') + '<em>秒</em></label>'
    + '<label><span>片尾</span>' + num('skTail', cur.t, '秒，如 120') + '<em>秒</em></label>'
    + '</div>'
    + '<div class="skip-auto">'
    + '<label class="sw"><input type="checkbox" id="skAuto"' + (cur.auto !== false ? ' checked' : '')
    + '><span>自动跳过（不用每次点「跳过」按钮）</span></label>'
    + '<p class="skip-tip">填 0 或不填表示不跳那一段。自动跳过关闭时，播放到片头/片尾'
    + '会浮出「跳过」按钮，点一下才跳。</p>'
    + '</div>'
    + '<div class="skip-acts">'
    + '<button class="btn" id="skSave">保存</button>'
    + '<button class="btn ghost" id="skOff">关闭跳过</button>'
    + '</div>'
    + '<div class="skip-scope">'
    + '<button class="lnk" id="skAll">同时应用到所有影片</button>'
    + '</div>';
  openSheet(html);
}

/** 保存设置。scope: 'this' 只作用于当前片名，'all' 写成全局默认 */
function saveSkipCfg(scope, on) {
  var hEl = $('skHead'), tEl = $('skTail'), aEl = $('skAuto');
  var h = Math.max(0, Math.min(600, parseInt(hEl && hEl.value, 10) || 0));
  var t = Math.max(0, Math.min(600, parseInt(tEl && tEl.value, 10) || 0));
  var auto = !!(aEl && aEl.checked);
  var cfg = { h: h, t: t, on: on !== false && (h > 0 || t > 0), auto: auto };
  if (scope === 'all') {
    skipSaveGlobal(cfg);
    /* 应用全局时清掉本片的单独设置，否则单片覆盖会盖住全局，用户会以为没生效 */
    var m = skipMapLoad();
    if (PL.title && m[PL.title]) { delete m[PL.title]; skipMapSave(m); }
  } else {
    var mm = skipMapLoad();
    mm[PL.title || ''] = cfg;
    skipMapSave(mm);
  }
  closeSheet();
  skipApply(PL.title);
  toast(cfg.on
    ? ('已启用：片头 ' + h + ' 秒 / 片尾 ' + t + ' 秒' + (cfg.auto ? '（自动跳过）' : '（手动点按钮）'))
    : '已关闭跳过片头片尾');
}

/** 指定线路的集数。

    注意不能用 `li || PL.li`：传 0（第一条线路）时 0 是 falsy，
    会被替换成当前线路，跨到第 0 条线路取「上一集」就会数错集数。
    这正是单测抓到的真实 bug。 */
function epsOfLine(li) {
  var idx = (typeof li === 'number') ? li : PL.li;
  var l = PL.lines[idx];
  return (l && l.eps) || [];
}

/** 切到上一集 / 下一集。
    dir = +1 下一集，-1 上一集。
    边界处理：
      · 上一集在当前线路第 0 集 → 若前面还有线路，跳到上一条线路的最后一集
      · 下一集在当前线路末集 → 若后面还有线路，跳到下一条线路的第 0 集
      · 都没有就不动，给一句提示（避免用户以为按钮坏了）
    准备态一律保留 PL.fitCover / 字幕设置，只有「集」变。 */
function stepEp(dir) {
  if (!PL.lines || !PL.lines.length) return;
  if (PL.live) { toast('直播没有上一集/下一集'); return; }
  var eps = epsOfLine(PL.li);
  if (!eps.length) return;

  var ni = PL.ei + dir;
  var nl = PL.li;

  if (ni >= 0 && ni < eps.length) {
    /* 同线路内切集 */
  } else if (dir > 0 && PL.li + 1 < PL.lines.length) {
    /* 当前线路播完，跨到下一条线路 */
    nl = PL.li + 1;
    ni = 0;
    if (!epsOfLine(nl).length) { toast('下一条线路没有可播放的剧集'); return; }
    toast('已切到下一条线路');
  } else if (dir < 0 && PL.li - 1 >= 0) {
    nl = PL.li - 1;
    var prev = epsOfLine(nl);
    ni = prev.length - 1;
    if (ni < 0) { toast('上一条线路没有可播放的剧集'); return; }
    toast('已切到上一条线路');
  } else {
    toast(dir > 0 ? '已经是最后一集了' : '已经是第一集了');
    return;
  }

  if (nl !== PL.li) {
    /* 跨线路：先切线路再播放，renderLines/renderEps 会跟着刷新 */
    PL.li = nl;
    renderLines();
  }
  PL.resume = 0;            // 手动切集不要续播上一集的进度
  playAt(ni);
  updateEpBtns();
  showControls();
}

/** 刷新切集按钮的可用状态：第一集禁用「上一集」，最后一集禁用「下一集」。
    直播时整组按钮由 CSS 隐藏，这里不用管。 */
function updateEpBtns() {
  var prev = $('pPrev'), next = $('pNext');
  if (!prev || !next) return;
  if (PL.live) { prev.disabled = false; next.disabled = false; return; }
  var eps = epsOfLine(PL.li);
  var atFirst = (PL.ei <= 0 && PL.li <= 0);
  var atLast = (PL.ei >= eps.length - 1 && PL.li >= PL.lines.length - 1);
  prev.disabled = atFirst;
  next.disabled = atLast || !eps.length;
}

function playAt(i) {
  var l = PL.lines[PL.li];
  if (!l || !l.eps[i]) return;
  saveProgress(true);
  PL.ei = i;
  PL.failed = false;
  PL.pass = 0; PL.triedHls = false; PL.lastErr = ''; PL.sawCode4 = false;
  PL.mseUrl = '';                    // 上一集的「必须 MSE」结论不能带到这一集
  clearLoadTimers();
  destroyHls();
  PL.pageTried = {};                 // 每集重新给播放页一次解析机会
  PL.nativeTried = {};
  PL.recovered = 0;                  // 每条片源允许一次「就地恢复」
  PL.everPlayed = false;
  PL.userSeek = 0;
  clearTimeout(PL.seekTimer); clearTimeout(PL.seekTimer2); clearTimeout(PL.stallTimer);
  clearTimeout(PL.retryTimer);      // 换集时取消上一集挂起的「重试全部线路」
  PL.candidates = buildCandidates(i);
  PL.attempt = 0;
  /* 换集：清掉上一集正在滚的弹幕，读这一集自己的 */
  PL.dmPrev = 0;
  DM.load();
  BILI.auto();          // 换集后按新的 ei 取对应的 B 站弹幕
  DDP.auto();
  /* 起播等待层：模糊封面 + 片名 + 第几集，遮住切换时必然出现的那几秒黑屏 */
  PL.loading = true;
  showLoad(PL.title || '', PL.live ? '正在连接直播源…'
    : ('第 ' + (i + 1) + ' 集 · 正在解析片源…'));
  updateEpBtns();          // 集数变了，上一集/下一集按钮的可用状态要跟着变
  /* 视频元素自己也有封面兜底：万一某一刻等待层被收起、src 又为空，
     看到的是海报而不是浏览器默认的灰色播放键 */
  try { $('v').poster = String(PL.cover || ''); } catch (e) {}
  if (!PL.candidates.length) {
    /* 全部都是网页链接：不是「没地址」，而是这个接口只做搜索索引，
       必须如实告诉用户原因，否则会被当成播放器故障。 */
    fail(PL.webOnly
      ? '该接口只提供正版平台网页链接，无法在应用内播放，请换用其他采集接口'
      : '该集没有可播放地址');
    return;
  }
  $('pBig').textContent = '❚❚';
  $('pBar').value = 0; $('pCur').textContent = '00:00'; $('pDur').textContent = '00:00';
  setVideoFit(PL.fitCover);
  updateSub(); renderEps(); renderLines(); showControls();
  attemptLoad();
}

/* 彻底释放上一路片源：先解绑事件、再清空 src。
   关键：切源本身会触发 MEDIA_ERR_ABORTED，若此时新 handler 已挂上，
   就会被误判成「解码失败」并连锁换源 —— 这是「老是播放失败」的主因。 */
function resetVideo() {
  var v = $('v');
  v.onloadedmetadata = null;
  v.onerror = null;
  try { v.pause(); } catch (e) {}
  try { v.removeAttribute('src'); v.load(); } catch (e) {}
}

/* MediaError 分类：只有网络中断 / 解码错误 / 格式不支持才算真失败 */
function mediaErrText(code) {
  if (code === 2) return '网络中断';
  if (code === 3) return '解码错误';
  if (code === 4) return '格式不支持';
  return '播放失败';
}

/* 采集站的路径常带中文（/HD中字/index.m3u8）。不编码时部分 WebView 的
   媒体栈直接拒绝加载，表现为一直停在占位图、既不报错也不走。 */
function safeUrl(u) {
  return String(u || '').replace(/[^\x00-\x7F]+/g, function (m) {
    try { return encodeURIComponent(m); } catch (e) { return ''; }
  });
}

function setVideoSrc(url) {
  var v = $('v');
  url = safeUrl(url);
  v.src = url;
  try { v.load(); } catch (e) {}
  var p = null;
  try { p = v.play(); } catch (e) {}
  if (p && p.catch) p.catch(function(){});
}

/* ---------------------------------------------------- m3u8 清单结构预检
   苹果 CMS 采集站常见三种 m3u8：
     ① 分片全为绝对地址（如百度资源）—— WebView 原生 HLS 可直接播，硬解最省电
     ② master playlist + 根相对子列表 /date/id/6232kb/hls/index.m3u8
        （如 360 资源）—— 原生会把子列表拼成 <目录>/2026... 导致 404，
        且子列表内 #EXT-X-KEY 与 .ts 同样是根相对，原生无法自愈
     ③ 媒体列表里混少量根相对片段（如暴风资源的广告片）—— 主体可播
   对 ② 直接交给 hls.js（按 RFC 解析相对路径 + 用 WebCrypto 解 AES-128），
   省掉「原生必然失败 → 干等 12 秒超时」的空转。
   返回值：{ master, rel, abs } */
function scanManifest(text) {
  var lines = String(text || '').split(/\r?\n/);
  var master = false, rel = 0, abs = 0;
  for (var i = 0; i < lines.length; i++) {
    var s = lines[i].trim();
    if (!s) continue;
    if (s.indexOf('#EXT-X-STREAM-INF') === 0) { master = true; continue; }
    if (s.charAt(0) === '#') {
      var m = /URI="([^"]+)"/.exec(s);
      if (m) { if (/^https?:/i.test(m[1])) abs++; else rel++; }
      continue;
    }
    if (/^https?:/i.test(s)) abs++; else rel++;
  }
  return { master: master, rel: rel, abs: abs };
}

function attemptLoad() {
  if (PL.attempt >= PL.candidates.length) {
    fail('片源加载失败，可换线路重试、用「增强解码」或「兼容播放」');
    return;
  }
  /* 还没判定失败：无论第几次换路，都把等待层亮着。
     否则上一次 playing 已经把它收起来，重试时清空 src 会露出浏览器
     自带的「大播放键」占位图，比什么都不显示还难看。 */
  if (!PL.failed) {
    PL.loading = true;
    showLoad(PL.title || '', '正在准备播放…');
  }
  var url = PL.candidates[PL.attempt];
  var tag = PL.candidates.length > 1
    ? '（地址 ' + (PL.attempt + 1) + '/' + PL.candidates.length + '）' : '';
  PL.failed = false;
  PL.lastErr = '';
  console.log('[pl] attempt ' + (PL.attempt + 1) + '/' + PL.candidates.length
    + ' ' + String(url).slice(0, 140));

  /* 采集站播放页（/share/xxx 之类）：先抓页面换出真地址，再走正常播放。
     直接把 HTML 递给 <video> 只会拿到 MEDIA_ERR_SRC_NOT_SUPPORTED，
     用户看到的就是「格式不支持」。解析不出来才算这一路失败——
     不能退回原生硬顶，那必然还是 code 4。 */
  if (PL.pageMap && PL.pageMap[url]) {
    /* 详情页已经解析过了：直接用，省掉这一次往返（播放页解析实测要 1 秒上下） */
    var warmed = WARM.page[url];
    if (warmed && Date.now() - warmed.t < WARM_TTL) {
      console.log('[pl] page hit 预热 ' + String(warmed.u).slice(0, 90));
      PL.candidates[PL.attempt] = warmed.u;
      delete PL.pageMap[url];
      return attemptLoad();
    }
    PL.pageTried = PL.pageTried || {};
    var ptries = PL.pageTried[url] || 0;
    if (ptries >= 2) return nextAttempt('播放页未解析出地址');
    PL.pageTried[url] = ptries + 1;
    var pageToken = PL.token;
    setStatus('正在解析片源…' + tag);
    resolvePlayPage(url).then(function (real) {
      if (pageToken !== PL.token) return;
      PL.candidates[PL.attempt] = real;
      delete PL.pageMap[url];
      WARM.page[url] = { u: real, t: Date.now() };
      HINT.set(hostOf(url)); HINT.set(hostOf(real));   // 站点要签名，下次直接走播放页
      attemptLoad();                      // 用真地址重跑这一路（不消耗候选）
    }).catch(function (e) {
      if (pageToken !== PL.token) return;
      console.log('[pl] page fail ' + ((e && e.message) || e));
      nextAttempt('播放页解析失败');
    });
    return;
  }

  /* 已判定必须走 MSE 的地址直接复用，不必再探测一次 */
  if (PL.mseUrl === url) return manualHls(true);

  /* 仅对 m3u8 且未探测过的地址做一次 4KB 头部预检；失败就退回原生，不阻塞播放 */
  if (!PL.usingHls && /\.m3u8(\?|$)/i.test(url) && !PL.prechecked[url]) {
    PL.prechecked[url] = 1;
    /* 详情页预热时已经探过，直接按结论走 */
    var wp = warmProbe(url);
    if (wp) {
      console.log('[pl] probe hit 预热 master=' + wp.master + ' rel=' + wp.rel);
      return applyProbe(url, wp, tag);
    }
    var probeToken = PL.token;
    setStatus('正在解析片源…' + tag);
    __LTV.probe(safeUrl(url)).then(function (r) {
      if (probeToken !== PL.token) return;      // 用户已切集 / 关播放器
      var info = scanManifest(r.body);
      WARM.probe[url] = { v: info, t: Date.now() };
      console.log('[pl] probe master=' + info.master + ' rel=' + info.rel
        + ' abs=' + info.abs + ' head=' + String(r.body || '').slice(0, 70).replace(/\s+/g, '|'));
      applyProbe(url, info, tag);
    }).catch(function () {
      if (probeToken !== PL.token) return;
      loadNative(url, tag);
    });
    return;
  }
  loadNative(url, tag);
}

/** 按清单结构决定走原生还是 MSE */
function applyProbe(url, info, tag) {
  if (info && info.master && info.rel > 0) {
    PL.mseUrl = url;
    return manualHls(true);
  }
  loadNative(url, tag);
}

function loadNative(url, tag) {
  var v = $('v');
  var settled = false;
  var myToken = ++PL.token;          // 上一路片源的迟到事件一律丢弃
  tag = tag || '';
  PL.failed = false;
  PL.lastErr = '';
  setStatus('正在连接片源…' + tag);
  PL.nativeTried = PL.nativeTried || {};
  PL.nativeTried[url] = 1;
  console.log('[pl] native ' + String(url).slice(0, 140));

  function finish() {
    if (settled || myToken !== PL.token) return false;
    settled = true; clearLoadTimers();
    return true;
  }

  /* 12 秒拿不到元数据 → 换地址；已拿到元数据 → 转为「是否真的在播」的监控，
     避免永久卡在「正在缓冲」既不报错也不换源。
     直播收紧到 7 秒：地址已经过并行探活筛选，能连上的正常都在 2 秒内出清单，
     超过 7 秒基本就是「连得上但不给数据」的死源，没必要让用户干等。 */
  var metaTmo = PL.live ? 7000 : 12000;
  PL.loadTimer = setTimeout(function() {
    if (settled || myToken !== PL.token) return;
    if (v.readyState >= 1) {
      setStatus('正在缓冲，请稍候…' + tag);
      PL.loadTimer = setTimeout(function() {
        if (settled || myToken !== PL.token) return;
        // 已在推进或用户主动暂停 → 不算卡住
        /* 只有「真的播过再被用户暂停」才算正常停顿；
           自动播放被拦时 v.paused 也是 true，那种情况必须继续换源重试 */
        if (v.currentTime > 0.2 || (v.paused && PL.everPlayed)) { setStatus(''); return; }
        try { v.play(); } catch (e) {}
        if (!finish()) return;
        nextAttempt('缓冲卡住');
      }, 15000);
      return;
    }
    if (!finish()) return;
    nextAttempt('连接超时');
  }, metaTmo);

  PL.softTimer = setTimeout(function() {
    if (settled || myToken !== PL.token) return;
    if (v.readyState >= 3) return;      // 已能顺畅播放就不再提示缓冲
    setStatus(PL.live ? '正在读取直播流…' + tag : '正在缓冲，请稍候…' + tag);
  }, 3500);

  resetVideo();                       // 先解绑 + 清空，abort 不会落到新 handler
  v.onloadedmetadata = function() {
    if (!finish()) return;
    PL.failed = false; setStatus('');
    /* 时长到手才能把片头/片尾区间画到进度条上 */
    skipApply(PL.title);
    if (PL.resume > 0 && PL.resume < v.duration - 8) {
      try { v.currentTime = PL.resume; } catch (e) {}
      toast('已续播上次进度 ' + fmtTime(PL.resume));
    }
    PL.resume = 0;
    try { v.play(); } catch (e) {}
    /* 元数据能解析 ≠ 能出画面：分片被 CDN 拦、编码不支持时，WebView 常常
       既不报 error 也不推进时间，界面就永远停在黑屏。这里补一道看门狗。 */
    clearTimeout(PL.startTimer);
    PL.startTimer = setTimeout(function() {
      if (myToken !== PL.token) return;
      var vv = $('v');
      if (PL.everPlayed || vv.currentTime > 0.2) return;
      /* 已经有缓冲数据 = 分片在下来，只是慢，别当成死源换走；
         只有「什么都没缓冲到」才是真的放不出来 */
      var buf = 0;
      try { buf = vv.buffered.length ? vv.buffered.end(vv.buffered.length - 1) : 0; } catch (e) {}
      if (buf > 1) { setStatus('正在缓冲，请稍候…'); return; }
      console.log('[pl] 元数据就绪但 9 秒无任何缓冲 -> 换下一路');
      nextAttempt('加载后无画面');
    }, 9000);
  };
  v.onerror = function() {
    if (myToken !== PL.token) return;
    if (!v.getAttribute('src')) return;  // 清空 src 的收尾事件，忽略
    var code = (v.error && v.error.code) || 0;
    console.log('[pl] error code=' + code + ' settled=' + settled + ' '
      + String(v.currentSrc || v.src || '').slice(0, 140));
    if (code === 1) return;
    /* 已经开播之后才出错：先就地恢复一次（load + play），别急着换源；
       还不行才交给换源流程，否则一次网络抖动就把整条线路判死 */
    if (settled) {
      PL.lastErr = mediaErrText(code);
      /* 播过一段才报「格式不支持」的，多半是原生 HLS 在跨段/换码率时解不下去。
         记下来，等这轮重试走完就用 MSE 兜底，别让用户看到「播一半就断」。 */
      if (code === 4) PL.sawCode4 = true;
      if (!PL.recovered) {
        PL.recovered = 1;
        toast('播放中断，正在恢复…');
        try { v.load(); v.play(); } catch (e) {}
        return;
      }
      return nextAttempt('播放中断（' + PL.lastErr + '）');
    }           // MEDIA_ERR_ABORTED：切源自身引起，不算失败
    PL.lastErr = mediaErrText(code);
    // code 4 可能只是「坏地址伪装的跳转页」，也可能是真解不了。
    // 先快速跳到下一候选（通常几百毫秒），全部候选都失败后再统一用 MSE 兜底，
    // 避免对 404 地址也走一遍 MSE 耐心重试、把用户卡在「正在启用增强解码」。
    if (code === 4) PL.sawCode4 = true;
    if (!finish()) return;
    nextAttempt(PL.lastErr);
  };
  setVideoSrc(url);
}

function nextAttempt(reason) {
  reason = reason || '播放异常';
  console.log('[pl] next: ' + reason + ' attempt=' + PL.attempt + ' pass=' + PL.pass
    + ' sawCode4=' + !!PL.sawCode4);
  clearLoadTimers();
  PL.attempt++;
  if (PL.attempt < PL.candidates.length) {
    toast('该地址不可用，自动换源（' + reason + '）');
    attemptLoad();
    return;
  }
  // 所有地址跑完一轮后再自动重试一轮：移动网络抖动 / CDN 瞬断常可自行恢复
  if (PL.pass === 0) {
    PL.pass = 1; PL.attempt = 0;
    /* 不清 PL.mseUrl：预检已经判定这条清单是「master + 根相对子列表」，
       原生 <video> 永远拼不对子清单地址，重试还交给原生就是白等 12 秒。
       保留结论，第二轮直接走更耐心的 MSE。 */
    toast(reason + '，1 秒后重试全部线路…');
    /* 必须等一会儿再重试。
       原来这里是立即 attemptLoad()，两轮之间零间隔 —— 而这类失败多是
       CDN 瞬断/限流（实测量子资源的节点在境外，会出现 000 与 200 交替），
       几秒内就能恢复。立刻重跑大概率还撞在同一个坏状态上，白白浪费一轮。
       1.2 秒是折中：够 CDN 恢复，又不会让用户觉得卡住。 */
    clearTimeout(PL.retryTimer);
    PL.retryTimer = setTimeout(function () { attemptLoad(); }, 1200);
    return;
  }
  // 全部原生候选都返回「格式不支持」→ 用 MSE 统一兜底一次
  if (PL.sawCode4 && !PL.triedHls) {
    PL.triedHls = true;
    return manualHls(true);
  }
  /* MSE 也没成，但这条地址还没让原生试过：给最后一次机会
     （预检可能把「只是有时序问题的普通清单」误判成必须 MSE） */
  if (PL.mseUrl && !PL.nativeTried[PL.mseUrl]) {
    PL.nativeTried[PL.mseUrl] = 1;
    var lastUrl = PL.mseUrl;
    PL.mseUrl = '';
    toast('增强解码失败，改用原生解码再试一次…');
    return loadNative(lastUrl, '');
  }
  var extra = PL.lastErr ? '（' + PL.lastErr + '）' : '';
  /* 这里的 lastErr 常常是「格式不支持」，但真实原因可能是 CDN 直接拒连
     （实测量子资源的 v.lzcdn27.com 会返回 000，video 却报 SRC_NOT_SUPPORTED）。
     所以文案同时给出「换线路」和「换源」两条路，避免用户以为是自己设备解码不行。 */
  fail('片源无法播放' + extra + '。可换线路、换其他采集源，或用「增强解码」「兼容播放」');
}

/* 增强解码（MSE / hls.js）：仅用户点击，或原生明确「不支持该格式」时自动试一次。
   属软件转封装，比原生慢，因此绝不作为「加载慢」时的自动降级。 */
function manualHls(auto) {
  if (auto) PL.triedHls = true;     // 自动路径只走一次，失败就交给换源/失败提示
  var url = PL.mseUrl || '';
  if (!url) {
    for (var k = 0; k < PL.candidates.length; k++) {
      if (/\.m3u8/i.test(PL.candidates[k])) { url = PL.candidates[k]; break; }
    }
  }
  console.log('[pl] mse ' + (auto ? 'auto' : 'manual') + ' ' + String(url).slice(0, 140));
  if (!url) {
    if (auto) return nextAttempt('非 HLS 片源');
    toast('该片源不是 HLS，无法增强解码，请用「兼容播放」');
    return;
  }
  if (typeof Hls === 'undefined' || !Hls.isSupported()) {
    if (auto) return nextAttempt('设备不支持 MSE');
    toast('当前设备不支持增强解码'); return;
  }
  clearLoadTimers(); destroyHls();
  resetVideo();
  PL.failed = false;
  PL.usingHls = true;
  /* 自动接管时不要说「增强解码」——用户只关心能不能看，不该被术语打断 */
  setStatus(auto ? '正在加载片源…' : '正在启用增强解码…');
  var v = $('v');
  var myToken = ++PL.token;           // 与原生尝试互斥，旧事件不会干扰 MSE 路径
  try {
    /* 自动兜底也分两种：第一轮求快（尽快回退到下一个候选）；
       已经是第二轮重试、或者预检已判定「这条清单只能走 MSE」时改为耐心模式，
       否则一个 6 秒的清单超时就会把本来能播的片源判死。 */
    var patient = (!auto || PL.pass >= 1);
    /* 缓冲策略是「快进后顺不顺」的关键：
       前向缓冲给到 30~60 秒，向后留 20 秒（快退时不用重新拉）；
       maxBufferHole 放宽一点，清单里的小时间缝隙才不会卡住；
       nudge 重试用于跳缝，跨段快进后偶尔会用到。
       注意本地 hls.min.js 是 light 版，不含 worker，enableWorker 只能关。 */
    var h = new Hls(patient ? {
      enableWorker: false, lowLatencyMode: false,
      /* 前向多留一点：滑动快进 30 秒以内基本都落在已有缓冲里，等于零等待；
         后向留 60 秒，快退不用重新拉分片。maxBufferSize 兜住内存。 */
      maxBufferLength: 45, maxMaxBufferLength: 90, backBufferLength: 60,
      maxBufferSize: 90 * 1000 * 1000,
      capLevelToPlayerSize: true, startLevel: -1,
      maxBufferHole: 0.4, maxFragLookUpTolerance: 0.25,
      nudgeMaxRetry: 6, highBufferWatchdogPeriod: 2,
      startFragPrefetch: true, abrEwmaDefaultEstimate: 1500000,
      manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 4,
      levelLoadingTimeOut: 15000, levelLoadingMaxRetry: 6,
      fragLoadingTimeOut: 25000, fragLoadingMaxRetry: 6
    } : {
      enableWorker: false, lowLatencyMode: false,
      maxBufferLength: 30, maxMaxBufferLength: 60, backBufferLength: 30,
      maxBufferSize: 60 * 1000 * 1000,
      capLevelToPlayerSize: true, startLevel: -1,
      maxBufferHole: 0.4, maxFragLookUpTolerance: 0.25,
      nudgeMaxRetry: 5,
      startFragPrefetch: true, abrEwmaDefaultEstimate: 800000,
      manifestLoadingTimeOut: 9000, manifestLoadingMaxRetry: 2,
      levelLoadingTimeOut: 9000, levelLoadingMaxRetry: 3,
      fragLoadingTimeOut: 12000, fragLoadingMaxRetry: 3
    });
    PL.hls = h;
    PL.fragSeen = false;
    h.loadSource(safeUrl(url)); h.attachMedia(v);
    h.on(Hls.Events.FRAG_LOADING, function() { PL.fragSeen = true; });
    h.on(Hls.Events.MANIFEST_PARSED, function() {
      if (myToken !== PL.token) return;
      clearLoadTimers(); setStatus('');
      try { v.play(); } catch (e) {}
      /* MSE 也有「清单解析成功、分片却一个都下不来」的情况：
         界面停在黑屏 + 缓冲中，既不报错也不换源。补同样的看门狗。
         注意：慢网（模拟器到 ffzy 的 TLS 握手 16~32 秒）下分片请求都要等很久，
         所以给到 20 秒；一旦看到 FRAG_LOADING 就不再多管，交给 hls 自己重试。 */
      clearTimeout(PL.startTimer);
      PL.startTimer = setTimeout(function() {
        if (myToken !== PL.token) return;
        if (PL.everPlayed || v.currentTime > 0.2 || PL.fragSeen) return;
        var buf = 0;
        try { buf = v.buffered.length ? v.buffered.end(v.buffered.length - 1) : 0; } catch (e) {}
        if (buf > 1) return;
        console.log('[pl] MSE 解析成功但 20 秒无分片 -> 换路');
        destroyHls(); clearLoadTimers();
        if (auto) nextAttempt('分片加载不出来');
        else fail('分片加载不出来，可换线路重试或用「兼容播放」');
      }, 20000);
    });
    h.on(Hls.Events.ERROR, function(_, d) {
      if (myToken !== PL.token || !d.fatal) return;
      console.log('[pl] hls err ' + d.type + ' / ' + d.details
        + ' / ' + ((d.response && d.response.code) || '') + ' / ' + (d.reason || ''));
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        /* 清单本身就拿不到（403 / 404 / 签名失效）：重试多少次都是同一个结果，
           以前会 startLoad() 干等到 9 秒硬超时，现在立刻换下一路。
           这正是「进视频要等十几秒」的主要来源之一。 */
        if (/^manifest/i.test(String(d.details))) {
          destroyHls(); clearLoadTimers();
          if (auto) return nextAttempt('片源清单不可用');
          fail('片源清单不可用（可能已过期），可换线路重试');
          return;
        }
        h.startLoad(); return;
      }
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { h.recoverMediaError(); return; }
      destroyHls(); clearLoadTimers();
      // MSE 也走不通 → 回退继续试剩余原生候选，而不是直接判死
      if (auto) nextAttempt('增强解码失败');
      else fail('增强解码失败（片源可能有跨域限制），可换线路重试或「兼容播放」');
    });
    // 自动兜底必须有硬超时：hls.js 的耐心重试会让用户长时间卡在提示上
    if (auto) {
      PL.loadTimer = setTimeout(function() {
        if (myToken !== PL.token) return;
        if (v.readyState >= 1) { setStatus(''); return; }
        destroyHls();
        nextAttempt('增强解码超时');
      }, patient ? 18000 : 9000);
    }
  } catch (e) {
    destroyHls(); clearLoadTimers();
    if (auto) nextAttempt('增强解码初始化失败');
    else fail('增强解码初始化失败：' + e.message);
  }
}

function openPlayer(title, cover, lines, li, ei, live) {
  if (!lines || !lines.length) { toast('该片源暂无播放地址'); return; }
  PL.title = title; PL.cover = cover || '';
  PL.lines = lines; PL.li = li || 0; PL.ei = ei || 0;
  PL.resume = 0;
  /* 直播：没有时长、不能拖进度，用「源1/源2…」当线路，播不动自动换下一条 */
  PL.live = !!live;
  skipApply(title);          // 换片了，重新取这部片子的跳过配置
  $('player').classList.toggle('live', PL.live);
  $('pBar').style.display = PL.live ? 'none' : '';
  if (PL.live) { $('pCur').textContent = '● 直播中'; $('pDur').textContent = ''; }
  /* 直播：选集无意义，换成收藏按钮（能不能收藏看当前台名） */
  $('pEpsBtn').style.display = PL.live ? 'none' : '';
  $('pFav').style.display = PL.live ? '' : 'none';
  if (PL.live) {
    var on = liveIsFav(title);
    $('pFav').textContent = on ? '★ 已收藏' : '☆ 收藏';
    $('pFav').classList.toggle('on', on);
  }
  $('player').classList.add('on');
  syncPlayerLayout();          // 打开时按当前方向决定用哪套布局
  $('pEps').classList.remove('on');
  $('pRate').textContent = '倍速 1.0x'; PL.ri = 1;
  try { $('v').playbackRate = 1; } catch (e) {}
  DM.setOn(DM.on);      // 恢复上次的开关状态，并同步输入条显隐
  DM.load();
  BILI.auto();          // 已绑定 B 站条目的剧，后台拉这一集弹幕
  DDP.auto();           // 有弹弹play 凭据时再补一层
  __LTV.landscape(true);
  __LTV.fullscreen(true);          // 隐藏状态栏 / 导航栏，真正全屏
  __LTV.playerOpen(true);
  renderLines(); renderEps(); updateSub();
  var saved = loadProgress();
  if (saved > 3) PL.resume = saved;
  playAt(PL.ei);
  gestHide();
  PL.skipClick = 0;
  showControls();
}

function closePlayer() {
  saveProgress(true);
  clearLoadTimers();
  destroyHls();
  PL.loading = false;
  hideLoad();
  var v = $('v');
  try { v.pause(); } catch (e) {}
  v.onloadedmetadata = null; v.onerror = null;
  try { v.removeAttribute('src'); v.load(); } catch (e) {}
  $('player').classList.remove('on');
  $('player').classList.remove('live');
  $('pEps').classList.remove('on');
  PL.live = false;
  PL.failed = false;
  setStatus('');
  clearTimeout(PL.hideTimer);
  __LTV.landscape(false);
  __LTV.fullscreen(false);
  __LTV.playerOpen(false);
}

/* ---------------------------------------------------------------- 播放器事件 */
/* 横竖屏切换、分屏、状态栏收起都会改变 #player 的尺寸，铺满倍数要跟着重算 */
window.addEventListener('resize', function() { if (PL.fitCover) applyFit(); });
window.addEventListener('orientationchange', function() {
  setTimeout(function() { if (PL.fitCover) applyFit(); }, 260);
});

/* ---------------------------------------------------------------- 播放器手势
   左右滑 = 快进 / 后退（拖动过程只显示预览时间，松手才真正跳）；
   上下滑 = 调音量。音量走原生 AudioManager 改系统媒体音量——在 <video> 上设
   volume 在部分机型和硬解码路径上不生效，达不到「像优酷那样滑一下声音就变」。
   轴向在头 12px 内锁定，锁完这一路不再改，避免斜着滑时在「进度」和「音量」之间来回跳。 */
var GEST = { live: false, axis: '', x0: 0, y0: 0, dx: 0, dy: 0,
             baseT: 0, baseV: 0, target: 0 };

function gestShow(txt) { $('pGest').textContent = txt; $('pGest').classList.add('on'); }
function gestHide() { $('pGest').classList.remove('on'); }

function curVol() {
  if (HAS_NATIVE && Android.getVolume) {
    var n = parseInt(Android.getVolume(), 10);
    if (!isNaN(n)) return n;
  }
  var v = $('v');
  return Math.round((v.muted ? 0 : v.volume) * 100);
}

function applyVol(p) {
  p = Math.max(0, Math.min(100, Math.round(p)));
  if (HAS_NATIVE && Android.setVolume) Android.setVolume(p);
  else {
    var v = $('v');
    try { v.volume = p / 100; v.muted = (p === 0); } catch (e) {}
  }
  return p;
}

$('player').addEventListener('touchstart', function(e) {
  if (e.touches.length !== 1) return;
  // 控制条、选集抽屉、状态弹层上的滑动不算手势，否则拖进度条会被当成快进
  if (e.target.closest('.p-eps, .p-mask button, .p-mask input, .p-status')) return;
  var t = e.touches[0];
  GEST.live = true; GEST.axis = ''; GEST.dx = 0; GEST.dy = 0;
  GEST.x0 = t.clientX; GEST.y0 = t.clientY;
  GEST.baseT = $('v').currentTime || 0;
  GEST.baseV = curVol();
}, { passive: true });

$('player').addEventListener('touchmove', function(e) {
  if (!GEST.live || e.touches.length !== 1) return;
  var t = e.touches[0];
  GEST.dx = t.clientX - GEST.x0;
  GEST.dy = t.clientY - GEST.y0;
  if (!GEST.axis) {
    var adx = Math.abs(GEST.dx), ady = Math.abs(GEST.dy);
    if (Math.max(adx, ady) < 12) return;      // 位移太小，先不定轴向
    /* 直播没有进度可拖，横向滑动直接按音量处理，免得滑出个「+30s」却什么也没发生 */
    GEST.axis = (PL.live || adx <= ady) ? 'vol' : 'seek';
  }
  if (GEST.axis === 'seek') {
    e.preventDefault();                        // 锁掉页面滚动 / 下拉刷新
    var v = $('v'), dur = v.duration || 0;
    // 整屏宽 ≈ 90 秒：够精细，也不至于滑一下跳掉十分钟
    var span = window.innerWidth || 360;
    GEST.target = Math.max(0, Math.min(dur, GEST.baseT + GEST.dx / span * 90));
    gestShow((GEST.dx >= 0 ? '⏩ ' : '⏪ ') + fmtTime(GEST.target) + ' / ' + fmtTime(dur)
      + (dur ? '   ' + (GEST.dx >= 0 ? '+' : '') + Math.round(GEST.target - GEST.baseT) + 's' : ''));
  } else {
    e.preventDefault();
    var h = window.innerHeight || 640;
    var p = applyVol(GEST.baseV - GEST.dy / (h * 0.65) * 100);
    gestShow('🔊 音量 ' + p + '%');
  }
}, { passive: false });

$('player').addEventListener('touchend', function(e) {
  if (!GEST.live) return;
  GEST.live = false;
  if (!GEST.axis) return;                      // 只是点了一下，交给 click 处理
  PL.skipClick = Date.now() + 400;
  if (GEST.axis === 'seek') {
    var v = $('v');
    if (v.duration) {
      PL.userSeek = 1;                         // 只有用户拖动才算「快进」，才进自愈流程
      try { v.currentTime = GEST.target; } catch (er) {}
      $('pBar').value = GEST.target / v.duration * 100;
      $('pCur').textContent = fmtTime(GEST.target);
      saveProgress();
    }
  }
  setTimeout(gestHide, 600);
  GEST.axis = '';
});
