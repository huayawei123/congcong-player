function liveGridHtml() {
  var list = liveFiltered();
  if (!list.length) return '<div class="center">没有匹配的频道<br><small>换个关键词或分组试试</small></div>';
  var shown = list.slice(0, LIVE.shown);
  var html = '<div class="live-grid">' + shown.map(liveTile).join('') + '</div>';
  if (list.length > shown.length) {
    html += '<div class="loadbar"><button class="btn ghost" data-live-more="1">显示更多（还有 '
      + (list.length - shown.length) + ' 个）</button></div>';
  }
  return html;
}

function renderLive() {
  var total = LIVE.chans.length;
  var html = '<section><div class="sec-head"><h2>直播</h2><small>'
    + (total ? total + ' 个频道 · ' + liveAgo(LIVE.at) : '正在获取频道') + '</small></div>';

  html += '<div class="live-src"><span class="dot' + (LIVE.busy ? ' busy' : '') + '"></span>'
    + '<b>' + esc(LIVE.busy ? '正在更新直播源…'
      : (LIVE.err || '央视 / 卫视 / 地方台 · 每 6 小时自动更新')) + '</b>'
    + '<button class="lnk" data-live-refresh="1">' + (LIVE.busy ? '更新中' : '立即更新') + '</button></div>';

  /* 自定义源：GitHub 走不通时，用户可以把别处的 m3u/txt 地址填进来 */
  html += '<div class="live-addline"><button class="lnk" data-live-addsrc="1">'
    + (LIVE.showSrc ? '收起自定义源' : '＋ 自定义源')
    + (LIVE.custom.length ? '（' + LIVE.custom.length + '）' : '') + '</button></div>';
  if (LIVE.showSrc) {
    html += '<div class="live-form">'
      + '<input id="liveSrcInput" class="live-q" type="url" placeholder="粘贴 m3u 或 txt 直播源地址，回车添加">'
      + '<button class="btn" data-live-savesrc="1">添加</button></div>';
    if (LIVE.custom.length) {
      html += '<div class="live-custom">' + LIVE.custom.map(function(u) {
        return '<span>' + esc(String(u).replace(/^https?:\/\//, '').slice(0, 42))
          + '<i data-live-delsrc="' + esc(u) + '">×</i></span>';
      }).join('') + '</div>';
    }
  }

  if (!total) {
    html += '<div class="center">' + (LIVE.busy ? '首次拉取中，约 10~30 秒…' : '还没有频道数据')
      + '<br><small>' + esc(LIVE.err || '点上方「立即更新」手动拉取') + '</small></div></section>';
    return html;
  }

  /* 继续播放：上次看的台单独放一条，比「最近」更直接 */
  var hasLast = LIVE.last && LIVE.chans.some(function(c) { return c.n === LIVE.last; });
  if (hasLast) {
    html += '<div class="live-cont"><button data-live="' + esc(LIVE.last) + '">'
      + '<span class="pl">▶</span><b>继续播放</b><em>' + esc(LIVE.last) + '</em></button></div>';
  }

  /* 收藏：整行常驻（有收藏时才出现），点星可以取消 */
  var favs = (LIVE.favs || []).filter(function(n) {
    return LIVE.chans.some(function(c) { return c.n === n; });
  });
  if (favs.length) {
    html += '<div class="live-rec live-favrow"><span>收藏</span>'
      + favs.map(function(n) {
          return '<button class="fav" data-live="' + esc(n) + '">★ ' + esc(n) + '</button>';
        }).join('') + '</div>';
  }

  var rec = liveRecent().filter(function(n) {
    return LIVE.chans.some(function(c) { return c.n === n; });
  });
  if (rec.length) {
    html += '<div class="live-rec"><span>最近</span>'
      + rec.map(function(n) { return '<button data-live="' + esc(n) + '">' + esc(n) + '</button>'; }).join('')
      + '</div>';
  }

  var chips = '<button class="' + (LIVE.grp === 'all' ? 'on' : '') + '" data-live-grp="all">全部 ' + total + '</button>';
  /* 高清分组：只看 4K/8K，用户想找高画质时不用翻几百个台 */
  var hdCount = LIVE.chans.filter(function(c) { return (c.q || 1) >= 4; }).length;
  if (hdCount) {
    chips += '<button class="' + (LIVE.grp === 'hd' ? 'on' : '') + '" data-live-grp="hd">4K·8K '
      + hdCount + '</button>';
  }
  /* 收藏作为一个虚拟分组，只在有收藏时出现 */
  var favCount = (LIVE.favs || []).filter(function(n) {
    return LIVE.chans.some(function(c) { return c.n === n; });
  }).length;
  if (favCount) {
    chips += '<button class="' + (LIVE.grp === 'fav' ? 'on' : '') + '" data-live-grp="fav">★ 收藏 '
      + favCount + '</button>';
  }
  LIVE_GROUPS.forEach(function(g) {
    var n = LIVE.chans.filter(function(c) { return c.g === g; }).length;
    if (!n) return;
    chips += '<button class="' + (LIVE.grp === g ? 'on' : '') + '" data-live-grp="' + g + '">'
      + g + ' ' + n + '</button>';
  });
  html += '<div class="live-chips">' + chips + '</div>'
    + '<input id="liveQ" class="live-q" type="search" placeholder="搜频道，如 CCTV5 / 湖南卫视"'
    + ' value="' + esc(LIVE.q) + '">'
    + '<div id="liveBox">' + liveGridHtml() + '</div></section>';
  return html;
}

/** 启动定期更新：每 20 分钟检查一次，满足「过期 + 空闲 + 不在播放」就静默更新。
    只在前台跑（document.hidden 时跳过），避免后台耗电耗流量。 */
function liveSchedule() {
  if (LIVE_TIMER) return;
  LIVE_TIMER = setInterval(function() {
    try {
      if (document.hidden) return;             // 后台不刷
      if (LIVE.busy) return;                   // 正在更新
      /* 播放器开着就一律不刷——不只是直播，影视播放同样怕抢带宽。
         之前这里只判 PL.live，影视播放时 PL.live 是 false，守卫等于没生效，
         列表一旦过期就会在你看片时悄悄拉 1~2MB 源。 */
      var pl = $('player');
      if (pl && pl.classList.contains('on')) return;
      if (!LIVE.chans.length) return;          // 还没有列表，交给进入直播页时的首拉
      if (Date.now() - (LIVE.at || 0) < LIVE_TTL) return;
      console.log('[live] 定时更新触发（距上次 ' + Math.round((Date.now() - LIVE.at) / 60000) + ' 分钟）');
      liveRefresh(false);
    } catch (e) {}
  }, LIVE_TICK);
}

/** 某频道所有源都探不通时，标记它，并顺手触发一次源更新：
    很多时候「全死」不是因为源本身坏了，而是本地列表已经过期。
    冷却 10 分钟，避免连续点几个死台就把源刷爆。 */
function liveOnAllDead(name) {
  var now = Date.now();
  LIVE.deadAt = LIVE.deadAt || {};
  LIVE.deadCount = LIVE.deadCount || {};
  /* 上一次「触发换源」的时间。必须在写入本次时间戳之前算冷却，
     否则 now - last 恒为 0，冷却条件永远不成立（这个 bug 被单测抓到过）。 */
  var lastTrigger = LIVE.deadAt[name] || 0;
  LIVE.deadCount[name] = (LIVE.deadCount[name] || 0) + 1;

  /* 同一个台连续两次全死 → 怀疑本地列表过期，后台换一批源 */
  if (LIVE.deadCount[name] >= 2 && now - lastTrigger > 10 * 60 * 1000) {
    LIVE.deadAt[name] = now;          // 记下本次触发时间，进入冷却
    LIVE.deadCount[name] = 0;
    if (!LIVE.busy && now - (LIVE.lastTry || 0) > 10 * 60 * 1000) {
      console.log('[live] 频道连续全死，尝试换源更新');
      setTimeout(function() { liveRefresh(false); }, 1200);
    }
  }
}

/** 只重绘直播页：切分组、搜频道、显示更多都走这里，不动整个首页 */

}

/** 添加一条自定义源：校验协议 → 存起来 → 立刻用它更新 */
function liveAddSrc() {
  var el = $('liveSrcInput');
  var u = el ? String(el.value || '').trim() : '';
  if (!/^https?:\/\//i.test(u)) { toast('请填 http(s) 开头的 m3u / txt 地址'); return; }
  LIVE.custom = LIVE.custom || [];

  livePaint();
  toast('已添加，正在用这个源更新…');
  liveRefresh(true);
}

/** 并行探活：每条地址同时打一次原生 probe（6 秒超时、不受 CORS 限制），
    按「谁先返回 200 且是 m3u8」排序。返回 {ok:[url...], dead:[url...]}。

    为什么必须先做这一步：公开直播源里约一半是死链（实测抽样 24 条：
    11 条连不上、4 条 404、只有 2 条真能播）。播放器是串行试的——一条要等满
    12 秒才判超时，4 条备用源就是 50 秒起步，用户看到的就是一直「正在缓冲」。
    并发探活的整体耗时只等于「最慢的那一条」，通常 6 秒内出结果。 */
function liveProbeAll(urls, done) {
  var left = urls.length, res = [];
  if (!left) return done({ ok: [], dead: [] });
  if (!HAS_NATIVE || !Android.probe) {
    /* 浏览器预览没有原生桥：不做过滤，直接把原列表交给调用方 */
    return done({ ok: urls.slice(), dead: [] });
  }
  urls.forEach(function(u, i) {
    __LTV.probe(u).then(function(r) {
      var body = String(r.body || '');
      /* 必须真的拿到 #EXTM3U 才算活。有些源返回 200 + {"error":"找不到该频道"}，
         只判 HTTP 200 会把死的当成活的，进了播放器再空等一轮超时。 */
      var good = /#EXTM3U/i.test(body);
      res[i] = { u: u, ok: good, final: (r.url || u) };
      console.log('[live] probe ' + (good ? 'OK' : 'NO') + ' ' + String(u).slice(0, 70));
    }).catch(function() {
      res[i] = { u: u, ok: false };
    }).then(function() {
      if (--left) return;
      var ok = [], dead = [];
      res.forEach(function(x) {
        if (x && x.ok) ok.push(x.final || x.u); else dead.push((x && x.u) || '');
      });
      done({ ok: ok, dead: dead });
    });
  });
}

/** 播放某个直播频道：每个地址当作一条「线路」，播不动就自动换下一条 */
function playLive(name) {
  var ch = null;
  for (var i = 0; i < LIVE.chans.length; i++) {
    if (LIVE.chans[i].n === name) { ch = LIVE.chans[i]; break; }
  }
  if (!ch) { toast('频道不存在，可能已被更新移除'); return; }
  if (!ch.u.length) { toast('这个频道没有可用地址'); return; }
  liveRecentAdd(ch.n);
  liveSetLast(ch.n);          // 记下来，下次进直播页显示「继续播放」

  /* 命中探活结论（持久化，30 分钟内）直接播，不重复探测。
     地址可能在上游被换掉，所以还要确认「探测时的地址仍在当前列表里」，
     否则这条结论是旧的，重新探一次更靠谱。 */
  var hit = LIVE.probed[ch.n];
  if (hit && hit.ok && hit.ok.length) {
    var stillValid = hit.ok.some(function(u) { return ch.u.indexOf(u) >= 0; });
    if (stillValid) {
      console.log('[live] probe hit(持久化) ' + ch.n + ' ' + hit.ok.length + ' 源');
      return startLive(ch.n, hit.ok, ch.u);
    }
    delete LIVE.probed[ch.n];   // 地址已经变了，丢掉旧结论
  }

  /* 先显示播放器（等待层文案改成「正在挑选可用源」），再并发探活 */
  var lines0 = ch.u.map(function(u, k) { return { name: '源' + (k + 1), eps: [u] }; });
  openPlayer(ch.n, '', lines0, 0, 0, true);
  setStatus('正在挑选可用源（共 ' + ch.u.length + ' 个）…');

  liveProbeAll(ch.u, function(r) {
    /* 只保存「有可用源」的结论，全死的不写盘：源会自己恢复 */
    if (r.ok.length) {
      LIVE.probed[ch.n] = { ok: r.ok, t: Date.now() };
      liveProbeSave();
    }
    if (!r.ok.length) {
      /* 全都探不通：别让用户干等，直接说清楚并退回列表。
         同时登记一次失败，连续失败会触发换源更新（列表可能已过期）。 */
      closePlayer();
      toast('这个频道的 ' + ch.u.length + ' 个源当前都不可用，换一个台试试');
      liveOnAllDead(ch.n);
      livePaint();
      return;
    }
    /* 保留原始地址列表，只把「确认死掉」的排到后面继续备用。
       不直接从频道里删：实测同一个地址会因为 CDN 抖动一会儿 000 一会儿 200，
       而且有些源返回 200 + JSON 错误体（「找不到该频道」），
       过一会儿又能出画面。删掉就等于永久放弃，太激进。 */
    startLive(ch.n, r.ok, ch.u);
  });
}

/** 用探活结果真正开始播放。
    urls = 探活的可用源（排最前）；all = 全部源（探活失败的排在后面兜底）。
    这样「探活没探到但其实能用」的情况也有机会播出来，不至于直接判死。 */
function startLive(name, urls, all) {
  var list = (urls || []).slice();
  (all || []).forEach(function(u) { if (list.indexOf(u) < 0) list.push(u); });
  var lines = list.map(function(u, k) { return { name: '源' + (k + 1), eps: [u] }; });
  PL.title = name;
  PL.lines = lines;
  PL.li = 0;
  PL.ei = 0;
  PL.live = true;
  PL.attempt = 0;
  PL.pass = 0;
  PL.token++;
  PL.nativeTried = {};
  PL.prechecked = {};
  PL.triedHls = false;
  PL.mseUrl = '';
  PL.everPlayed = false;
  PL.failed = false;
  var eps = list.length;
  if (urls && urls.length && eps > urls.length) {
    toast('已选用 ' + urls.length + ' 个可用源，其余 ' + (eps - urls.length) + ' 个备着');
  } else if (eps > 1) {
    toast('共 ' + eps + ' 个源，播不动会自动切换');
  }
  playAt(0);
}

/* ---------------------------------------------------------------- 首页门户 */
/* 版式对齐桌面端 HomePortal：分类 tab → 焦点轮播 + 热播榜 → 筛选条 → 分区海报墙。
   移动端把桌面右侧的热播榜折成两列 10 条，筛选改成三个下拉，其余信息层级保持一致。 */

function stopHeroTimer() {
  if (state.heroTimer) { clearInterval(state.heroTimer); state.heroTimer = null; }
}

function heroSlideHtml(it, on) {
  var tags = [];
  if (it[3]) tags.push('<span class="rt">★ ' + esc(it[3]) + '</span>');
  if (it[1]) tags.push('<span>' + esc(it[1]) + '</span>');
  if (it[4]) tags.push('<span>' + esc(it[4]) + '</span>');
  if (it[2]) {
    String(it[2]).split(',').slice(0, 2).forEach(function(g) {
      if (g) tags.push('<span>' + esc(g) + '</span>');
    });
  }
  /* 焦点图尺寸大、放得下，版本和画质都带上——用户扫一眼就知道是抢鲜还是完结 */
  var hq = qInfo(it[7]), hv = verInfo(it[7], it[12]);
  if (hq) tags.push('<span class="qx">' + esc(hq.text) + '</span>');
  if (hv) tags.push('<span class="vx">' + esc(hv.text) + '</span>');
  // 有真实封面就拿它当焦点图背景，没有才退回片名哈希生成的渐变
  var style = posterStyle(it[0]);
  if (it[6]) {
    style += ';background-image:url(&quot;' + esc(it[6]) + '&quot;)'
      + ';background-size:cover;background-position:center 22%';
  }
  return '<div class="hero-slide' + (on ? ' on' : '') + '" aria-hidden="' + (on ? 'false' : 'true')
    + '" style="' + style + '">'
    + '<div class="glow"></div><div class="shade"></div>'
    + '<div class="body">'
    + '<span class="kicker"><i></i>今日焦点 · FEATURED</span>'
    + '<h1>' + esc(it[0]) + '</h1>'
    + '<div class="tags">' + tags.join('') + '</div>'
    + '<div class="acts">'
    + '<button class="play" data-hero-play="1" data-title="' + esc(it[0]) + '">▶ 立即播放</button>'
    + '<button class="more" data-hero-play="1" data-title="' + esc(it[0]) + '">搜索片源</button>'
    + '</div></div></div>';
}

/** 一次把所有焦点图渲进 DOM，之后只切 .on —— 避免每 5.5 秒重建整块 DOM
    （重建会让 WebView 的无障碍树一直失效，TalkBack 读不到，读屏体验很差） */
function renderHero() {
  var list = heroRows();
  if (!list.length) return '';
  var idx = state.hero % list.length;
  var slides = list.map(function(it, i) { return heroSlideHtml(it, i === idx); }).join('');
  var dots = list.map(function(_, i) {
    return '<i class="' + (i === idx ? 'on' : '') + '" data-hero="' + i + '"></i>';
  }).join('');
  return '<div class="hero">' + slides + '<div class="dots">' + dots + '</div></div>';
}

/** 切到第 n 张：只改 class，不重建 DOM */
function showSlide(n) {
  var wrap = $('heroWrap');
  if (!wrap) return;
  var slides = wrap.querySelectorAll('.hero-slide');
  var dots = wrap.querySelectorAll('.dots i');
  if (!slides.length) return;
  state.hero = ((n % slides.length) + slides.length) % slides.length;
  for (var i = 0; i < slides.length; i++) {
    slides[i].className = 'hero-slide' + (i === state.hero ? ' on' : '');
    slides[i].setAttribute('aria-hidden', i === state.hero ? 'false' : 'true');
    if (dots[i]) dots[i].className = (i === state.hero ? 'on' : '');
  }
}

function startHeroTimer() {
  stopHeroTimer();
  var list = heroRows();
  if (list.length < 2 || state.q) return;
  state.heroTimer = setInterval(function() {
    showSlide(state.hero + 1);
  }, 5500);
}

function rankCardHtml(expanded) {

  return '<div class="rank"><div class="rank-h">'
    + '<h2><em>●</em> 热播榜</h2><small>TOP 10</small></div>'
    + '<div class="rank-list">' + items + '</div></div>';
}

    + (hasFilter ? '<button class="fchip" data-f="reset">重置</button>' : '')
    + '</div>';
}

/** 源状态条：数据来自原生层定期检测，点一下直接进「源检测 / 自动维护」弹窗 */
function renderSrcBar() {
  var el = $('srcBar');
  if (!el) return;
  var st = healthStats();
  var cls = 'srcbar';
  var text;
  if (!CFG.sources.length) {
    cls += ' bad';
    text = '还没有采集接口，点这里添加';
  } else if (!st.checked) {
    cls += ' warn';
    text = '已内置 <b>' + CFG.sources.length + '</b> 个接口 · 尚未检测，点此检测';
  } else if (st.searchable === 0) {
    cls += ' bad';
    text = '<b>' + st.total + '</b> 个接口当前都不可用，点此重新检测';
  } else {
    if (st.ok < st.total || st.searchable < st.ok) cls += ' warn';
    text = '可用 <b>' + st.ok + '</b> / ' + st.total
      + ' · 可搜索 <b>' + st.searchable + '</b>'
      + (HEALTH.nextAt ? ' · ' + fmtEta(HEALTH.nextAt) + '自动检测' : '');
  }
  el.innerHTML = '<div class="' + cls + '"><span class="dot"></span>'
    + '<span>' + text + '</span><span class="go">查看 ›</span></div>';
}

function renderHome() {

  renderSrcBar();
  var view = $('view');
  syncBack();                      // 首页 / 全库视图切换后刷新返回键状态
  /* 直播版：直播是独立版面，不参与影片筛选。首次进入或缓存过期就自动拉一次源；

  if (LIVE_EDITION && state.cat === 'live') {

  // 全库网格是独立视图，走另一套渲染

  var html = '';

      + '<b>源管理 / 从订阅导入</b>，粘贴 TVBox 配置订阅 URL 即可批量导入；'
      + '也可每行填 <b>名称|接口地址</b>。</p>'
      + '<p>若不想配置，可切换到「连接桌面服务」模式，连家里电脑上的桌面服务。</p>'

  if (state.cat !== 'rank') {
    html += '<div id="heroWrap">' + renderHero() + '</div>';

  }

  var total = 0;

  }).map(function(s) {
    // 默认让每个分区按自己的定位排序（最新上线=时间、热门推荐=热度）；
    // 一旦用户在筛选条里手动选了排序，就统一跟随，避免「选了评分却还是热度序」
    var data = filtered(all.filter(s.pick), state.sortTouched ? state.sort : s.sort);

  if (state.cat === 'rank') {

  }

  // 各分区之间会重复出现同一部片，统计行按片名去重，跟筛选弹层里的数字保持一致
  var seenTitle = {};
  rows.forEach(function(x) {
    x.data.forEach(function(r) { seenTitle[r[0]] = 1; });
  });
  var distinct = Object.keys(seenTitle).length;

  var label = catLabel(state.cat);
  if (state.genre !== '全部' || state.year !== '全部') {
    label += ' · ' + (state.genre === '全部' ? '全部类型' : state.genre)

  html += '<div class="stat"><span>当前分类 <b>' + esc(label) + '</b> · <b>'

  // 片库还没同步时给一句说明和手动入口，避免用户以为首页只有这几十部
  if (!POOL.items.length) {
    html += '<div class="pooltip">'
      + (POOL.loading
        ? '<span class="spin"></span><span>正在从采集接口同步片库，首次约需 10 秒…</span>'
        : '<span>片库尚未同步，当前只显示内置精选 ' + DATA.length

      var sub = x.def.sub || '';

      html += '<section><div class="sec-head"><h2>' + esc(x.def.title) + '</h2>'

        + x.data.length + ' 部</small>' + moreLink + '</div></div>'
        + '<div class="' + (state.cat === 'rank' ? 'grid' : 'row') + '">'
        + capped.map(function(r) {
            // rank 分区走三列网格，其余走横向 116px 卡片，两种宽度差别不小
            return posterHtml(r, state.cat === 'rank' ? null : { w: 98 });
          }).join('') + '</div>'
        + '</section>';
    });
  }

  html += '<p class="foot-note">点击任意海报即可搜索并播放 · 支持按类型、年份筛选（含 2026 / 2025）</p>';
  view.innerHTML = html;

/* ---------------------------------------------------------------- 全库视图
   首页每个分区只放 SEC_LIMIT 张，想看更多就进这里：网格按批渲染（默认 60 张），
   底部还能让接口继续往后翻页，片库会越用越大。 */
function renderMoreView() {
  var all = allRows();
  var def = null;
  var rows;
  if (state.more === 'all') {
    rows = filtered(all);                       // 跟随筛选条的类型/年份/排序
  } else {
    SECTIONS.forEach(function(s) { if (s.key === state.more) def = s; });
    // 分区页优先用分区自带排序（最新/热度），用户手动改过筛选条就以用户为准
    rows = def ? filtered(all.filter(def.pick), state.sortTouched ? state.sort : def.sort)
               : filtered(all);
  }
  var title = def ? def.title : '全部影视';
  var shown = Math.min(rows.length, state.moreShown || 60);

  var html = '<section><div class="sec-head"><h2>' + esc(title) + '</h2>'
    + '<div class="sh-right"><small>' + rows.length + ' 部</small>'
    + '<button class="more" data-more-back="1">返回推荐 ›</button></div></div>'
    + filterBarHtml('flat')
    + (rows.length
      ? '<div class="grid">' + rows.slice(0, shown).map(function(r) {
          return posterHtml(r);
        }).join('') + '</div>'
      : '<div class="center">这个分区还没有内容<br><small>点下面「从接口继续同步」拉更多片</small></div>')
    + '</section>';

  html += '<div class="loadbar">';
  if (shown < rows.length) {
    html += '<button class="btn" id="moreShow">显示更多（还有 ' + (rows.length - shown) + ' 部）</button>';
  }
  html += '<button class="btn ghost" id="poolMore">'
    + (POOL.loading ? '正在同步…' : '从接口继续同步') + '</button>'
    + '<small>片库共 <b>' + all.length + '</b> 部 · '
    + (POOL.pages ? '已翻到第 ' + POOL.pages + ' 页' : '尚未同步')
    + (POOL.err ? ' · ' + esc(POOL.err) : '') + '</small>';
  html += '</div>';
  return html;
}

function openMore(key) {

}
