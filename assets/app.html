<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>匆匆影视</title>
<style>
  :root{
    --bg:#0b101a; --card:#141c2c; --chip:#1c2740; --line:#24304a;
    --text:#e8ecf4; --muted:#94a0b8; --faint:#6b7690;
    --accent:#7c5cff; --rating:#ffc451; --danger:#ff5c6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:20;background:rgba(11,16,26,.95);
    backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
    /* 右上角是原生齿轮按钮（84px + 18px 边距）的浮层，留出 100px 免得被盖住 */
    padding-right:100px}
  .brand{font-size:19px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
  .brand span{font-size:10px;font-weight:700;color:var(--accent);margin-left:6px;
    border:1px solid var(--accent);border-radius:5px;padding:1px 5px;vertical-align:2px}
  .searchbar{display:flex;gap:8px}
  .searchbar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:24px;padding:10px 16px;font-size:14px;outline:none}
  .searchbar input:focus{border-color:var(--accent)}
  .searchbar button{background:var(--accent);color:#fff;border:0;border-radius:24px;
    padding:0 18px;font-size:14px;font-weight:600}

  /* 分类：下划线 tab（对齐桌面端 CategoryNav），不再是圆角 chip */
  .cats{display:flex;gap:0;overflow-x:auto;padding:0 14px;scrollbar-width:none;
    border-bottom:1px solid var(--line);background:rgba(11,16,26,.95)}
  .cats::-webkit-scrollbar,.row::-webkit-scrollbar,.fbar::-webkit-scrollbar{display:none}
  .tab{position:relative;flex:0 0 auto;background:none;border:0;padding:11px 13px;
    font-size:14px;color:var(--muted);white-space:nowrap;font-family:inherit}
  .tab.on{color:var(--text);font-weight:700}
  .tab.on:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:22px;height:2px;border-radius:2px;background:var(--accent)}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--chip);
    color:var(--muted);font-size:13px;border:1px solid transparent}
  .chip.on{background:var(--accent);color:#fff;font-weight:600}

  /* 源状态条：点一下直接进原生「源检测」弹窗 */
  .srcbar{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:9px 12px;
    border-radius:12px;border:1px solid var(--line);font-size:11px;line-height:1.5;
    color:var(--muted);background:linear-gradient(120deg,rgba(124,92,255,.14),rgba(20,28,44,.92))}
  .srcbar .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#34d399;
    box-shadow:0 0 0 3px rgba(52,211,153,.16)}
  .srcbar.warn .dot{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.16)}
  .srcbar.bad .dot{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.16)}
  .srcbar b{color:var(--text);font-weight:700}
  .srcbar .go{margin-left:auto;flex:0 0 auto;color:var(--accent);font-weight:700}

  /* 焦点轮播：对齐桌面端 HeroBanner，移动端压到 216px。
     多张预渲染 + 只切 .on，淡入淡出，不重建 DOM */
  .hero{position:relative;height:216px;margin:14px 14px 16px;border-radius:16px;
    overflow:hidden;border:1px solid var(--line);background:#101827}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;
    pointer-events:none;
    background:linear-gradient(155deg,hsl(var(--h) 58% 30%),hsl(var(--h2) 62% 10%))}
  .hero-slide.on{opacity:1;pointer-events:auto}
  .hero-slide .glow{position:absolute;right:-46px;top:-64px;width:210px;height:210px;
    border-radius:50%;opacity:.32;filter:blur(36px);background:hsl(var(--h) 70% 55%)}
  .hero-slide .shade{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.5) 58%,rgba(0,0,0,.88))}
  .hero-slide .body{position:absolute;inset:auto 0 0 0;padding:14px}
  .hero-slide .kicker{display:inline-flex;align-items:center;gap:5px;font-size:9px;
    letter-spacing:.16em;color:rgba(255,255,255,.68);
    border:1px solid rgba(255,255,255,.24);border-radius:20px;padding:3px 8px}
  .hero-slide .kicker i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .hero-slide h1{margin:8px 0 0;font-size:26px;line-height:1.16;font-weight:800;color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-slide .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .hero-slide .tags span{font-size:10px;color:rgba(255,255,255,.88);
    background:rgba(255,255,255,.14);border-radius:5px;padding:2px 7px}
  .hero-slide .tags span.rt{background:rgba(255,196,81,.22);color:var(--rating);font-weight:700}
  /* 焦点图上的画质 / 版本：金色画质、绿色完结，和下面海报墙的角标语义保持一致 */
  .hero-slide .tags span.qx{background:linear-gradient(135deg,#f0c64e,#d99a1f);
    color:#231800;font-weight:700}
  .hero-slide .tags span.vx{background:rgba(30,158,110,.55);color:#eafff5;font-weight:700}
  .hero-slide .acts{display:flex;gap:8px;margin-top:12px}
  .hero-slide .acts button{border:0;border-radius:20px;padding:9px 18px;font-size:12px;
    font-weight:700;font-family:inherit}
  .hero-slide .acts .play{background:var(--accent);color:#fff}
  .hero-slide .acts .more{background:rgba(255,255,255,.15);color:#fff;
    border:1px solid rgba(255,255,255,.22)}
  .hero .dots{position:absolute;z-index:3;right:12px;bottom:14px;display:flex;gap:5px}
  .hero .dots i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(0,0,0,.28);transition:all .3s}
  .hero .dots i.on{width:16px;background:#fff}

  /* 热播榜：桌面端是右侧 300px 栏，移动端折成两列 10 条放正文上方 */
  .rank{margin:0 14px 18px;padding:12px 12px 6px;border-radius:14px;
    border:1px solid var(--line);background:var(--card)}
  .rank-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .rank-h h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .rank-h h2 em{color:var(--danger);font-style:normal;font-size:10px}
  .rank-h small{font-size:9px;letter-spacing:.16em;color:var(--faint)}
  .rank-list{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .rank-item{display:flex;align-items:center;gap:7px;width:100%;padding:7px 2px;
    border:0;background:none;text-align:left;overflow:hidden;font-family:inherit}
  .rank-item .no{flex:0 0 15px;text-align:center;font-size:11px;font-weight:800;
    font-variant-numeric:tabular-nums;color:var(--faint)}
  .rank-item .no.n1{color:var(--danger)}
  .rank-item .no.n2{color:#ff9f43}
  .rank-item .no.n3{color:var(--rating)}
  .rank-item .nm{flex:1;min-width:0;font-size:12px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-item .sc{flex:0 0 auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* 筛选条：类型 / 年份 / 排序 三个下拉，点开走底部弹层 */
  .fbar{display:flex;gap:7px;padding:0 14px 14px;overflow-x:auto;scrollbar-width:none}
  /* 嵌在 section 里时去掉左右内边距，否则会和分区的 14px 叠加成 28px、对不齐标题 */
  .fbar.flat{padding-left:0;padding-right:0;padding-top:2px}
  .fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:16px;padding:6px 12px;font-size:12px;font-family:inherit}
  .fchip.on{border-color:var(--accent);color:#c9baff;background:rgba(124,92,255,.14)}
  .fchip i{font-style:normal;font-size:8px;opacity:.75}
  .opt{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .opt button{min-width:62px;border-radius:10px;padding:9px 12px;font-size:13px;
    background:var(--chip);color:var(--text);border:1px solid var(--line);font-family:inherit}
  .opt button.on{background:rgba(124,92,255,.22);border-color:var(--accent);
    color:#c9baff;font-weight:700}
  .opt-h{font-size:12px;font-weight:700;margin:6px 0 9px;color:var(--text)}
  .opt button small{display:block;font-size:9px;opacity:.62;margin-top:2px;font-weight:400}
  .opt button.off{opacity:.42}

  .stat{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 14px 14px;font-size:11px;color:var(--faint);line-height:1.6}
  .stat span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat b{color:var(--text);font-weight:700}
  .foot-note{text-align:center;color:var(--faint);font-size:11px;line-height:1.7;
    margin:4px 14px 10px}
  .sheet-title{font-size:15px;font-weight:700;margin:2px 0 14px}
  main{padding:0}
  .tip{margin:10px 14px 12px;padding:9px 12px;border-radius:10px;
    background:var(--chip);border:1px solid var(--line);
    color:var(--muted);font-size:11px;line-height:1.5}
  .tip b{color:var(--accent)}
  .banner{margin:12px 14px 16px;padding:16px;border-radius:14px;
    background:linear-gradient(120deg,#2a1d5a,#142a4a);border:1px solid var(--line)}
  .banner h3{margin:0 0 6px;font-size:16px}
  .banner p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.6}
  .banner b{color:var(--accent)}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:20px;
    padding:9px 18px;font-size:13px;font-weight:600}
  .btn.ghost{background:var(--chip);color:var(--text)}
  section{margin:0 0 22px;padding:0 14px}
  #view > section:first-child{padding-top:12px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
  .sec-head h2{margin:0;font-size:16px;font-weight:700}
  .sec-head .sh-right{display:flex;align-items:baseline;gap:9px;min-width:0;justify-content:flex-end}
  .sec-head small{color:var(--faint);font-size:11px;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
  /* 文字链按钮：搜索结果标题右侧的「返回推荐」、片库提示里的「立即同步」 */
  .lnk{background:none;border:0;padding:0 0 0 4px;margin:0;font-family:inherit;
    color:#a48cff;font-size:11px;font-weight:600;white-space:nowrap}
  /* 分区标题右侧的「全部 N 部 ›」，点了进全库网格 */
  .sec-head .more{background:none;border:0;padding:0;margin:0;font-family:inherit;
    color:#a48cff;font-size:11px;font-weight:600;white-space:nowrap}
  /* 片库同步提示：只在第一次拉取时出现在统计行下方，不挡内容 */
  .pooltip{margin:0 14px 14px;padding:9px 12px;border-radius:10px;
    display:flex;align-items:center;gap:8px;line-height:1.5;
    background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.28);
    color:var(--muted);font-size:11px}
  .pooltip b{color:#c9baff}
  .pooltip .spin{width:13px;height:13px;border-width:2px;flex:0 0 13px}
  .loadbar{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 14px 26px}
  .loadbar .btn{min-width:190px;text-align:center}
  .loadbar small{color:var(--faint);font-size:11px}
  .row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;
    border:1px solid var(--line);background:#1a2440}
  /* 横向海报墙：flex 子项必须给固定宽度，否则内部全为绝对定位时宽度会塌陷成 2px */
  .row .poster{flex:0 0 116px;width:116px}
  /* 老 WebView 对 inset 简写的支持不稳（见过退化成 content-size 的），四边都写死 */
  .poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  /* 无封面兜底：以前 .ph 是空 div，缺图时整张卡就只剩一块纯色。现在把片名居中放进去，
     img 一旦加载成功就会盖住它，加载失败（onerror 隐藏 img）时正好露出来。 */
  .poster .ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;
    align-items:center;justify-content:center;padding:12px 9px 40%;
    font-size:12px;font-weight:600;line-height:1.3;color:#fff;text-align:center;
    background:linear-gradient(155deg,hsl(var(--h) 58% 34%),hsl(var(--h2) 62% 14%))}
  .poster .ph b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.45)}
  /* meta 底部留白给足：三列小卡里「年份·地区·类型」那一行原本几乎贴着卡片下边缘，
     汉字的下伸部分会被 .poster 的 overflow:hidden 切掉半个像素级的边，看着就是被裁了。
     渐变加深加高：封面本身可能是亮黄、亮红的画面，只压 0.55 的黑，白字会糊在图上。 */
  .poster .meta{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 10px;
    background:linear-gradient(transparent,rgba(0,0,0,.3) 22%,rgba(0,0,0,.78) 56%,rgba(0,0,0,.95));
    font-size:10px;color:#d6dcec}
  .poster .meta .ttl{font-size:11px;line-height:15px;color:#fff;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  /* 第一行放角标：版本（已完结 / 更新至N集 / 正版）+ 画质（4K / 1080P / HD…）+ 来源。
     顺序即优先级：卡窄时被挤掉的是最后那个来源，版本和画质永远优先保住。 */
  .poster .meta .chips{display:flex;gap:4px;align-items:center;margin:0 0 4px;overflow:hidden}
  .poster .meta .chips > span{flex:0 0 auto;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:12px;
    border-radius:4px;padding:1px 5px;color:#fff;font-weight:600}
  /* 来源改成不带底色的暗字，前面两枚角标才有呼吸感，被挤时也是它先缩 */
  .poster .meta .chips .src2{flex:0 1 auto;min-width:0;padding:0;border-radius:0;
    background:none;color:rgba(255,255,255,.8);font-weight:500;font-size:9px;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}
  /* 年份 · 地区 · 类型：字段没超宽就整行显示，超宽由 subLine() 在生成时按优先级丢掉
     末尾字段，绝不出现「2026 · 中国大陆 · 国…」这种半个词被省略号切开的观感 */
  .poster .meta .sub{font-size:10px;line-height:14px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .poster .tag{position:absolute;top:5px;left:5px;background:var(--danger);color:#fff;
    font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px}
  /* 画质角标固定在右上角：底部的文字流再挤也挤不到它，做到「必须显示」。
     评分也在这一排（更靠左），两者不重叠。 */
  .poster .corner{position:absolute;top:5px;right:5px;display:flex;gap:4px;
    align-items:center;max-width:74%;overflow:hidden}
  .poster .star{flex:0 0 auto;background:rgba(0,0,0,.72);color:var(--rating);
    font-size:10px;font-weight:700;border-radius:4px;padding:2px 5px}
  .poster .q{flex:0 0 auto;font-size:9px;font-weight:700;line-height:12px;
    border-radius:4px;padding:1px 5px;color:#fff;letter-spacing:.3px;
    box-shadow:0 1px 4px rgba(0,0,0,.5)}
  /* 版本角标：颜色即语义，扫一眼就能分出完结 / 追更 / 正版 / 抢先 */
  .poster .ver.done{background:rgba(30,158,110,.95)}
  .poster .ver.upd{background:rgba(214,132,26,.95)}
  .poster .ver.vip{background:rgba(198,152,40,.96);color:#1b1200}
  .poster .ver.cam{background:rgba(198,58,58,.95)}
  .poster .ver.pre{background:rgba(96,104,124,.95)}
  .poster .ver.misc{background:rgba(96,104,124,.95)}
  /* 画质角标：4K 金、1080P 浅蓝、720P 靛、蓝光 紫（片源级）、HD 蓝、标清 灰、TC 红 */
  .poster .q4k{background:linear-gradient(135deg,#f0c64e,#d99a1f);color:#231800}
  .poster .q1080{background:rgba(46,160,224,.96)}
  .poster .q720{background:rgba(72,108,196,.95)}
  .poster .qbd{background:rgba(128,96,214,.95)}
  .poster .qhd{background:rgba(52,124,214,.95)}
  .poster .qsd{background:rgba(104,112,132,.95)}
  .poster .qcam{background:rgba(198,58,58,.95)}
  /* 搜索结果顶部那行排序说明 */
  .sorthint{color:var(--faint);font-size:10px;margin:-6px 0 9px;letter-spacing:.2px}
  /* ---------------- 直播版面 ---------------- */
  .live-src{display:flex;align-items:center;gap:7px;margin:0 0 10px;
    font-size:11px;color:var(--muted)}
  .live-src b{font-weight:500;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .live-src .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px}
  .live-src .dot.busy{animation:lpulse 1s ease-in-out infinite}
  @keyframes lpulse{50%{opacity:.25}}
  .live-rec{display:flex;align-items:center;gap:6px;margin:0 0 10px;overflow-x:auto;
    scrollbar-width:none;white-space:nowrap}
  .live-rec > span{flex:0 0 auto;color:var(--faint);font-size:11px}
  .live-rec button{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:5px 11px;font-size:11px;font-family:inherit}
  .live-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .live-chips button{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);
    color:var(--muted);border-radius:14px;padding:5px 11px;font-size:11px;font-family:inherit}
  .live-chips button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  .live-addline{margin:-2px 0 8px}
  .live-form{display:flex;gap:8px;align-items:center;margin:0 0 8px}
  .live-form .live-q{margin:0;flex:1;min-width:0;font-size:12px;padding:8px 10px}
  .live-form .btn{padding:8px 14px;font-size:12px;flex:0 0 auto}
  .live-custom{display:flex;flex-direction:column;gap:5px;margin:0 0 10px}
  .live-custom > span{position:relative;background:var(--chip);border:1px solid var(--line);
    border-radius:8px;padding:6px 26px 6px 9px;font-size:11px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live-custom i{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-style:normal;color:var(--faint);font-size:14px;cursor:pointer}
  .live-q{width:100%;margin:2px 0 12px;background:var(--chip);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;
    -webkit-appearance:none;appearance:none}
  .live-q::placeholder{color:var(--faint)}
  .live-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  /* 频道格 + 右上角星标：星是独立按钮，所以要包一层定位容器 */
  .lt-wrap{position:relative}
  .lt-star{position:absolute;top:2px;right:2px;width:26px;height:26px;padding:0;
    border:0;background:transparent;color:rgba(255,255,255,.45);font-size:14px;
    line-height:26px;text-align:center;font-family:inherit;z-index:2}
  .lt-star.on{color:#ffcf4d;text-shadow:0 0 6px rgba(255,207,77,.55)}
  .lt.fav{border-color:rgba(255,207,77,.42)}
  /* width:100% 必须写：button 的 auto 宽度是「收缩到内容」，不会像 grid item 那样
     自动撑满，不写的话按钮只占左侧一条，星标会飘到格子外面的空隙里（实测截图确认过） */
  .lt{width:100%;box-sizing:border-box;padding-right:22px}   /* 右侧给星标让位 */
  /* 「继续播放」整条按钮 */
  .live-cont{margin:0 0 10px}
  .live-cont button{width:100%;display:flex;align-items:center;gap:8px;
    background:linear-gradient(100deg,rgba(88,72,200,.30),rgba(30,44,80,.55));
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    color:var(--text);font-family:inherit;text-align:left}
  .live-cont .pl{flex:0 0 auto;color:#a48cff;font-size:11px}
  .live-cont b{flex:0 0 auto;font-size:12px;color:#cfc4ff}
  .live-cont em{flex:1;min-width:0;font-style:normal;font-size:13px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live-favrow button{color:#ffcf4d}
  .lt{position:relative;border:1px solid var(--line);border-radius:10px;
    padding:9px 8px;min-height:50px;display:flex;align-items:center;
    background:linear-gradient(150deg,hsl(var(--h) 46% 27%),hsl(var(--h2) 52% 14%));
    color:#fff;font-size:12px;font-weight:600;font-family:inherit;text-align:left;
    line-height:1.3;overflow:hidden}
  .lt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-all;padding-left:12px}
  /* 源数量挪到左上角：右上角给收藏星标让位，否则两者会叠在一起（截图确认过） */
  .lt i{position:absolute;top:4px;left:6px;font-size:9px;font-style:normal;opacity:.55;
    padding:0 3px;border-radius:3px;background:rgba(0,0,0,.28)}
  /* 画质徽标：压在最底部，4K 金 / 8K 更亮，一眼认出高画质台 */
  .lt-q{position:absolute;left:6px;bottom:5px;font-style:normal;text-decoration:none;
    font-size:9px;font-weight:700;line-height:12px;padding:0 4px;border-radius:3px;
    letter-spacing:.3px}
  .lt-q.q4{background:linear-gradient(135deg,#f0c64e,#d99a1f);color:#231800}
  .lt-q.q8{background:linear-gradient(135deg,#ffe9a3,#ffb02e);color:#2a1c00;
    box-shadow:0 0 7px rgba(255,190,60,.65)}
  .lt:active{transform:scale(.97)}
  .center{text-align:center;padding:36px 12px;color:var(--muted);font-size:13px;line-height:1.8}
  .spin{display:inline-block;width:22px;height:22px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-5px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* z-index 必须高于 #player(100)：跳过设置等面板是在播放器里打开的，
     原来只有 40，会被播放器整层盖住 —— 表现就是「弹窗弹在影视界面后面，
     必须关掉播放页才看得见」。toast 是 120，所以取 200 同时压过两者。 */
  .sheet{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.62);
    display:flex;align-items:flex-end}
  .sheet.hidden{display:none}
  .sheet-in{width:100%;max-height:88vh;overflow-y:auto;background:var(--bg);
    border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet-close{float:right;background:var(--chip);color:var(--text);border:0;
    border-radius:50%;width:30px;height:30px;font-size:16px;line-height:1}
  .d-top{display:flex;gap:12px;margin:6px 0 14px}
  .d-top .poster{width:96px;flex:0 0 96px}
  /* 详情页海报只有 96px 宽，右边紧挨着就是标题/年份/来源，卡内再叠一遍文字纯属重复，
     遮住封面还显得挤；这里只留封面本身（没封面时由 .ph 居中显示片名）。
     「2026 NEW」也一起去掉——年份在右侧那一行已经写了，留着只会和右上角的画质角标挤。 */
  .d-top .poster .meta{display:none}
  .d-top .poster .tag{display:none}
  .d-info{flex:1;min-width:0}
  .d-info h3{margin:0 0 8px;font-size:17px;line-height:1.35}
  .d-info p{margin:0 0 6px;font-size:11px;color:var(--muted);line-height:1.6}
  .d-desc{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 14px;
    max-height:88px;overflow:hidden}
  .d-sub{font-size:13px;font-weight:700;margin:14px 0 9px}
  .eps{display:flex;flex-wrap:wrap;gap:7px}
  .eps button{background:var(--chip);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;font-size:12px;min-width:56px}
  .eps button.hot{background:rgba(124,92,255,.22);border-color:var(--accent);color:#c9baff}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:#202a44;color:#fff;border:1px solid var(--line);
    border-radius:22px;padding:10px 18px;font-size:12px;z-index:120;opacity:0;
    transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
  .toast.show{opacity:1}
  footer{text-align:center;color:var(--faint);font-size:11px;padding:10px 14px 4px;line-height:1.7}

  /* ---------------- 应用内全屏播放器（优酷 / 爱奇艺 式） ---------------- */
  /* 显式四边定位 + dvh：兼容旧 WebView 不支持 inset，横屏时铺满含安全区 */
  #player{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
    height:100dvh;z-index:100;background:#000;color:#fff;display:none;overflow:hidden;
    /* 手势（左右快进 / 上下音量）自己处理，别让 WebView 把这次触摸当成滚动或缩放，
       否则 touchmove 里 preventDefault 会被忽略（日志里那串 cancelable=false）。 */
    touch-action:none;overscroll-behavior:contain;
    -webkit-user-select:none;user-select:none}
  #player.on{display:block}
  #player video{position:absolute;top:0;left:0;width:100%;height:100%;
    object-fit:contain;background:#000;display:block;transform-origin:center center}
  /* 「铺满」不再用 object-fit:cover —— 20:9 的屏放 16:9 的片源，cover 要把画面
     放大 1.25 倍、上下各裁掉 10%，人脸和字幕就切没了。改成 JS 算一个
     「最多放大 12%」的 scale（见 fitScale），黑边收窄但画面不被裁穿。 */
  #player video.cover{object-fit:contain}
  .p-mask{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;
    flex-direction:column;justify-content:flex-start;
    padding:calc(12px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(14px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    background:linear-gradient(180deg,rgba(0,0,0,.78),transparent 24%,transparent 62%,rgba(0,0,0,.86));
    transition:opacity .25s}
  .p-mask.hide{opacity:0;pointer-events:none}
  .p-top,.p-bottom{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
  .p-back{flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(0,0,0,.42);color:#fff;font-size:22px;line-height:1;
    text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .p-title{flex:1;min-width:0;font-size:14px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-title small{display:block;font-size:11px;color:#b9c2d6;font-weight:400;margin-top:3px}
  /* 深色半透明底 + 白描边 + 文字阴影：亮画面（如白场/彩色）上依然清晰可读 */
  /* 控制条按钮：毛玻璃胶囊。
     原来是纯黑半透明 + 硬边框，八个排一起像表格；改成上下渐变 + 内高光 +
     外投影，层次更清楚，按下有回弹。backdrop-filter 不支持时渐变背景兜底。 */
  .p-ico{flex:0 0 auto;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.15);
    color:#eef2f9;border-radius:17px;padding:7px 12px;
    font-size:12px;font-weight:500;line-height:1.25;letter-spacing:.2px;
    white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);
    box-shadow:0 2px 8px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.13);
    backdrop-filter:blur(9px) saturate(1.25);
    -webkit-backdrop-filter:blur(9px) saturate(1.25);
    transition:transform .12s ease,background .18s ease,border-color .18s ease}
  .p-ico:active{transform:scale(.94);background:rgba(255,255,255,.24)}
  .p-ico.on{background:linear-gradient(180deg,#8f74ff,#6a4dff);
    border-color:rgba(255,255,255,.3);color:#fff;
    box-shadow:0 3px 14px rgba(124,92,255,.5),inset 0 1px 0 rgba(255,255,255,.25)}
  /* 按钮排贴底：吸收上方剩余空间，避免悬浮在画面正中挡住视频主体 */
  .p-actions{margin-top:auto}
  /* 选集移进按钮容器后，横屏要靠 margin-left:auto 继续贴右，
     否则会紧挨着「兼容播放」，和原来的视觉不一致 */
  #pEpsBtn{margin-left:auto}
  /* 播放/暂停放在控制条最左端（左下角），小一号：以前那颗 64px 圆钮钉在画面正中，
     暂停时挡住字幕和人物，被吐槽过 */
  .p-play{flex:0 0 auto;width:36px;height:36px;border-radius:50%;padding:0;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);
    color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;
    justify-content:center}
  /* 手势反馈：左右滑快进、上下滑音量时浮在中间的提示 */
  .p-gest{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);
    display:none;padding:10px 16px;border-radius:10px;background:rgba(0,0,0,.72);
    font-size:15px;font-weight:600;color:#fff;pointer-events:none;white-space:nowrap;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .p-gest.on{display:block}
  /* ---------------- 起播等待层 ----------------
     以前是一块半透明黑底 + 一行「缓冲中…」压在纯黑画面上，观感很差。
     现在用封面做满屏模糊底，中间是环形进度 + 片名 + 一条流光进度条，
     遮挡住「什么都没有」的那几秒。 */
  /* 显式四边定位（不用 inset：老 WebView 不认，会退化成「缩到内容大小」） */
  .p-load{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;display:none;
    width:100%;height:100%;align-items:center;justify-content:center;
    background:#080b12;overflow:hidden}
  .p-load.on{display:flex}
  .p-load.out{opacity:0;transition:opacity .45s ease}
  .p-load-bd{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;
    background:#0b1020 center/cover no-repeat;
    filter:blur(22px) brightness(.52) saturate(1.25);transform:scale(1.12)}
  .p-load:after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(120% 90% at 50% 42%,rgba(8,11,18,0) 30%,rgba(8,11,18,.86))}
  /* 起播时底部控制条没意义（时间都是 00:00），收起来更干净；顶部返回键保留 */
  #player.loading .p-bottom{opacity:0;pointer-events:none;transform:translateY(10px)}
  .p-bottom{transition:opacity .25s,transform .25s}
  .p-load-in{position:relative;z-index:1;display:flex;flex-direction:column;
    align-items:center;gap:9px;padding:0 26px;text-align:center}
  .p-load-ring{width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    animation:plspin .85s linear infinite}
  @keyframes plspin{to{transform:rotate(360deg)}}
  .p-load-name{font-size:15px;font-weight:700;color:#fff;max-width:76vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 12px rgba(0,0,0,.75)}
  .p-load-sub{font-size:12px;color:#b6c0d4;letter-spacing:.4px;min-height:17px}
  .p-load-bar{position:relative;width:148px;height:3px;border-radius:2px;
    background:rgba(255,255,255,.13);overflow:hidden;margin-top:3px}
  .p-load-bar i{position:absolute;top:0;left:-45%;width:45%;height:100%;
    border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--accent) 55%,transparent);
    animation:plbar 1.2s ease-in-out infinite}
  @keyframes plbar{0%{left:-45%}100%{left:100%}}
  .p-status{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);
    display:none;width:max-content;max-width:84%;padding:16px 18px;border-radius:12px;
    text-align:center;background:rgba(0,0,0,.78);font-size:12px;line-height:1.8;color:#dfe5f2}
  .p-status.on{display:block}
  .p-status .btn{margin:10px 5px 0;font-size:12px;padding:8px 14px}
  .p-status .btn.ghost{background:var(--chip)}
  .p-seek{display:flex;align-items:center;gap:9px;font-size:11px;color:#dfe5f2;flex:1;min-width:0}
  /* 跳过设置面板 */
  .skip-cfg{display:flex;gap:10px;margin:14px 0 8px}
  .skip-cfg label{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .skip-cfg label > span{font-size:12px;color:var(--muted)}
  .skip-cfg label > em{font-style:normal;font-size:11px;color:var(--faint);align-self:flex-end;margin-top:-22px;margin-right:10px;pointer-events:none}
  .skip-auto{margin:14px 0 0}
  .skip-auto .sw{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text)}
  .skip-auto .sw input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
  .skip-tip{margin:8px 0 14px;font-size:11.5px;line-height:1.6;color:var(--faint)}
  .skip-acts{display:flex;gap:9px;margin-bottom:10px}
  .skip-acts .btn{flex:1}
  .skip-scope{display:flex;gap:16px;justify-content:center}
  /* ---------------- 弹幕 ----------------
     层级：视频(0) < 弹幕(3) < 控制条(p-mask 2 之上的内容)。弹幕不能吃点击，
     否则会挡住双击暂停。 */
  /* z-index 必须低于 .p-mask(2)：控制条要压在弹幕之上。
     之前写的 3 会让弹幕飘过按钮，看起来像「图标被遮挡」。
     高于视频(0) 即可；和 .p-load(1) 同层时靠 DOM 顺序（后者在后）压住它。 */
  .p-dm{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;
    overflow:hidden;pointer-events:none;contain:strict}
  .p-dm i{position:absolute;left:100%;white-space:nowrap;
    font-size:15px;font-weight:600;line-height:1.3;font-style:normal;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.7);
    will-change:transform;animation-name:dmScroll;animation-timing-function:linear;
    animation-fill-mode:forwards}
  @keyframes dmScroll{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 100%))}}
  /* 输入条：一行，紧凑；只在控制条可见时出现 */
  .p-dmbar{display:none;align-items:center;gap:7px;margin-bottom:6px}
  #player.dmon .p-dmbar{display:flex}
  .p-dmbar input{flex:1;min-width:0;background:rgba(0,0,0,.52);
    border:1px solid rgba(255,255,255,.22);border-radius:16px;
    padding:7px 13px;color:#fff;font-size:12.5px;font-family:inherit}
  .p-dmbar input::placeholder{color:rgba(255,255,255,.55)}
  .p-dmbar button{flex:0 0 auto;background:var(--accent);border:0;color:#fff;
    border-radius:16px;padding:7px 15px;font-size:12.5px;font-weight:600;font-family:inherit}
  .p-dmbar button:active{opacity:.8}
  /* 设置按钮：比「发送」小一号，视觉上退到次要位置 */
  .p-dmbar #pDmCfg{background:rgba(255,255,255,.14);padding:7px 10px;font-size:13px}
  /* 弹幕设置面板里的表单项 */
  .dm-cfg{display:flex;flex-direction:column;gap:10px;margin:14px 0 8px}
  .dm-cfg label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  /* 弹幕源状态一览：绿点=可用，灰点=已实测不可用 */
  .dmsrc{margin:12px 0 4px;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:rgba(255,255,255,.02)}
  .dmsrc-row{display:flex;align-items:baseline;gap:9px;padding:7px 11px;
    font-size:11.5px;border-top:1px solid var(--line)}
  .dmsrc-row:first-child{border-top:0}
  .dmsrc-row b{flex:0 0 68px;font-weight:600;color:var(--text)}
  .dmsrc-row span{flex:1;min-width:0;color:var(--faint);line-height:1.45}
  .dmsrc-row.ok b::before{content:'●';color:#4ade80;margin-right:5px;font-size:9px;
    vertical-align:middle}
  .dmsrc-row.no b{color:var(--muted)}
  .dmsrc-row.no b::before{content:'○';color:var(--faint);margin-right:5px;font-size:9px;
    vertical-align:middle}
  /* 面板里的小分区标题：B 站 / 弹弹play 两段分开，避免挤成一坨 */
  .dm-sec{display:flex;align-items:center;gap:8px;margin:18px 0 4px;
    font-size:12.5px;font-weight:600;color:var(--text)}
  .dm-sec em{font-style:normal;font-size:10.5px;font-weight:400;color:var(--faint);
    background:var(--chip);border-radius:6px;padding:2px 7px}
  .dm-cfg input{background:var(--chip);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;width:100%;
    box-sizing:border-box}
  /* 简化版：视频区下方新增弹幕层，横屏也不挡字幕 */
  /* 跳过片头/片尾按钮：压在画面右下（避开底部控制条），点击即跳 */
  .p-skip{position:absolute;right:calc(16px + env(safe-area-inset-right));
    bottom:calc(104px + env(safe-area-inset-bottom));z-index:6;
    padding:9px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.26);
    background:rgba(0,0,0,.68);color:#fff;font-size:12px;font-weight:600;
    font-family:inherit;display:none;backdrop-filter:blur(6px)}
  .p-skip.on{display:block}
  .p-skip:active{background:rgba(255,255,255,.2)}
  /* 进度条上标出片头/片尾区间，让用户知道跳过的是哪一段 */
  .p-seek{position:relative}
  .p-mark{position:absolute;top:50%;transform:translateY(-50%);height:22px;
    pointer-events:none;border-radius:2px;opacity:.34;z-index:0}
  .p-mark.head{left:0;background:linear-gradient(90deg,#7F77DD,#7F77DD00)}
  .p-mark.tail{right:0;background:linear-gradient(270deg,#D85A30,#D85A3000)}
  /* 切集按钮：放在进度条两端，看片时最顺手的位置。
     圆形同 p-play 保持视觉一致；不可用时（第一集/最后一集/直播）降成半透明不可点。 */
  .p-ep{flex:0 0 auto;width:34px;height:34px;border-radius:50%;padding:0;
    border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.34);
    color:#fff;line-height:1;font-family:inherit;
    display:flex;align-items:center;justify-content:center}
  .p-ep:active{background:rgba(255,255,255,.18)}
  .p-ep[disabled]{opacity:.3;pointer-events:none}
  /* 直播没有「集」的概念，整组按钮隐藏 */

  @media (max-height:460px){

<script src="hls.min.js"></script>
<script>
'use strict';

/* ---------------------------------------------------------------- JS Bridge
   原生层注入 Android 对象：httpGet / play / openSettings / getConfig /
   setLandscape / setPlayerOpen。浏览器预览时降级为 mock。 */
/* 直播版构建时 build_apk.py 会把下面这行改成 true；影视版保持 false。
   必须写在 CATS 之前：var 只提升声明，赋值是按执行顺序来的。 */
var LIVE_EDITION = false;   /*__LIVE__*/

var HAS_NATIVE = (typeof Android !== 'undefined');
window.__LTV = {
  pending: {}, seq: 0,
  /* timeoutMs 可选：默认 9 秒。搜索用 ac=videolist，单页 100~500KB，
     慢网（华为机上的弱网尤其）9 秒经常不够，会误判成「没有搜索结果」。 */
  req: function (url, timeoutMs) {
    var self = this;
    var tmo = timeoutMs || 9000;
    return new Promise(function (resolve, reject) {
      if (!HAS_NATIVE) { reject(new Error('浏览器预览模式：无原生网络桥')); return; }
      var id = 'r' + (++self.seq);
      var done = false;
      /* 原生那层用的是 HttpURLConnection 的 read timeout，而这个超时「每读到一点字节
         就重新计时」，服务端慢慢吐数据就能一直不超时——搜索页会永远转圈（鸿蒙上
         看起来就是「没结果」）。这里加一道 JS 侧硬超时，保证 promise 一定落地。
         注意给到 2×tmo：原生是 connectTimeout 和 readTimeout 各算一次，
         只给 tmo+3s 会把「连接慢一点但其实能成」的请求提前掐掉。 */
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        delete self.pending[id];
        reject(new Error('请求超时（' + Math.round(tmo / 1000) + ' 秒）'));
      }, tmo * 2 + 3000);
      self.pending[id] = {
        resolve: function (v) { if (done) return; done = true; clearTimeout(timer); resolve(v); },
        reject: function (e) { if (done) return; done = true; clearTimeout(timer); reject(e); }
      };
      Android.httpGet(url, id, tmo);
    });
  },
  /* 带自定义请求头的 GET。签名类接口（弹弹play 的 X-AppId / X-Timestamp /
     X-Signature）必须走这条：它不支持 OPTIONS 预检，浏览器 fetch 带自定义头
     会被 CORS 直接拦掉。 */
  reqH: function (url, headers, timeoutMs) {
    var self = this;
    var tmo = timeoutMs || 10000;
    return new Promise(function (resolve, reject) {
      if (!HAS_NATIVE) { reject(new Error('浏览器预览模式：无原生网络桥')); return; }
      if (!Android.httpGetH) { reject(new Error('当前版本不支持自定义请求头')); return; }
      var id = 'h' + (++self.seq);
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        delete self.pending[id];
        reject(new Error('请求超时（' + Math.round(tmo / 1000) + ' 秒）'));
      }, tmo * 2 + 3000);
      self.pending[id] = {
        resolve: function (v) { if (done) return; done = true; clearTimeout(timer); resolve(v); },
        reject: function (e) { if (done) return; done = true; clearTimeout(timer); reject(e); }
      };
      Android.httpGetH(url, id, tmo, JSON.stringify(headers || {}));
    });
  },
  /* GET 并解 raw deflate（B 站弹幕接口返回的就是这种）。
     浏览器端要 DecompressionStream('deflate-raw')（Chrome 103+），
     老 WebView 上直接 undefined，所以交给原生 Inflater 做。 */
  reqD: function (url, timeoutMs) {
    var self = this;
    var tmo = timeoutMs || 10000;
    return new Promise(function (resolve, reject) {
      if (!HAS_NATIVE) { reject(new Error('浏览器预览模式：无原生网络桥')); return; }
      if (!Android.httpGetD) { reject(new Error('当前版本不支持 deflate 解压')); return; }
      var id = 'd' + (++self.seq);
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        delete self.pending[id];
        reject(new Error('请求超时（' + Math.round(tmo / 1000) + ' 秒）'));
      }, tmo * 2 + 3000);
      self.pending[id] = {
        resolve: function (v) { if (done) return; done = true; clearTimeout(timer); resolve(v); },
        reject: function (e) { if (done) return; done = true; clearTimeout(timer); reject(e); }
      };
      Android.httpGetD(url, id, tmo);
    });
  },
  callback: function (id, ok, text) {
    var p = this.pending[id];
    if (!p) return;
    delete this.pending[id];
    if (ok) p.resolve(text); else p.reject(new Error(text || '请求失败'));
  },
  /* 大响应分片回传的拼装区。鸿蒙 / 部分厂商 WebView 对单次 evaluateJavascript
     的脚本长度有硬限制（实测超过约 100KB 就开始截断），search 用的
     ac=videolist 单页 100~500KB，一截断 JSON.parse 必炸 → 表现为「搜索无结果」。
     原生层按 48KB 切片，这里按序号拼回再走 callback。 */
  chunks: {},
  chunk: function (id, idx, total, ok, part) {
    var b = this.chunks[id];
    if (!b) { b = this.chunks[id] = { parts: [], got: 0, total: total, ok: ok }; }
    if (b.parts[idx] === undefined) b.got++;
    b.parts[idx] = part;
    if (b.got >= b.total) {

      this.callback(id, b.ok, b.parts.join(''));
    }

  probe: function (url) {
    var self = this;
    return new Promise(function (resolve, reject) {
      if (!HAS_NATIVE || !Android.probe) { reject(new Error('浏览器预览模式：无原生探测桥')); return; }

      self.pending[id] = {
        resolve: function (raw) {

          resolve(nl > 0 ? { url: raw.slice(0, nl), body: raw.slice(nl + 1) }

        },
        reject: reject
      };
      Android.probe(url, id);
    });
  },
  external: function (url, title) {
    if (HAS_NATIVE) Android.play(url, title);
    else toast('预览模式：外部播放器 ' + title);
  },
  landscape: function (on) {
    if (HAS_NATIVE && Android.setLandscape) Android.setLandscape(on);
  },
  /* 切换横竖屏：给播放器的「旋转」按钮用。

  toggleOrientation: function () {
    if (HAS_NATIVE && Android.toggleOrientation) Android.toggleOrientation();
    else toast('浏览器预览不支持旋转');
  },
  fullscreen: function (on) {
    if (HAS_NATIVE && Android.setFullscreen) Android.setFullscreen(on);
  },
  playerOpen: function (on) {
    if (HAS_NATIVE && Android.setPlayerOpen) Android.setPlayerOpen(on);
  },
  settings: function () {
    if (HAS_NATIVE) Android.openSettings();
    else toast('预览模式：设置由安卓原生对话框提供');
  },
  /* 源状态条 → 原生「源检测 / 自动维护」弹窗 */
  openHealth: function () {
    if (HAS_NATIVE && Android.openHealth) Android.openHealth();
    else toast('预览模式：源检测由安卓原生对话框提供');
  },
  /* 原生层检测完成后回调：更新状态条、焦点图数据与搜索排序 */
  health: function (payload) {
    try { HEALTH = JSON.parse(payload); } catch (e) { return; }

function genreMatch(g, want) {

   再叠一点新鲜度：刚上线的片给加分，避免老片长期霸榜。 */
function heatScore(r) {
  var src = r[11] || 0;                 // 收录源数 1~5
  var fresh = 0;
  var t = r[9] || 0;
  if (t) {
    var days = (Date.now() - t) / 86400000;
    fresh = days <= 3 ? 30 : days <= 7 ? 20 : days <= 15 ? 10 : 0;
  }
  return src * 100 + fresh;
}

    r.sort(function(a, b) {

    });
  } else if (m === '评分') {

}

        if (out.indexOf(GENRE_ALIAS[j][1]) < 0) out.push(GENRE_ALIAS[j][1]);
        break;
      }
    }
    if (out.length >= 3) break;
  }
  return out;
}

/** 只要一个最具体的类型（详情页副标题、无多类型需求的场合用它） */
function pickGenre(cls, typeName) { return pickGenres(cls, typeName)[0] || ''; }

/** 一条接口原始记录 → 内部数组；归类失败（成人/无关分类）返回 null。
    hint 是「这条记录是从哪个分类页拉到的」（如「科幻片」），
    源站很多片的 vod_class 是空的或不标题材，靠它把类型补回来，
    否则筛选条里科幻/犯罪/古装/历史这些永远只有个位数。 */
function adoptRaw(v, srcName, hint) {
  var name = String(v.vod_name || '').trim();
  if (!name) return null;
  var cat = typeToCat(v.type_name);
  if (!cat) return null;
  var year = String(v.vod_year || '').trim();
  if (!/^\d{4}$/.test(year)) {
    var m = /(\d{4})/.exec(String(v.vod_time || '')) || /(\d{4})/.exec(name);
    year = m ? m[1] : '';
  }
  var pic = String(v.vod_pic || '');
  if (pic.indexOf('http') !== 0) pic = '';
  // 评分一律留空：源站的 vod_score 绝大多数是 0.0，少数站直接给 10.0（刷的），
  // 拿它排榜会出现「绝世战魂第二季 10.0」压过肖申克 9.7 这种笑话。
  // 内置片单里的真实评分会在 allRows() 合并时按同名补进来。
  // 更新时间转毫秒时间戳，「最新」排序和新鲜度加分都用它（格式 2026-11-10 19:06:28，
  // 换成斜杠再交给 Date 解析，WebView 里才不会按 UTC 解读）。
  var ts = 0;
  var tm = String(v.vod_time || '').trim().replace(/-/g, '/');
  if (tm) { var dt = new Date(tm); if (!isNaN(dt.getTime())) ts = dt.getTime(); }
  // hits 只在 ac=videolist/detail 里有，ac=list 通常不带，留位备用
  var hits = parseInt(v.vod_hits || 0, 10) || 0;
  /* 第 12 槽：总集数。ac=list 通常不带 vod_total，只有部分站给；
     有就存下来，焦点图和片库卡片就能显示「全40集」而不是干巴巴的「已完结」 */
  var eps = parseInt(v.vod_total || 0, 10) || 0;
  return [name, year, pickGenres(v.vod_class, hint || v.type_name).join(','), '',
          String(v.vod_area || ''), cat, pic, String(v.vod_remarks || ''),
          srcName, ts, hits, 1, eps];
}

/** 合并同名条目：补空缺字段，更新时间取最近的，收录源数累加（热度就靠它） */
function mergeInto(dst, src) {
  if (!dst[3] && src[3]) dst[3] = src[3];
  if (src[2]) {
    // 两个源标的题材取并集（最多 3 个）：一个源写「犯罪」，另一个写「犯罪,悬疑」
    if (!dst[2]) dst[2] = src[2];
    else if (dst[2] !== src[2]) {
      var uniq = [];
      (dst[2] + ',' + src[2]).split(',').forEach(function(g) {
        if (g && uniq.indexOf(g) < 0 && uniq.length < 3) uniq.push(g);
      });
      dst[2] = uniq.join(',');
    }
  }
  if (!dst[6] && src[6]) dst[6] = src[6];
  if ((src[9] || 0) > (dst[9] || 0)) dst[9] = src[9];
  if ((src[10] || 0) > (dst[10] || 0)) dst[10] = src[10];
  dst[11] = (dst[11] || 1) + (src[11] || 0);
  return dst;
}

/* 五大类在各站的叫法差别很大（电影片/电影、连续剧/电视剧、大陆剧/国产剧…），
   这里用正则从 class 树里挑子分类，靠它把分类页定向翻出来。
   必须优先挑叶子分类（type_pid != 0）：顶级分类在量子、新浪上只挂 1 条片，
   直接拿 t=1 翻等于白拉一次。

   每个大类挑多个子分类，比同一子类翻多页划算：同一子类翻 2 页是 40 条最新更新、
   题材高度重复；换成「动作片 + 喜剧片 + 爱情片」各 20 条，数量一样但覆盖面广得多。
   实测每类挑 3 个子分类后，片库从 409 部涨到约 700 部，
   电影 69→145、综艺 47→145。 */
var CAT_PATTERNS = [
  ['movie',   /动作片|剧情片|喜剧片|科幻片|爱情片|战争片|恐怖片|电影/],
  ['tv',      /国产剧|大陆剧|连续剧|电视剧|欧美剧|日韩剧|香港剧|海外剧/],
  ['variety', /综艺|真人秀/],
  ['anime',   /动漫|动画|番剧|漫剧/],
  ['doc',     /纪录|纪实/]
];
var TYPES_PER_CAT = 3;

/** class 树 → [{cat, id, name}]，每个大类最多取 perCat 个子分类 */
function pickTypeIds(classList, perCat) {
  var lim = perCat || TYPES_PER_CAT;
  var all = classList || [];
  var leaves = all.filter(function(c) { return Number(c.type_pid) !== 0; });
  var pool = leaves.length ? leaves : all;
  var out = [], used = {};
  CAT_PATTERNS.forEach(function(p) {
    var got = 0;
    for (var i = 0; i < pool.length; i++) {
      var nm = String(pool[i].type_name || '');
      var id = pool[i].type_id;
      if (!id || used[id]) continue;
      if (p[1].test(nm)) {
        used[id] = 1;
        out.push({ cat: p[0], id: id, name: nm });
        if (++got >= lim) break;
      }
    }
  });
  return out;
}

/* 题材子分类：[分类名关键词, 归到哪个类型]。点进去整页都是同一题材，
   是「奇幻 / 爱情 / 古装 / 犯罪 / 历史 / 科幻」唯一的稳定来源——
   最新列表里九成是都市剧和短剧，这几个题材几乎不出现，光靠 vod_class 只能捞到个位数。
   前项是源站分类名的叫法（玄幻剧、仙侠剧 也归奇幻，武侠剧 归古装），后项是筛选条上的类型。
   顺序按实测缺口排：奇幻 6 部 → 爱情 40 → 古装 43 → 犯罪 44 → 历史 66 → 科幻 114。 */
var THIN_GENRES = [
  ['奇幻', '奇幻'], ['魔幻', '奇幻'], ['玄幻', '奇幻'], ['仙侠', '奇幻'],
  ['爱情', '爱情'], ['言情', '爱情'],
  ['古装', '古装'], ['武侠', '古装'],
  ['犯罪', '犯罪'], ['警匪', '犯罪'],
  ['历史', '历史'], ['战争', '历史'],
  ['科幻', '科幻'],
  ['悬疑', '悬疑'], ['恐怖', '悬疑'], ['惊悚', '悬疑'], ['推理', '悬疑']
];
var GENRE_TYPES_LIMIT = 8;    // pickGenreTypes 默认最多挑几个
var GENRE_TYPE_PAGES = 2;     // 每个题材分类翻几页（同一分类翻页几乎不重复，比换源划算）
var GENRE_PAGE_BUDGET = 30;   // 一轮同步最多花多少个请求在题材页上

/** class 树 → 题材子分类 [{id, name, g}]，g 是归到的类型（分配时按它归组），
    跳过已被 CAT_PATTERNS 选走的 id */
function pickGenreTypes(classList, usedIds, limit) {
  var lim = limit || GENRE_TYPES_LIMIT;
  var all = classList || [];
  var leaves = all.filter(function(c) { return Number(c.type_pid) !== 0; });
  var pool = leaves.length ? leaves : all;
  var out = [], taken = {};
  THIN_GENRES.forEach(function(p) {
    if (out.length >= lim) return;
    var kw = p[0], g = p[1];
    for (var i = 0; i < pool.length; i++) {
      var nm = String(pool[i].type_name || '');
      var id = pool[i].type_id;
      if (!id || taken[id] || (usedIds && usedIds[id])) continue;
      if (/理论|伦理|写真|福利|情色|成人/.test(nm)) continue;
      if (nm.indexOf(kw) < 0) continue;
      taken[id] = 1;
      out.push({ id: id, name: nm, g: g });
      break;
    }
  });
  return out;
}

function loadPoolCache() {
  try {
    var raw = localStorage.getItem(POOL_KEY);
    if (!raw) return;
    var j = JSON.parse(raw);
    if (!j || !Array.isArray(j.items)) return;
    POOL.at = j.at || 0;
    POOL.pages = j.pages || 0;
    POOL.items = j.items.filter(function(r) { return Array.isArray(r) && r[0]; });
    _rowsCache = null;
  } catch (e) { /* 缓存损坏就当没有，重新拉一份 */ }
}

function savePoolCache() {
  try {
    // 注意这里存的是 POOL.at 而不是 Date.now()：中途落盘（partial）时 POOL.at 还是 0，
    // 存成当前时间的话下次启动会把这半份片库当成新鲜缓存，永远补不齐
    localStorage.setItem(POOL_KEY, JSON.stringify(
      { at: POOL.at || 0, pages: POOL.pages, items: POOL.items }));
  } catch (e) { /* 存储满或被禁用：不影响本次使用 */ }
}

/** 首页/搜索/筛选统一从这里取片：动态片库 + 内置精选。
    这里再做一次去重（同一个新片常被 3~4 个源同时收录），
    并且把内置片单的评分补到同名源条目上，「经典高分」和榜单才不会空。 */
function allRows() {
  if (_rowsCache) return _rowsCache;
  var out = [], map = {};
  function put(r) {
    var k = poolKey(r);
    if (map[k]) { mergeInto(map[k], r); return; }
    map[k] = r;
    out.push(r);
  }
  POOL.items.forEach(put);
  DATA.forEach(put);
  _rowsCache = out;
  return out;
}

/** 并发上限执行，单个任务失败不影响其它（免费源站并发太高会被限流）。
    onEach 是可选回调：每完成一个任务就喂一次结果，用来边拉边落盘。 */
function runLimited(tasks, limit, worker, onEach) {
  return new Promise(function(resolve) {
    var out = [], next = 0, active = 0, finished = 0, n = tasks.length;
    if (!n) { resolve(out); return; }
    function pump() {
      while (active < limit && next < n) {
        (function(idx) {
          active++;
          worker(tasks[idx])
            .then(function(r) {
              out[idx] = r;
              if (onEach && r) onEach(r);
            })
            .catch(function() { out[idx] = null; })
            .then(function() {
              active--; finished++;
              if (finished === n) resolve(out); else pump();
            });
        })(next++);
      }
    }
    pump();
  });
}

/**
 * 拉取片库。分两轮：
 *   第一轮 每源 1 个 ?ac=list（不带 t），同时拿到第 1 页和分类树；
 *   第二轮 并行拉「最新列表第 2..pages 页」+「每源每个大类各 1 页」。
 * 第二轮的分类页是关键：最新列表里九成是剧集和短剧，电影/纪录片几乎没有，
 * 而 ?ac=list&t=<子分类ID> 能直接翻到该分类的全库（实测能翻出 2006~2024 的老片），
 * 顺带把「经典老片」这个分区也填满了。
 *
 * @param {number} pages 最新列表每个源拉几页
 * @param {object} opts  {append:true 只往后翻最新列表（「继续同步」用）, srcLimit}
 * @returns {Promise<number>} 新增条数，失败为 -1
 */
function pullPool(pages, opts) {
  opts = opts || {};
  if (POOL.loading) return Promise.resolve(0);
  var srcs = rankedSources().slice(0, opts.srcLimit || 5);
  if (!srcs.length) { POOL.err = '没有可用接口'; return Promise.resolve(-1); }

  POOL.loading = true; POOL.err = '';
  renderSrcBar();
  if (!state.more && !state.q) renderHome();   // 让「同步中」提示立刻出现

  /* 把已拉到的条目并进片库并落盘。partial=true 时不动 POOL.at：
     中途落盘只是为了「下次打开不空」，不代表这一轮同步算完成了，
     时间戳一改 TTL 就会把没拉完的片库当成新鲜缓存，一直补不上。 */
  function finish(collected, newPages, partial) {
    var rows = opts.append ? POOL.items.slice() : [];
    var seen = {}, added = 0;
    rows.forEach(function(r) { seen[poolKey(r)] = r; });
    collected.forEach(function(r) {
      var k = poolKey(r);
      if (seen[k]) { mergeInto(seen[k], r); return; }
      seen[k] = r; rows.push(r); added++;
    });
    POOL.items = rows;
    if (!partial) POOL.at = Date.now();
    if (newPages) POOL.pages = newPages;
    _rowsCache = null;
    savePoolCache();
    if (!partial) POOL.loading = false;
    return added;
  }

  function toRows(list, name, hint) {
    return (list || []).map(function(v) { return adoptRaw(v, name, hint); }).filter(Boolean);
  }

  var job;
  if (opts.append) {
    // 「继续同步」只往后翻最新列表：分类首页第一轮已经拉过，重复拉纯浪费流量
    var from = POOL.pages + 1;
    var more = [];
    srcs.forEach(function(s) {
      for (var pg = from; pg < from + pages; pg++) more.push({ s: s, pg: pg });
    });
    job = runLimited(more, POOL_CONC, function(t) {
      return fetchList(t.s, t.pg).then(function(j) { return toRows(j.list, t.s.name); });
    }).then(function(bs) {
      var flat = [];
      bs.forEach(function(b) { if (b) flat = flat.concat(b); });
      return finish(flat, from + pages - 1);
    });
  } else {
    // 第一轮：每源一次请求，同时拿第 1 页 + 分类树
    var heads = srcs.map(function(s) { return { s: s }; });
    job = runLimited(heads, POOL_CONC, function(t) {
      var t0 = Date.now();
      return fetchList(t.s, 1).then(function(j) {
        // 顺手量一下这个源的响应时间，后面按它决定谁多干谁少干
        var lat = Date.now() - t0;
        return { rows: toRows(j.list, t.s.name), cls: j.class, lat: Math.max(120, lat) };
      });
    }).then(function(hs) {
      var tasks = [];
      /* 分类页按源速分两档：实测量子 0.35 s 一页、极速/百度要 2.2 s 一页。
         全让每个源都翻 3 个子分类的话，慢源一个人要串 13 页 ≈ 28 s，
         整轮同步就被它锁在那里——而它拉回来的多半还是快源已有的同一批片。
         所以：最快的两个源每大类翻 3 个子分类负责铺量，其余每大类只翻 1 个。 */
      var rank = srcs.map(function(s, i) { return { i: i, lat: (hs[i] || {}).lat || 2000 }; });
      rank.sort(function(a, b) { return a.lat - b.lat; });
      var FAST = {};
      rank.slice(0, 2).forEach(function(x) { FAST[x.i] = 1; });

      var genreOf = [];   // 各源的题材分类，攒完统一按题材分配
      srcs.forEach(function(s, i) {
        var h = hs[i] || {};
        for (var pg = 2; pg <= pages; pg++) tasks.push({ s: s, pg: pg });
        // 先取全量（perCat 给个大数），再用它判断哪个大类天生单薄
        var all = pickTypeIds(h.cls, 99);
        var byCat = {}, usedIds = {}, perCat = FAST[i] ? TYPES_PER_CAT : 1;
        all.forEach(function(tp) { (byCat[tp.cat] = byCat[tp.cat] || []).push(tp); });
        Object.keys(byCat).forEach(function(cat) {
          byCat[cat].slice(0, perCat).forEach(function(tp) {
            usedIds[tp.id] = 1;
            tasks.push({ s: s, pg: 1, t: tp.id, hint: tp.name });
          });
        });
        // 冷门大类补页：纪录片这类整站只有 1 个子分类，一页 20 条去重后只剩十几部，
        // 「纪实纪录片」分区就永远是短板，给它同一个分类再翻两页
        Object.keys(byCat).forEach(function(cat) {
          if (byCat[cat].length >= 2) return;
          var only = byCat[cat][byCat[cat].length - 1];
          if (!only) return;
          for (var p2 = 2; p2 <= 3; p2++) {
            tasks.push({ s: s, pg: p2, t: only.id, hint: only.name });
          }
        });
        pickGenreTypes(h.cls, usedIds, 99).forEach(function(tp) {
          genreOf.push({ s: s, id: tp.id, name: tp.name, g: tp.g, lat: h.lat || 2000 });
        });
      });

      /* 题材页按「题材」而不是按「源」分配。按源分配时，某个源的预算一用完，
         排在它后面的奇幻/爱情就一页都拉不到（实测奇幻只剩 6 部）。
         这里反过来：每个题材挑最快的两个「确实有这个分类」的源，各翻 2 页，
         题材之间再按缺口大小排序，保证每个冷门题材都有源头。 */
      var spent = 0, seenG = [];
      THIN_GENRES.forEach(function(p) { if (seenG.indexOf(p[1]) < 0) seenG.push(p[1]); });
      seenG.forEach(function(g) {
        if (spent >= GENRE_PAGE_BUDGET) return;
        var cand = genreOf.filter(function(x) { return x.g === g; });
        cand.sort(function(a, b) { return a.lat - b.lat; });
        cand.slice(0, 2).forEach(function(c) {
          for (var p3 = 1; p3 <= GENRE_TYPE_PAGES && spent < GENRE_PAGE_BUDGET; p3++, spent++) {
            tasks.push({ s: c.s, pg: p3, t: c.id, hint: c.name });
          }
        });
      });

      var got = [];
      hs.forEach(function(h) { if (h && h.rows) got = got.concat(h.rows); });
      var saved = 0;
      console.log('[pool] srcs=' + srcs.length + ' tasks=' + tasks.length
        + ' genre=' + spent + ' head=' + got.length);
      return runLimited(tasks, POOL_CONC, function(t) {
        return fetchList(t.s, t.pg, t.t).then(function(j) {
          return toRows(j.list, t.s.name, t.hint);
        });
      }, function(rows) {
        got = got.concat(rows);
        // 每攒够 200 条落一次盘：一轮同步三四十秒，中途退出别让已经拉到的白拉
        if (got.length - saved >= 200) {
          saved = got.length;
          try { finish(got, null, true); } catch (e) { console.log('[pool] partial save fail ' + e); }
        }
      }).then(function() {
        // 一条都没拉到（断网 / 全部超时）时两个坑：不能更新时间戳，也不能把
        // 已经缓存的片库覆盖成空。保留旧数据并返回 -1，让上层提示「同步失败」
        if (!got.length) {
          POOL.loading = false;
          POOL.err = '接口无响应';
          console.log('[pool] 空结果（断网或全部超时），保留原片库 '
            + POOL.items.length + ' 部');
          return -1;
        }
        var n = finish(got, pages);
        POOL.loading = false;
        console.log('[pool] done raw=' + got.length + ' items=' + POOL.items.length
          + ' added=' + n);
        return n;
      });
    });
  }

  return job.catch(function(e) {
    POOL.loading = false;
    POOL.err = String((e && e.message) || e);
    return -1;
  });
}

/** 一次 ?ac=list 请求，返回 {list, class} */
function fetchList(src, pg, typeId) {
  var url = base(src.url) + '?ac=list';
  if (typeId) url += '&t=' + typeId;
  url += '&pg=' + (pg || 1);
  return __LTV.req(url).then(function(txt) {
    var j = JSON.parse(txt);
    return {
      list: Array.isArray(j.list) ? j.list : [],
      class: Array.isArray(j.class) ? j.class : []
    };
  });
}

/** 拉一轮片库，拉完在不打断用户的前提下重绘首页 */
function refreshPool(manual) {
  if (!CFG.sources.length) return;   // 没有接口时由页面顶部的引导横幅负责说明
  if (POOL.loading) { if (manual) toast('片库正在同步中…'); return; }
  // 分类页本身已经覆盖了最新更新，所以 pages 只控制「额外再翻几页最新」，
  // 默认 1 页即可；手动同步多翻一页，让片库再厚一点
  pullPool(manual ? 2 : 1, { append: false }).then(function(n) {
    if (n < 0) { toast('片库同步失败，内置精选仍可搜索播放'); renderHome(); return; }
    // 用户正在搜索 / 看详情 / 播放 / 翻全库时不要打断
    if (state.q || state.more) return;
    if ($('sheet') && !$('sheet').classList.contains('hidden')) return;
    if ($('player') && $('player').classList.contains('on')) return;
    toast('片库已同步 ' + POOL.items.length + ' 部');
    renderHome();
  });
}

/** 启动：先画缓存/内置片单保证首屏不空，缓存过期再后台补一轮 */
function initPool() {
  loadPoolCache();
  renderHome();
  if (POOL.at && Date.now() - POOL.at < POOL_TTL) return;
  refreshPool(false);
}

/** 榜单：有评分的按评分降序，同分看年份；移动端只放 10 条 */
function rankRows() {
  var rated = allRows().filter(function(r) { return r[3]; });
  rated.sort(function(a, b) {
    var d = (parseFloat(b[3]) || 0) - (parseFloat(a[3]) || 0);
    return d !== 0 ? d : (Number(b[1]) || 0) - (Number(a[1]) || 0);
  });
  return rated.slice(0, 10);
}

function catLabel(cat) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i][1] === cat) return CATS[i][0];
  return '精选';
}
function fmtEta(ts) {
  var d = (Number(ts) || 0) - Date.now();
  if (!d || d <= 0) return '即将';
  var h = d / 3600000;
  return (h >= 1 ? Math.round(h) + ' 小时后' : Math.max(1, Math.round(d / 60000)) + ' 分钟后');
}

/* ---------------------------------------------------------------- 工具 */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function base(u) { return String(u || '').trim().replace(/\/+$/, ''); }
function hue(s) { var h = 0; for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h % 360; }
function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0');
}
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function posterStyle(title) {
  var h = hue(title), h2 = (h + 45) % 360;
  return '--h:' + h + ';--h2:' + h2;
}

/** 地区文案规范化：港澳台是中国的一部分，展示时统一带前缀。
    采集接口返回的 vod_area 经常只写「台湾 / 香港 / 澳门」，直接显示不合规。 */
function normArea(s) {
  var t = String(s == null ? '' : s).trim();
  if (!t) return '';
  if (/^(台湾|台灣)(省|地区)?$/.test(t)) return '中国台湾';
  if (/^香港(特别行政区|地区)?$/.test(t)) return '中国香港';
  if (/^(澳门|澳門)(特别行政区|地区)?$/.test(t)) return '中国澳门';
  return t;
}

/* ---------------------------------------------------------------- 首页 */
/** 版本维度：已完结 / 全N集 / 更新至N集 / 正版 / 预告 / 抢先。
    画质（4K、1080P、蓝光、HD…）是另一个维度，交给 qInfo() 单独出角标，
    这里只负责「这部剧到哪一步了」，避免同一串 remarks 拆出两枚重复角标。 */
/** 版本维度：全N集 / 更新至N集 / 正版 / 预告 / 抢先。
    画质（4K、1080P、蓝光、HD…）是另一个维度，交给 qInfo() 单独出角标，
    这里只负责「这部剧到哪一步了」，避免同一串 remarks 拆出两枚重复角标。
    eps 是接口给的真实总集数：remarks 只写「已完结」时用它补成「全40集」——
    用户明确要求完结也要看到集数，光写「已完结」看不出是 12 集还是 80 集。 */
function verInfo(r, eps) {
  var s = String(r || '').replace(/\s+/g, '');
  var known = (parseInt(eps, 10) || 0) > 1 ? (parseInt(eps, 10) || 0) : 0;
  if (!s) return null;
  if (/已完结|完结|全集|END/i.test(s)) {
    var m0 = /[全共](\d+)集/.exec(s);
    var n = m0 ? +m0[1] : known;
    // 电影也常被标「已完结」，那种 eps=1，不能写成「全1集」
    return { text: n ? '全' + n + '集' : '已完结', kind: 'done' };
  }
  var m = /[全共](\d+)集/.exec(s);
  if (m) return { text: '全' + m[1] + '集', kind: 'done' };
  /* 「更新至第36集」「更新36集」「更新至36」都归一成「更新至36集」，比原串短一半。
     集数限定 1~4 位且后面必须紧跟「集/话/回」或结尾：综艺常写「更新至20261111期」，
     按日期更新，不限制的话会被当成「更新至20261111集」。 */
  m = /更新(?:至|到)?第?(\d{1,4})(?:集|话|回|$)/.exec(s);
  if (m) return { text: '更新至' + (+m[1]) + '集', kind: 'upd' };
  if (/更新中?$/.test(s)) return { text: '更新中', kind: 'upd' };
  if (/更新/.test(s) && /(集|期|话|回)/.test(s)) return { text: '更新中', kind: 'upd' };
  m = /第(\d+)集/.exec(s);
  if (m) return { text: '第' + m[1] + '集', kind: 'upd' };
  if (/预告|花絮|特辑/.test(s)) return { text: '预告', kind: 'pre' };
  if (/正版|独家|VIP/i.test(s)) return { text: '正版', kind: 'vip' };
  /* TC / 枪版 / 抢先说的其实是「这个源有多新」，归画质维度，这里返回 null，
     免得卡片上并排出现两枚一模一样的「TC」。 */
  if (/TC|枪版|抢先|抢鲜|盗摄/i.test(s)) return null;
  /* 剩下的多半只描述了画质（「正片HD」「更新HD中字」），把画质词剥掉再看有没有实质内容 */
  var rest = s.replace(/HD|高清|超清|蓝光|原盘|BluRay|BDRip|BD|4K|2160P?|1080P?|720P?|中文字幕|中字|字幕|国语|粤语|双语|更新/g, '');
  /* 「至」「中」这种一个字的残句是数据脏，不配当角标 */
  if (!rest || rest.length < 2) return null;
  return { text: rest.length > 8 ? rest.slice(0, 8) : rest, kind: 'misc' };
}

/** 画质维度：4K / 1080P / 720P / 蓝光 / HD / 标清 / TC。
    采集站的 vod_remarks 常把画质和版本写在一串里（「更新HD中字」「4K正片」），
    按清晰度从高到低取第一个命中的，单独出一枚蓝色系角标，和版本角标并排显示。 */
function qInfo(r) {
  var s = String(r || '').replace(/\s+/g, '');
  if (!s) return null;
  if (/4K|2160/i.test(s)) return { text: '4K', kind: 'q4k' };
  if (/1080|FHD|超清/i.test(s)) return { text: '1080P', kind: 'q1080' };
  if (/720/i.test(s)) return { text: '720P', kind: 'q720' };
  if (/蓝光|原盘|BluRay|BDRip/i.test(s)) return { text: '蓝光', kind: 'qbd' };
  if (/HD|高清/i.test(s)) return { text: 'HD', kind: 'qhd' };
  if (/标清/i.test(s)) return { text: '标清', kind: 'qsd' };
  if (/TC|枪版|抢先|抢鲜|盗摄/i.test(s)) return { text: 'TC', kind: 'qcam' };
  return null;
}

/** 从 remarks 里抠集数：全40集 / 共24集 / 更新至12集 / 第8集 / 40集。
    「已完结」但没写集数的给 60（长剧居多），这样完结剧排在只更了几集的前面。 */
function epCount(r) {
  var s = String(r || '').replace(/\s+/g, '');
  if (!s) return 0;
  /* 数字限 1~4 位：「更新至20261111期」这种日期不能被当成 2000 万集 */
  var m = /全(\d{1,4})集/.exec(s) || /共(\d{1,4})集/.exec(s)
    || /更新(?:至|到)?第?(\d{1,4})(?:集|话|回|$)/.exec(s)
    || /第(\d{1,4})集/.exec(s)
    /* 末尾这个通配必须要求数字前面不是数字，否则「更新至20220823集」会截出 0823 */
    || /(?:^|[^\d])(\d{1,4})集/.exec(s);
  if (m) return +m[1];
  if (/已完结|完结|全集/.test(s)) return 60;
  return 0;
}

/** 排序用的集数：接口给了真实总集数就直接用（电影就是 1 集，天然排在剧集后面）；
    没给才退回 remarks 里的数字，「已完结」按 60 估。 */
function epOfItem(it) {
  var e = parseInt(it && it.eps, 10) || 0;
  if (e > 0) return e;
  return epCount((it && (it.remarks || it[7])) || '');
}

/** 正版 / 独家 / VIP：搜索结果里要排在最前面 */
function isVip(r) { return /正版|独家|VIP/i.test(String(r || '')); }

function verText(r) {
  var v = verInfo(r);
  return v ? v.text : String(r || '').trim();
}

/** 详情页「来源：量子资源 · 4K · 已完结」用，画质在前、版本在后 */
/** 详情页「来源：量子资源 · 4K · 已完结」用，画质在前、版本在后。
    画质和封面角标保持一致（没写画质时同样兜底 HD），否则用户会看到
    封面上写着 HD、详情里却没有画质，像是两套数据。 */
function badgeText(r, eps) {
  var q = qInfo(r) || { text: 'HD' }, v = verInfo(r, eps), out = [q.text];
  if (v) out.push(v.text);
  return out.join(' · ');
}

/** 类型简写：卡片一行只有 96px，先按常见类型压成两个字，压不下再整条丢掉 */
var GENRE_SHORT = { '剧情片': '剧情', '动作片': '动作', '喜剧片': '喜剧', '爱情片': '爱情',
  '科幻片': '科幻', '恐怖片': '恐怖', '动画片': '动画', '纪录片': '纪录', '战争片': '战争',
  '犯罪片': '犯罪', '悬疑片': '悬疑', '冒险片': '冒险', '奇幻片': '奇幻', '国产剧': '国产',
  '香港剧': '港剧', '台湾剧': '台剧', '欧美剧': '美剧', '海外剧': '海外' };
function shortGenre(g) {
  var s = String(g || '').trim();
  if (!s) return '';
  if (GENRE_SHORT[s]) return GENRE_SHORT[s];
  if (s.length >= 3 && /片$/.test(s)) return s.slice(0, -1);
  return s;
}

/** 按 10px 字号估算文案宽度（中文 1em、ASCII 0.56em、空格 0.25em、间隔号 0.4em） */
function estW(s) {
  var t = 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c === 32) t += 2.5;
    else if (c === 183) t += 4;
    else t += c > 255 ? 10 : 5.6;
  }
  return t;
}

/** 卡片底部「年份 · 地区 · 类型」：三列小卡里只有 96~105px，
    硬塞再用省略号会出现「2026 · 中国大陆 · 国…」这种半个词，看着就是信息被切掉。
    这里按优先级逐级降级（全给 → 去掉类型 → 只留年份），每次都是完整字段。 */
function subLine(year, area, genre, budget) {
  var f = [year, area, genre].filter(Boolean);
  if (!f.length) return '';
  budget = budget || 96;
  for (var n = f.length; n > 0; n--) {
    var s = f.slice(0, n).join(' · ');
    if (n === 1 || estW(s) <= budget) return s;
  }
  return '';
}

/* 三列网格每张卡的真实可用宽度。375dp 和 411dp 的机型差 30px，
   写死一个数字必然在某一端出问题（要么丢字段、要么又被省略号切半），所以实测一次缓存。 */
var _gridBW = 0;
function gridBudget() {
  if (_gridBW) return _gridBW;
  var g = document.querySelector('.grid'), v = $('view');
  var w = g ? g.clientWidth : (v ? v.clientWidth - 28 : 0);   // section 左右各 14px
  if (!w) w = (window.innerWidth || 400) - 28;
  _gridBW = Math.max(70, Math.round((w - 20) / 3) - 18);   // 减两侧 gap 与卡片内边距
  return _gridBW;
}

/** 底行先按估算宽度丢字段，但机型宽度、字体度量都有偏差，估算不可能次次准。
    渲染完再按实测复核一遍：凡是还溢出的，从后往前逐个砍掉「 · 字段」，
    保证卡片上永远是完整词组，不会出现「2026 · 中国大陆 · 国…」这种半个词。 */
function fixSubs(root) {
  var box = root || document;
  var els = box.querySelectorAll('.poster .sub');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.scrollWidth <= el.clientWidth + 1) continue;
    var s = el.textContent || '';
    var k = s.lastIndexOf(' · ');
    while (k > 0) {
      s = s.slice(0, k);
      el.textContent = s;
      if (el.scrollWidth <= el.clientWidth + 1) break;
      k = s.lastIndexOf(' · ');
    }
  }
}

/* 封面加载失败：采集站图床经常抖一下，一次 403 就永久隐藏太浪费。
   失败时先把 img 收起（否则浏览器会画一个破图图标，很难看），再用一个游离的
   Image 对象探活，真的能加载了才把地址换回去，最多试 2 轮。 */
function imgErr(el) {
  var n = +(el.getAttribute('data-r') || 0);
  var base = el.getAttribute('data-o') || el.getAttribute('src') || '';
  try { el.style.display = 'none'; } catch (e) {}
  if (!base || n >= 2) return;
  el.setAttribute('data-r', n + 1);
  el.setAttribute('data-o', base);
  setTimeout(function () {
    var u = base + (base.indexOf('?') < 0 ? '?' : '&') + '_ltv=' + (n + 1);
    var probe = new Image();
    probe.onload = function () {
      try { el.src = u; el.style.display = ''; } catch (e) {}
    };
    probe.src = u;
  }, 600 + n * 900);
}

function posterHtml(it, opts) {
  opts = opts || {};
  var title = it.title || it[0];
  var year = String(it.year || it[1] || '');
  var genre = it.genre || it[2];
  var rating = it.rating || it[3];
  var area = normArea(it.area || it[4]);
  // 动态片库的条目是数组，封面固定放在第 7 位（索引 6）
  var cover = it.cover || it[6] || '';
  var inner = cover
    ? '<img src="' + esc(cover) + '" loading="lazy" decoding="async"'
      + ' referrerpolicy="no-referrer" onerror="imgErr(this)">'
    : '';
  var tags = '';
  // 评分和「2026 NEW」同时出现会撞在一起（右上角角标组还要放画质），年份在底行已经有了
  if (year === '2026' && !rating) tags += '<span class="tag">2026 NEW</span>';
  // 片库第 8 槽就是 remarks；采集站把「版本 + 画质」都写在这一串里
  var rem = it.remarks || it[7] || '';
  if (opts.remarks) rem = opts.remarks;
  /* 第 12 槽是片库同步时存的 vod_total（第 8 槽是来源名，别取错） */
  var ver = verInfo(rem, it.eps || it[12]);
  /* 画质必须显示：remarks 里没写画质（「正片」「第8集」「已完结」）时兜底成 HD。
     这些采集源实际就是 720p/1080p 的 m3u8，标 HD 不算瞎写；有明确写法的
     （4K / 1080P / 蓝光 / TC）一律按真实值显示。 */
  var q = qInfo(rem) || { text: 'HD', kind: 'qhd' };
  /* 画质放在右上角固定位置，不参与底部文字流——「更新至40集」再长也挤不掉它 */
  var corner = '<div class="corner">'
    + (rating ? '<span class="star">★ ' + esc(rating) + '</span>' : '')
    + '<span class="q ' + q.kind + '">' + esc(q.text) + '</span></div>';
  /* 底部角标行只剩版本 + 来源：画质已经上移到角落，这里的宽度全给这两项 */
  var chips = '';
  if (ver) chips += '<span class="ver ' + ver.kind + '">' + esc(ver.text) + '</span>';
  if (opts.source) chips += '<span class="src2">' + esc(opts.source) + '</span>';
  chips = chips ? '<div class="chips">' + chips + '</div>' : '';
  var sub = subLine(year, area, shortGenre(genre), opts.w || gridBudget());
  return '<div class="poster" style="' + posterStyle(title) + '" data-title="' + esc(title) + '"'
    + (opts.detail ? ' data-detail="1"' : '') + '>'
    + '<div class="ph"><b>' + esc(title) + '</b></div>' + inner + tags + corner
    + '<div class="meta">' + chips + '<div class="ttl">' + esc(title) + '</div>'
    + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div></div>';
}

/* ================================================================ 直播
   只在「直播版」里启用：构建时把下面这行的 false 换成 true（build_apk.py --live），
   影视版保持 false，两个 APK 包名不同，可以并存在同一台手机上。

   直播源不写死，全部在线拉取：
     · Guovin/iptv-api 的 gd 分支 output/result.m3u —— 上游每天跑测速，只输出
       当前能用的源，覆盖央视 / 卫视 / 20 多个省级地方台，实测 1600+ 条
     · fanmingming/live 的 index.m3u —— 央视+卫视的稳定 CDN，做补源
     · iptv-org 的 cn.m3u —— 兜底（英文台名，排在最后）
   每个频道保留最多 4 条地址（https 优先、IPv4 优先），一条播不动会自动换下一条，
   走的是播放器原有的 nextAttempt 换路逻辑，不需要另写一套。 */

var LIVE = {
  at: 0,            // 上次成功拉取的时间戳
  chans: [],        // [{n:频道名, g:分组, u:[地址...]}]
  busy: false,
  err: '',
  grp: 'all',
  q: '',
  shown: 150,
  custom: [],       // 用户自己加的直播源（GitHub 被墙时的兜底）
  showSrc: false,   // 「自定义源」面板是否展开
  probed: {},       // 频道名 → {ok:[url], t}，探活结果（持久化，重启免探测）
  favs: [],         // 收藏的频道名（按收藏顺序）
  last: ''          // 上次播放的频道名
};
/* 频道列表 TTL。上游（Guovin 等）每天跑一次测速，所以 3 小时刷一次足够新，
   又不至于频繁耗流量：一次更新约 1~2MB。 */
var LIVE_TTL = 3 * 3600 * 1000;
/* 定时器句柄：定期检查是否该更新，页面在前台时才真的发请求 */
var LIVE_TIMER = 0;
var LIVE_TICK = 20 * 60 * 1000;   // 每 20 分钟检查一次
var LIVE_MAX_URL = 4;             // 每个频道最多留几条备用地址
var LIVE_GROUPS = ['央视', '卫视', '地方', '港澳台', '体育', '电影', '少儿', '纪录', '其它'];

/* 内置高清频道：这些是逐条实测过、当前真的能出画面的 4K 流。
   公开聚合源里标着「4K」的地址绝大多数已经失效（实测抽样：某源的 33 条
   4K/8K 记录里 0 条可用），所以能用的这几条直接写进来当兜底，
   免得用户翻遍列表也找不到一个高清台。
   注意：单条地址会过期，上游换地址后这里也要跟着更新（改完重新构建即可）。 */
var LIVE_HD_BUILTIN = [
  /* g 是分组，显式写死而不是靠名字猜：频道名里没有「卫视」「频道」这类字样时，
     自动识别会把「河北4K」归到「其它」，用户在卫视分类下就找不到它了。 */

/* 内置源。做成「多源 + 轮换」而不是只认一个：

     ② 各源频道构成不同（有的偏央视，有的偏地方，有的高清多），合并起来更全；
     ③ 每次更新从不同起点开始，避免永远打同一个源、把冷门源永远饿死。
   实测可用（2026-11）：Guovin 1616 条、iptv-org 512 条、suxuang 1210 条、

var LIVE_SRC = [

];
/* 轮换起点：每次更新从 LIVE_SRC 的不同下标开始，让每个源都有机会被优先尝试
   （主源还是最主要的，所以起点只在 0~2 之间轮，不会让冷门源抢在前面拖慢速度） */
var LIVE_ROT = 0;

function liveStoreKey() { return 'ltv_live_v1'; }

/** 实际要打的源：用户自定义的排前面（他能填进来，通常是自己确认过能用的），
    其余按轮换起点重排，保证长期下来每个源都被优先尝试过。 */
function liveSources() {
  var out = [], seen = {};
  var rot = LIVE_ROT % Math.max(1, Math.min(3, LIVE_SRC.length));
  var builtin = LIVE_SRC.slice(rot).concat(LIVE_SRC.slice(0, rot));

}

/* ---------------- 探活结果持久化 ----------------
   之前只存在内存里，切到别的 tab 或重启 APP 就没了，每次点同一个台都要重新
   探活 4 个地址（约 6 秒）。现在写进 localStorage：
     · 结构 { 频道名: {ok:[可用地址], t:时间戳} }
     · 只存「至少 1 个可用源」的结论：全死的结论不存，下次还得重新试
       （源会自己恢复，把「当前全死」记死反而害了自己）
     · TTL 30 分钟：比内存版（2 分钟）长，因为探活一次要 6 秒；
       频道列表更新的那一刻会整体清空（地址可能全变了，旧结论没有意义）
     · 只保留最近 300 个频道，避免 localStorage 膨胀 */
var LIVE_PROBE_KEY = 'ltv_live_probe_v1';
var LIVE_PROBE_TTL = 30 * 60 * 1000;

function liveProbeLoad() {
  try {
    var o = JSON.parse(localStorage.getItem(LIVE_PROBE_KEY) || '{}') || {};
    var now = Date.now(), keep = {}, n = 0;
    /* 读的时候就把过期项丢掉，避免越积越多 */
    Object.keys(o).forEach(function(k) {
      var v = o[k];
      if (!v || !v.ok || !v.ok.length) return;
      if (now - (v.t || 0) > LIVE_PROBE_TTL) return;
      if (n++ >= 300) return;
      keep[k] = v;
    });
    LIVE.probed = keep;
    return Object.keys(keep).length;
  } catch (e) { LIVE.probed = {}; return 0; }
}

function liveProbeSave() {
  try {
    var now = Date.now(), keep = {};
    var keys = Object.keys(LIVE.probed || {});
    /* 新的优先：按时间倒序取前 300 个 */
    keys.sort(function(a, b) { return (LIVE.probed[b].t || 0) - (LIVE.probed[a].t || 0); });
    keys.slice(0, 300).forEach(function(k) {
      var v = LIVE.probed[k];
      if (!v || !v.ok || !v.ok.length) return;
      if (now - (v.t || 0) > LIVE_PROBE_TTL) return;
      keep[k] = { ok: v.ok, t: v.t };
    });
    localStorage.setItem(LIVE_PROBE_KEY, JSON.stringify(keep));
  } catch (e) {}
}

/** 频道列表更新后清掉旧探活结论：地址可能整批换掉，留着会指向失效链接 */
function liveProbeClear() {
  LIVE.probed = {};
  try { localStorage.removeItem(LIVE_PROBE_KEY); } catch (e) {}
}

/** 分组归一：上游用 emoji 前缀（📺央视频道 / ☘️浙江频道 / 🌊港·澳·台） */
function liveGroupOf(g, name) {
  var s = String(g || '') + ' ' + String(name || '');
  if (/央视|CCTV|中央|CGTN|CETV/.test(s)) return '央视';
  if (/卫视/.test(s)) return '卫视';
  if (/港澳台|港·澳·台|香港|澳门|澳門|台湾|台灣|凤凰|翡翠|TVB|澳视/.test(s)) return '港澳台';
  if (/体育|赛事/.test(s)) return '体育';
  if (/电影|影院|剧场/.test(s)) return '电影';
  if (/少儿|动画|卡酷|优漫|卡通/.test(s)) return '少儿';
  if (/纪录|纪实|探索/.test(s)) return '纪录';
  if (/频道/.test(String(g || ''))) return '地方';
  /* 兜底：名称里带省市名的当地方台（聚合源常有「河北4K」「苏州4K」这种没写「卫视」的） */
  if (/北京|上海|天津|重庆|河北|山西|辽宁|吉林|黑龙江|江苏|浙江|安徽|福建|江西|山东|河南|湖北|湖南|广东|广西|海南|四川|贵州|云南|陕西|甘肃|青海|内蒙|宁夏|新疆|西藏|苏州|南京|杭州|武汉|成都|西安|广州|深圳/.test(s)) return '地方';
  return '其它';
}

/** 频道名清洗：去掉「(1080p)」「[Geo-blocked]」这类后缀和零宽字符 */
function liveNormName(n) {
  var s = String(n || '').replace(/[\u200b-\u200f\ufeff]/g, '').trim();
  s = s.replace(/\s*\((1080p|720p|480p|4K|1080i|720i)\)\s*$/i, '')
       .replace(/\s*\[(geo-blocked|not 24\/7|offline)\]\s*$/i, '').trim();
  /* 两个源对央视频道的写法不同：一个写 CCTV-1，另一个写 CCTV-1综合。
     不归一的话同一套台会变成两份（CCTV-1 和 CCTV-1综合 各占一格）。 */
  s = s.replace(/^(CCTV[-\s]?\d{1,2}\+?)[\u4e00-\u9fa5].*$/i, '$1');
  return s;
}

/** 从频道名识别画质，返回 {k: 排序权重, tag: 徽标文字}。
    识别依据只有频道名 —— 公开源不会为每条地址给分辨率字段（实测）。
    用户要求「画质好的排序靠前」，所以 8K/4K 给最高权重。
    注意顺序：先判 8K 再判 4K，否则「8K」会被「K」类规则吃掉。 */
function liveQuality(name) {
  var s = String(name || '');
  if (/8K|4320P/i.test(s)) return { k: 8, tag: '8K' };
  if (/4K|UHD|2160P/i.test(s)) return { k: 4, tag: '4K' };
  /* 「高清」「HD」「1080」算一档；「超清」在行业里通常指 1080i，同档 */
  if (/高清|超清|HD|1080P?/i.test(s)) return { k: 2, tag: '高清' };
  return { k: 1, tag: '' };
}

/** 排序权重：央视频道按台号排（CCTV-1 在最前），其余按名称 */
function liveSortKey(n) {
  var m = /^CCTV[-\s]?(\d{1,2})(\+?)/i.exec(String(n || ''));
  if (m) return '0' + ('00' + m[1]).slice(-3) + m[2];
  if (/^CGTN/i.test(n)) return '0800';
  if (/^CCTV/i.test(n)) return '0900';
  return '1';
}

function liveParseM3U(text) {
  var out = [], lines = String(text).split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i].trim();
    if (l.indexOf('#EXTINF') !== 0) continue;
    var g = (/group-title="([^"]*)"/i.exec(l) || [])[1] || '';
    var n = l.slice(l.lastIndexOf(',') + 1).trim();
    var u = (lines[i + 1] || '').trim();
    if (!/^https?:/i.test(u)) continue;
    out.push({ n: n, g: g, u: u });
  }
  return out;
}

/** 兼容「频道名,http://...」这种中文 txt 源 */
function liveParseTxt(text) {
  var out = [], lines = String(text).split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i].trim();
    if (!l || l.charAt(0) === '#') continue;
    var m = /^(.+?)[,，]\s*(https?:\/\/\S+)$/.exec(l);
    if (!m) continue;
    out.push({ n: m[1], g: '', u: m[2] });
  }
  return out;
}

/** 地址优先级：https 在前，IPv4 在前（有些手机没 IPv6，v6 地址只会白等） */
function liveUrlRank(u) {
  var r = 0;
  if (u.indexOf('https://') !== 0) r += 2;
  if (u.indexOf('://[') >= 0) r += 1;
  if (!/\.m3u8(\?|$)/i.test(u)) r += 0.5;
  return r;
}

/** 多条源合并：同名频道归一条，地址去重后留最靠前的几条 */
function liveMerge(rows) {
  var map = {}, order = [];
  /* 内置高清频道先入表：同名片（如聚合源里也有「江苏卫视4K」但地址已失效）
     合并时地址会累加，内置那条排在地址列表最前，探活时优先命中。 */
  (LIVE_HD_BUILTIN || []).forEach(function(r) {
    var k = r.n.toLowerCase();
    var q = liveQuality(r.n);
    var c = map[k];
    if (!c) {
      /* 同名多条地址（如东方卫视4K 的 http/https 双份）要合并，不能后条覆盖前条 */
      c = map[k] = { n: r.n, g: r.g || liveGroupOf('', r.n), u: [], q: q.k, t: q.tag };
      order.push(k);
    }
    if (c.u.indexOf(r.u) < 0) c.u.push(r.u);
  });
  (rows || []).forEach(function(r) {
    var n = liveNormName(r.n);
    if (!n || n.length > 26) return;
    if (/^\d{4}[-\/.]\d{1,2}/.test(n)) return;          // 「2026-08-27 14:06」是更新时间，不是频道
    if (/测试|更新|公告|sample|test/i.test(n)) return;
    var k = n.toLowerCase();
    var c = map[k];
    if (!c) {
      var qq = liveQuality(n);
      c = map[k] = { n: n, g: liveGroupOf(r.g, n), u: [], q: qq.k, t: qq.tag };
      order.push(k);
    }
    /* 同一频道名在不同源里可能一个有「4K」后缀一个没有（「苏州4k」vs「苏州」）。
       取见过的最高画质，避免被先到的低画质条目定死。 */
    var q2 = liveQuality(r.n);
    if (q2.k > c.q) { c.q = q2.k; c.t = q2.tag; }
    if (c.u.indexOf(r.u) < 0) c.u.push(r.u);
  });
  return order.map(function(k) {
    var c = map[k];
    c.u.sort(function(a, b) { return liveUrlRank(a) - liveUrlRank(b); });
    c.u = c.u.slice(0, LIVE_MAX_URL);
    return c;
  }).sort(function(a, b) {
    /* 第一优先级：画质（8K → 4K → 高清 → 普通）。
       用户明确要求「画质好的排序靠前」，所以它排在分组之前。 */
    if ((a.q || 1) !== (b.q || 1)) return (b.q || 1) - (a.q || 1);
    var ia = LIVE_GROUPS.indexOf(a.g), ib = LIVE_GROUPS.indexOf(b.g);
    if (ia !== ib) return ia - ib;
    /* 同画质同分组内，央视频道按台号排（CCTV-1 在最前） */
    var ka = liveSortKey(a.n), kb = liveSortKey(b.n);
    if (ka !== kb) return ka < kb ? -1 : 1;
    return a.n.localeCompare(b.n, 'zh-CN');
  });
}

function liveFetchOne(url) {
  return __LTV.req(url, 25000).then(function(t) {
    var rows = /#EXTM3U/i.test(t) ? liveParseM3U(t) : liveParseTxt(t);
    console.log('[live] ' + String(url).slice(0, 56) + ' → ' + rows.length
      + ' 条 / ' + Math.round(String(t).length / 1024) + 'KB');
    return rows;
  });
}

/** 逐个源尝试，凑够 300 条就停（主源一次一般就够） */
function liveRefresh(manual) {
  if (LIVE.busy) return;
  if (!HAS_NATIVE) { LIVE.err = '浏览器预览模式无法拉取直播源'; return; }
  LIVE.busy = true;
  LIVE.err = '';
  LIVE.lastTry = Date.now();
  if (state.cat === 'live') livePaint();
  var rows = [], i = 0;

  function done() {
    if (rows.length >= 20) {
      LIVE.chans = liveMerge(rows);
      LIVE.at = Date.now();
      LIVE.shown = 150;
      liveCacheSave();
      /* 频道地址整批换过，旧的「这个频道哪条地址能用」不再可信 */
      liveProbeClear();
      LIVE.deadCount = {};      // 换了新列表，失败计数清零重新计
      LIVE.err = '';
      if (manual) toast('直播源已更新：' + LIVE.chans.length + ' 个频道');
      console.log('[live] 合并后 ' + LIVE.chans.length + ' 个频道');
    } else {
      LIVE.err = '直播源拉取失败，检查网络后重试';
      toast(LIVE.chans.length ? '更新失败，继续用上次的 ' + LIVE.chans.length + ' 个频道'
                              : '直播源拉取失败，检查网络后重试');
    }
    LIVE.busy = false;
    if (state.cat === 'live') { livePaint(); renderCats(); }
  }

  var srcs = liveSources();
  function step() {
    if (i >= srcs.length || rows.length >= 300) return done();
    var u = srcs[i++];
    return liveFetchOne(u).then(function(r) {
      rows = rows.concat(r);
      return step();
    }, function(e) {
      console.log('[live] 源失败 ' + String(u).slice(0, 56) + ' : ' + (e && e.message));
      return step();
    });
  }
  step();
}

function liveAgo(ts) {
  if (!ts) return '未更新';
  var d = Date.now() - ts;
  if (d < 60000) return '刚刚更新';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前更新';
  if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前更新';
  return Math.floor(d / 86400000) + ' 天前更新';
}

function liveFiltered() {
  var q = String(LIVE.q || '').trim().toLowerCase();
  var favOrder = LIVE.favs || [];
  return LIVE.chans.filter(function(c) {
    if (LIVE.grp === 'fav') {
      if (favOrder.indexOf(c.n) < 0) return false;
    } else if (LIVE.grp === 'hd') {
      if ((c.q || 1) < 4) return false;
    } else if (LIVE.grp !== 'all' && c.g !== LIVE.grp) {
      return false;
    }
    if (q && String(c.n).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a, b) {
    /* 收藏分组按收藏顺序（新的在前），其它分组保持原有排序 */
    if (LIVE.grp === 'fav') return favOrder.indexOf(a.n) - favOrder.indexOf(b.n);
    return 0;
  });
}

function liveTile(c) {
  var h = hue(c.n);
  var fav = liveIsFav(c.n);
  /* 星标是独立按钮：点在星上只收藏、不换台；点格子其它地方才播放 */
  /* 画质徽标：4K 金、8K 更亮，高清普通不带（避免每格都挂个标签反而看不清） */
  var qtag = '';
  if (c.t) {
    qtag = '<u class="lt-q ' + (c.q >= 8 ? 'q8' : 'q4') + '">' + esc(c.t) + '</u>';
  }
  return '<div class="lt-wrap">'
    + '<button class="lt' + (fav ? ' fav' : '') + '" data-live="' + esc(c.n) + '"'
    + ' style="--h:' + h + ';--h2:' + ((h + 46) % 360) + '">'
    + '<b>' + esc(c.n) + '</b>' + qtag
    + (c.u.length > 1 ? '<i>' + c.u.length + '</i>' : '') + '</button>'
    + '<button class="lt-star' + (fav ? ' on' : '') + '" data-live-fav="' + esc(c.n) + '"'
    + ' title="' + (fav ? '取消收藏' : '收藏') + '">' + (fav ? '★' : '☆') + '</button>'
    + '</div>';
}

function liveRecent() {

function liveRecentAdd(name) {
