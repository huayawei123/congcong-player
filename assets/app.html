/* ------------------------------------------------ 快进 / 卡顿的自愈
   WebView 原生 HLS 在跨段 seek 后偶发「不继续拉流」，表现是画面停在某一帧、
   时间不走也不报错。这里在 seeked 后探一次，真卡住了就重新 play()，
   MSE 路径再补一次 startLoad()（它会从当前位置重新拉分片）。 */
/** 目标时间附近是否已经有缓冲：有就说明分片正在下来，别打断 */
function bufferedNear(v, t) {
  try {
    for (var i = 0; i < v.buffered.length; i++) {
      if (t >= v.buffered.start(i) - 0.3 && t <= v.buffered.end(i) + 0.3) return true;
    }
  } catch (e) {}
  return false;
}

$('v').addEventListener('seeking', function(){ PL.wasPlaying = !this.paused; });
$('v').addEventListener('seeked', function(){
  var v = this;
  /* 起播时定位 / 续播也会触发 seeked，那不是快进，别让自愈逻辑去打断首缓 */
  if (!PL.userSeek) return;
  PL.userSeek = 0;
  clearTimeout(PL.seekTimer); clearTimeout(PL.seekTimer2);
  /* 落点已经在缓冲范围内 = 浏览器瞬间跳过去，什么都不用做 */
  if (bufferedNear(v, v.currentTime)) return;
  PL.seekTimer = setTimeout(function(){
    if (v.readyState >= 3 || v.paused) return;
    setStatus('正在跳转…');
    try { v.play(); } catch (e) {}          // 先软恢复，别打断正常缓冲
    PL.seekTimer2 = setTimeout(function(){
      if (v.readyState >= 3 || v.paused) { setStatus(''); return; }
      /* 关键：落点还在下分片就别 abort 重来。
         慢网下 startLoad() 会把正在下载的分片掐掉重下，「自愈」反而更慢——
         这是快进后长时间卡住的主要原因，只在真没数据时才重拉。 */
      if (bufferedNear(v, v.currentTime)) {
        setStatus('正在缓冲，请稍候…');
        return;
      }
      console.log('[pl] seek 后无落点缓冲 -> 重新拉流');
      setStatus('');
      if (PL.hls) { try { PL.hls.startLoad(); } catch (e) {} }
    }, 4000);
  }, 600);
});
$('v').addEventListener('stalled', function(){
  var v = this;
  if (v.paused || !PL.everPlayed) return;   // 起播阶段的 stalled 交给 startTimer 看门狗
  clearTimeout(PL.stallTimer);
  PL.stallTimer = setTimeout(function(){
    if (v.paused || v.readyState >= 3) return;
    if (bufferedNear(v, v.currentTime)) return;   // 有数据在下来，别插队
    console.log('[pl] stalled 超过 5s 且无落点缓冲，nudge');
    try { v.play(); } catch (e) {}
    if (PL.hls) { try { PL.hls.startLoad(); } catch (e) {} }
  }, 5000);
});
/* 单击：开/关控制条。双击：暂停/继续。
   两种动作共用同一个 click 事件，所以单击要延迟 260ms 再执行 ——
   这段时间内如果来了第二下，就判定为双击，撤销单击动作。
   260ms 是移动端双击判定的常用阈值（Android 系统默认 300ms）。 */
var TAP = { t: 0, timer: 0 };

$('player').addEventListener('click', function(e) {
  if (Date.now() < PL.skipClick) return;   // 刚滑动过，别把控制条顺手开关一次
  if (e.target.closest('button') || e.target.closest('.p-eps')) return;

  /* 视频区（含遮罩层背景）上的点击才算「点屏幕」，
     控制条上的按钮已经在上面被排除了 */
  var now = Date.now();
  var isDouble = (now - TAP.t) < 260;
  TAP.t = now;

  if (isDouble) {
    /* 双击：取消挂起的单击，执行暂停/继续 */
    clearTimeout(TAP.timer);
    TAP.timer = 0;
    TAP.t = 0;                 // 三击不触发第二次暂停
    togglePlay();
    return;
  }

  /* 单击：延迟执行，等着看有没有第二下 */
  clearTimeout(TAP.timer);
  TAP.timer = setTimeout(function() {
    TAP.timer = 0;
    if ($('pEps').classList.contains('on')) {
      $('pEps').classList.remove('on');
      showControls();
      return;
    }
    if ($('pMask').classList.contains('hide')) showControls();
    else $('pMask').classList.add('hide');
  }, 260);
});

/** 给 #player 打 .narrow 标记（窄屏/竖屏专用布局）。
    为什么不只靠 CSS 媒体查询：部分 WebView 在「横屏转竖屏」后不刷新
    @media (orientation:portrait)，竖屏仍套横屏的 nowrap 布局，
    按钮就会溢出屏幕、看起来全挤到右边。这里直接读真实宽高比，绕开该问题。 */
function syncPlayerLayout() {
  var p = $('player');
  if (!p) return;
  var narrow = window.innerWidth <= 600 || window.innerWidth < window.innerHeight;
  p.classList.toggle('narrow', narrow);
}

window.addEventListener('resize', function() { syncPlayerLayout(); });
window.addEventListener('orientationchange', function() {
  /* 旋转后 WebView 的尺寸更新略有延迟，稍等再量一次 */
  syncPlayerLayout();
  setTimeout(syncPlayerLayout, 120);
  setTimeout(syncPlayerLayout, 400);
});
syncPlayerLayout();

/* ---------------------------------------------------------------- 弹幕
   数据来源是「本地」：采集源不提供弹幕（实测各站 index.xml 全部 404），
   弹弹play 这类服务要 AppId + 签名才能调。所以先做能闭环的版本：
   自己发、存在手机上、按剧集+时间点回放。
   数据结构只用 {t 秒, m 文本}，将来接在线弹幕源可以直接往同一个 list 里合。 */
var DM = {
  on: true,
  list: [],
  KEY_ON: 'dm_on',

  key: function () { return 'dm::' + (PL.title || '') + '::' + PL.ei; },

  loadOn: function () {
    try { this.on = localStorage.getItem(this.KEY_ON) !== '0'; } catch (e) { this.on = true; }
  },

  setOn: function (v) {
    this.on = !!v;
    try { localStorage.setItem(this.KEY_ON, this.on ? '1' : '0'); } catch (e) {}
    var pl = $('player');
    if (pl) pl.classList.toggle('dmon', this.on);
    var b = $('pDmTog');
    if (b) b.classList.toggle('on', this.on);
    if (!this.on) this.clear();
  },

  load: function () {
    var raw = '';
    try { raw = localStorage.getItem(this.key()) || ''; } catch (e) {}
    var arr = [];
    try { arr = JSON.parse(raw) || []; } catch (e) { arr = []; }
    this.list = arr.map(function (d) {
      return { t: +d.t || 0, m: String(d.m || ''), c: d.c || '', done: 0 };
    });
    this.clear();
  },

  save: function () {
    try {
      /* 只落盘「用户自己发的」，在线弹幕（on=1）不存。
         实测 B 站一集能拉到 3600 条，落盘既会把 localStorage 撑爆，
         又会被 500 条上限截掉开头那一段 —— 而在线弹幕随时能重拉，
         没必要存。 */
      var out = this.list
        .filter(function (d) { return !d.on; })
        .map(function (d) { return { t: d.t, m: d.m, c: d.c }; });
      /* 上限 500 条：localStorage 只有几 MB，写满后是静默失败 */
      localStorage.setItem(this.key(), JSON.stringify(out.slice(-500)));
    } catch (e) {}
  },

  clear: function () {
    var box = $('pDm');
    if (box) box.innerHTML = '';
  },

  /** 发一条：立刻显示 + 落盘 */
  add: function (text) {
    text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!text) return false;
    var v = $('v');
    var t = (v && v.currentTime) || 0;
    var item = { t: Math.round(t * 10) / 10, m: text, c: '', done: 1 };
    this.list.push(item);
    this.save();
    if (this.on) this.show(item);
    return true;
  },

  /** 屏幕上滚一条 */
  show: function (item) {
    var box = $('pDm');
    if (!box) return;
    /* 同屏上限：低端机开几十条同时跑动画会掉帧 */
    if (box.childElementCount > 40) box.removeChild(box.firstChild);
    var el = document.createElement('i');
    el.textContent = item.m;
    /* 6%~58% 高度：避开底部控制条，也别压在画面正中字幕上 */
    el.style.top = (6 + Math.random() * 52).toFixed(1) + '%';
    var dur = 8;
    try { dur = Math.max(6, Math.min(11, window.innerWidth / 55)); } catch (e) {}
    el.style.animationDuration = dur + 's';
    box.appendChild(el);
    var kill = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    el.addEventListener('animationend', kill);
    setTimeout(kill, (dur + 2) * 1000);   // 兜底：切后台时 animationend 可能不来
  },

  /** 跟着播放进度触发（在 timeupdate 里调） */
  tick: function (cur, prev) {
    if (!this.on || PL.live) return;
    /* 跨度太大说明是拖动进度/切集，不补发，否则一屏糊满 */
    if (!(cur - prev > 0) || cur - prev > 1.2) return;
    for (var i = 0; i < this.list.length; i++) {
      var d = this.list[i];
      if (d.done) continue;
      if (d.t > prev - 0.05 && d.t <= cur + 0.08) { d.done = 1; this.show(d); }
    }
  }
};
DM.loadOn();

/* ------------------------------------------------------- 在线弹幕（B 站）
   走的是完全公开的接口，不需要登录、不需要任何 AppId：
     · 剧集列表  https://api.bilibili.com/pgc/view/web/season?season_id=xxx
                 返回每一集的 cid（实测 200，26 集全部带 cid）
     · 弹幕      https://api.bilibili.com/x/v1/dm/list.so?oid={cid}
                 返回 raw deflate 压缩的 XML（实测 200 / 48KB → 解压 122KB）
   B 站的**搜索**接口有 IP 级风控（连续请求就 412），所以这里不做自动搜索，
   改为「用户粘贴一次番剧链接」，之后按集数自动匹配，一次绑定长期有效。
   这样既避开了风控，匹配准确率也是 100%（是用户自己选的条目）。 */
var BILI = {
  KEY: 'bili_bind',

  binds: function () {
    try { return JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; }
    catch (e) { return {}; }
  },
  get: function (title) { return title ? (this.binds()[title] || null) : null; },
  set: function (title, data) {
    if (!title) return;
    var m = this.binds();
    if (data) m[title] = data; else delete m[title];
    try { localStorage.setItem(this.KEY, JSON.stringify(m)); } catch (e) {}
  },

  /** 解析用户粘贴的内容：链接 / ss123 / ep123 / 纯数字 */
  parse: function (input) {
    var s = String(input || '').trim();
    if (!s) return null;
    var m = /(?:\/|^)(ss\d+)/i.exec(s);
    if (m) return { type: 'ss', id: m[1].replace(/\D/g, '') };
    m = /(?:\/|^)(ep\d+)/i.exec(s);
    if (m) return { type: 'ep', id: m[1].replace(/\D/g, '') };
    m = /season_?id=(\d+)/i.exec(s);
    if (m) return { type: 'ss', id: m[1] };
    m = /ep_?id=(\d+)/i.exec(s);
    if (m) return { type: 'ep', id: m[1] };
    m = /\/bv([0-9a-z]+)/i.exec(s);                 // 普通投稿：BV 号
    if (m) return { type: 'bv', id: 'BV' + m[1] };
    if (/^BV[0-9A-Za-z]+$/i.test(s)) return { type: 'bv', id: s };
    if (/^\d+$/.test(s)) return { type: 'ss', id: s };
    return null;
  },

  /** 取剧集列表 + 每集 cid */
  season: async function (id, type) {
    if (type === 'bv') {
      /* 普通投稿（非番剧）：pagelist 直接给 cid */
      var pt = await __LTV.req('https://api.bilibili.com/x/player/pagelist?bvid=' + encodeURIComponent(id), 12000);
      var pd = JSON.parse(pt);
      if (pd.code !== 0) throw new Error(pd.message || ('code ' + pd.code));
      var arr = (pd.data || []).map(function (e) {
        return { cid: e.cid, title: e.part || ('P' + e.page) };
      });
      return { title: id, episodes: arr };
    }
    var q = (type === 'ep') ? ('ep_id=' + id) : ('season_id=' + id);
    var txt = await __LTV.req('https://api.bilibili.com/pgc/view/web/season?' + q, 12000);
    var d = JSON.parse(txt);
    if (d.code !== 0) throw new Error(d.message || ('code ' + d.code));
    var r = d.result || {};
    var eps = (r.episodes || []).map(function (e) {
      return { cid: e.cid, title: String(e.title || '') };
    });
    if (!eps.length) throw new Error('该条目没有可分集的剧集');
    return { title: r.title || '', episodes: eps };
  },

  /** 拉一集弹幕（原生层已把 deflate 解开，这里直接拿 XML） */
  danmaku: async function (cid) {
    var xml = await __LTV.reqD('https://api.bilibili.com/x/v1/dm/list.so?oid=' + cid, 12000);
    return this.parseXml(xml);
  },

  /** 解析 B 站弹幕 XML：<d p="时间,模式,字号,颜色,时间戳,池,用户,行号">文本</d> */
  parseXml: function (xml) {
    var out = [], m;
    var re = /<d\s+p="([^"]*)"[^>]*>([\s\S]*?)<\/d>/g;
    while ((m = re.exec(String(xml || '')))) {
      var parts = m[1].split(',');
      var t = parseFloat(parts[0]);
      if (!isFinite(t) || t < 0) continue;
      var txt = m[2]
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&')
        .replace(/\s+/g, ' ').trim();
      if (!txt) continue;
      out.push({ t: Math.round(t * 10) / 10, m: txt.slice(0, 60) });
    }
    /* B 站返回的 XML 不是按时间排的（实测 1200 条里前 50 条就已经乱序）。
       这里统一排好，下游（合并、按时间触发）才能假设「按时间升序」这个前提。 */
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  },

  /** 打开剧集 / 切集时自动加载（前提是这部剧已绑定） */
  auto: async function () {
    if (PL.live || !PL.title) return;
    var b = this.get(PL.title);
    if (!b || !b.cid || !b.cid[PL.ei]) return;
    /* 用内存标记而不是 localStorage：在线弹幕不落盘，每次播放该集时拉一次，
       同一集切走再切回来则不重复请求。 */
    if (PL.biliDone === PL.title + '::' + PL.ei) return;
    PL.biliDone = PL.title + '::' + PL.ei;
    try {
      var list = await this.danmaku(b.cid[PL.ei]);
      if (!list.length) return;
      var n = DDP.merge(list);         // 复用 DDP.merge：去重 + 排序
      if (n) toast('已载入 ' + n + ' 条 B 站弹幕');
    } catch (e) {
      PL.biliDone = '';                // 失败允许下次重试
      console.log('[bili] ' + (e && e.message));
    }
  },

  /** 绑定：解析 → 拉剧集 → 存 cid 数组 → 立即加载当前集 */
  bindAndLoad: async function (input) {
    var p = this.parse(input);
    if (!p) throw new Error('看不懂这个链接，请粘贴番剧页地址或 ss/ep 编号');
    var info = await this.season(p.id, p.type);
    if (!PL.title) throw new Error('请先打开一部剧再绑定');
    this.set(PL.title, {
      src: p.type + p.id,
      biliTitle: info.title,
      total: info.episodes.length,
      cid: info.episodes.map(function (e) { return e.cid; })
    });
    var cur = info.episodes[PL.ei];
    if (!cur) throw new Error('B 站该条目只有 ' + info.episodes.length + ' 集，当前是第 ' + (PL.ei + 1) + ' 集');
    var list = await this.danmaku(cur.cid);
    var n = DDP.merge(list);
    PL.biliDone = PL.title + '::' + PL.ei;
    return { title: info.title, total: info.episodes.length, added: n, got: list.length };
  }
};

/* ------------------------------------------------------- 在线弹幕（弹弹play）
   为什么只接这一家：
     · 采集源自带的 index.xml 全是 404，没有弹幕数据；
     · B 站接口连续请求即 412（IP 级风控），做进 App 里用户大概率打不开；
     · 弹弹play 就是做弹幕聚合的，接口稳定，但 v2 要求 AppId + 签名。
   AppId / AppSecret 在 dandanplay.com 开放平台免费申请，填进设置即可。
   没填时整套逻辑自动跳过，本地弹幕照常可用。 */
var DDP = {
  KEY_ID: 'ddp_appid',
  KEY_SEC: 'ddp_secret',

  cfg: function () {
    var id = '', sec = '';
    try {
      id = localStorage.getItem(this.KEY_ID) || '';
      sec = localStorage.getItem(this.KEY_SEC) || '';
    } catch (e) {}
    return { id: id, sec: sec };
  },
  setCfg: function (id, sec) {
    try {
      if (id) localStorage.setItem(this.KEY_ID, id);
      else localStorage.removeItem(this.KEY_ID);
      if (sec) localStorage.setItem(this.KEY_SEC, sec);
      else localStorage.removeItem(this.KEY_SEC);
    } catch (e) {}
  },
  ok: function () {
    var c = this.cfg();
    return !!(c.id && c.sec && HAS_NATIVE && Android.ddpSign);
  },

  /** 带签名的 GET。签名交给原生层算（file:// 页面没有 crypto.subtle） */
  get: async function (path, query) {
    var c = this.cfg();
    var ts = String(Math.floor(Date.now() / 1000));
    var sign = Android.ddpSign(c.id, ts, path, c.sec);
    if (!sign) throw new Error('签名失败，请检查 AppId/AppSecret');
    var txt = await __LTV.reqH('https://api.dandanplay.net' + path + (query || ''), {
      'X-AppId': c.id, 'X-Timestamp': ts, 'X-Signature': sign, 'Accept': 'application/json'
    }, 12000);
    var d = JSON.parse(txt);
    if (d && (d.errorCode || d.success === false)) {
      throw new Error(d.errorMessage || ('接口错误 ' + d.errorCode));
    }
    return d;
  },

  /** 剧名清洗：弹弹play 的条目多半不带「第五季」「(2024)」这类后缀 */
  clean: function (t) {
    return String(t || '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/\s*第[一二三四五六七八九十百0-9]+季/g, '')
      .replace(/\s*(全|共)\s*\d+\s*集/g, '')
      .trim();
  },

  /** 拉这一集的弹幕，返回 [{t, m}] */
  fetchEp: async function (title, ei) {
    var name = this.clean(title);
    if (!name) return [];
    var s = await this.get('/api/v2/search/episodes', '?anime=' + encodeURIComponent(name));
    var animes = (s && s.animes) || [];
    if (!animes.length) return [];
    /* 集数够用的候选里，优先标题完全一致的 */
    var pick = null;
    for (var i = 0; i < animes.length; i++) {
      var a = animes[i], eps = a.episodes || [];
      if (eps.length <= ei) continue;
      if (!pick) pick = a;
      if (String(a.animeTitle || '').replace(/\s/g, '') === name.replace(/\s/g, '')) { pick = a; break; }
    }
    if (!pick) return [];
    var ep = (pick.episodes || [])[ei];
    if (!ep || !ep.episodeId) return [];
    var d = await this.get('/api/v2/comment/' + ep.episodeId, '?withRelated=true&chConvert=1');
    var out = [];
    ((d && d.comments) || []).forEach(function (c) {
      var t = parseFloat(String(c.p || '').split(',')[0]);   // p = "秒,模式,颜色,用户"
      var m = String(c.m || '').replace(/\s+/g, ' ').trim();
      if (!m || !isFinite(t) || t < 0) return;
      out.push({ t: Math.round(t * 10) / 10, m: m.slice(0, 60) });
    });
    return out;
  },

  /** 合并进当前集（按 时间+文本 去重），返回新增条数 */
  merge: function (list) {
    var seen = {}, cur = ($('v') && $('v').currentTime) || 0, added = 0;
    DM.list.forEach(function (d) { seen[d.t + '|' + d.m] = 1; });
    list.forEach(function (d) {
      var k = d.t + '|' + d.m;
      if (seen[k]) return;
      seen[k] = 1;
      /* on=1 表示「在线拉来的」，DM.save 时会被排除，不占用本地存储 */
      DM.list.push({ t: d.t, m: d.m, c: '', on: 1, done: d.t <= cur ? 1 : 0 });
      added++;
    });
    if (added) {
      DM.list.sort(function (a, b) { return a.t - b.t; });
      DM.save();
    }
    return added;
  },

  /** 打开播放器 / 切集后自动拉一次；本集拉过就跳过 */
  auto: async function () {
    if (!this.ok() || PL.live || !PL.title) return;
    if (PL.ddpDone === PL.title + '::' + PL.ei) return;
    PL.ddpDone = PL.title + '::' + PL.ei;
    try {
      var list = await this.fetchEp(PL.title, PL.ei);
      if (!list.length) return;
      var n = this.merge(list);
      if (n) toast('已载入 ' + n + ' 条在线弹幕');
    } catch (e) {
      PL.ddpDone = '';                 // 失败允许下次重试
      console.log('[ddp] ' + (e && e.message));
      toast('在线弹幕：' + (e && e.message || '加载失败'));
    }
  },
  mkKey: function () { return 'ddp::' + (PL.title || '') + '::' + PL.ei; },

  /** 手动重新拉取（清掉「已拉过」标记） */
  reload: async function () {
    PL.ddpDone = '';
    await this.auto();
  }
};

/** 暂停 / 继续（双击、以及 pBig 按钮共用） */
function togglePlay() {
  var v = $('v');
  if (!v) return;
  if (v.paused) {
    try { v.play(); } catch (e) {}
    $('pBig').textContent = '❚❚';
  } else {
    try { v.pause(); } catch (e) {}
    $('pBig').textContent = '▶';
  }
  showControls();
  /* 暂停时把控制条留住，用户能看清当前状态；继续播放则按原逻辑自动收起 */
  if (v.paused) {
    clearTimeout(PL.hideTimer);
  } else if (!PL.live) {
    /* 起播时自动收起，避免控制条挡住画面 */
    clearTimeout(PL.hideTimer);
  }
}

/* ---------------------------------------------------------------- 全局事件 */
function renderCats() {
  $('cats').innerHTML = CATS.map(function(c) {
    return '<button class="tab' + (state.cat === c[1] ? ' on' : '') + '" data-cat="'
      + c[1] + '">' + esc(c[0]) + '</button>';
  }).join('');
}

/** 选某个类型/年份后会有多少部（其它维度沿用当前选择），用于在弹层里标数量 */
function countFor(kind, val) {
  return allRows().filter(function(r) {
    var g = kind === 'genre' ? val : state.genre;
    var y = kind === 'year' ? val : state.year;
    return genreMatch(r[2], g) && yearMatch(r[1], y);
  }).length;
}

/** 类型 / 年份 / 排序统一走底部弹层，避免三排 chip 把首屏挤掉一半 */
function openFilter(kind) {
  var list, cur, title;
  if (kind === 'genre') { list = GENRES; cur = state.genre; title = '选择类型'; }
  else if (kind === 'year') { list = YEARS; cur = state.year; title = '选择年份'; }
  else { list = SORTS; cur = state.sort; title = '排序方式'; }
  var opts = list.map(function(v) {
    var cls = (v === cur ? 'on' : '');
    var num = '';
    if (kind !== 'sort') {
      var n = countFor(kind, v);
      num = '<small>' + n + '</small>';
      if (!n) cls += ' off';
    }
    return '<button class="' + cls + '" data-opt="' + kind
      + '" data-val="' + esc(v) + '">' + esc(v) + num + '</button>';
  }).join('');
  openSheet('<button class="sheet-close" onclick="closeSheet()">×</button>'
    + '<div class="sheet-title">' + title + '</div><div class="opt">' + opts + '</div>');
}

/* 自定义源输入框里按回车＝点「添加」 */
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.keyCode !== 13) return;
  if (!e.target || e.target.id !== 'liveSrcInput') return;
  e.preventDefault();
  liveAddSrc();
});

/* 直播频道搜索：只重绘 #liveBox，输入框不重建，光标和焦点都还在 */
document.addEventListener('input', function(e) {
  if (!e.target || e.target.id !== 'liveQ') return;
  LIVE.q = e.target.value || '';
  LIVE.shown = 150;
  var box = $('liveBox');
  if (box) box.innerHTML = liveGridHtml();
});

document.addEventListener('click', function(e) {
  if ($('player').classList.contains('on')) return;

  /* ---- 直播版面 ---- */
  /* 星标要在 [data-live] 之前判：星是独立按钮，但视觉上压在格子右上角 */
  var lf = e.target.closest('[data-live-fav]');
  if (lf) {
    var fname = lf.getAttribute('data-live-fav');
    var added = liveFavToggle(fname);
    lf.classList.toggle('on', added);
    lf.textContent = added ? '★' : '☆';
    var tile = lf.parentNode && lf.parentNode.querySelector('.lt');
    if (tile) tile.classList.toggle('fav', added);
    toast(added ? '已收藏 ' + fname : '已取消收藏 ' + fname);
    /* 收藏数量变了，分组标签要跟着更新；不整页重绘，免得闪烁 */
    renderCats();
    return;
  }
  var lv = e.target.closest('[data-live]');
  if (lv) { playLive(lv.getAttribute('data-live')); return; }
  if (e.target.closest('[data-live-refresh]')) { liveRefresh(true); return; }
  if (e.target.closest('[data-live-addsrc]')) { LIVE.showSrc = !LIVE.showSrc; livePaint(); return; }
  if (e.target.closest('[data-live-savesrc]')) { liveAddSrc(); return; }
  var ld = e.target.closest('[data-live-delsrc]');
  if (ld) {
    var du = ld.getAttribute('data-live-delsrc');
    LIVE.custom = (LIVE.custom || []).filter(function(x) { return x !== du; });
    liveCustomSave();
    livePaint();
    return;
  }
  if (e.target.closest('[data-live-more]')) { LIVE.shown += 150; livePaint(); return; }
  var lg = e.target.closest('[data-live-grp]');
  if (lg) {
    LIVE.grp = lg.getAttribute('data-live-grp');
    LIVE.shown = 150;
    livePaint();
    return;
  }

  var tab = e.target.closest('.tab');
  if (tab) {
    var cat = tab.getAttribute('data-cat');
    // 搜索页 / 全库视图下点分类 = 直接回推荐页。
    // 之前这里只弹一句「分类仅作用于推荐页」，而唯一的返回入口在几十条结果之后，
    // 用户得一直滚到底才能回去，移动端基本等于回不去。
    var wasAway = !!state.q || !!state.more;
    if (cat === state.cat && !wasAway) return;
    state.cat = cat;
    state.hero = 0;
    if (state.q) { state.q = ''; state.items = null; $('q').value = ''; }
    state.more = null;
    state.moreShown = 60;
    renderCats();
    renderHome();
    window.scrollTo(0, 0);
    return;
  }

  var f = e.target.closest('.fchip');
  if (f) {
    var kind = f.getAttribute('data-f');
    if (kind === 'reset') {
      state.genre = '全部'; state.year = '全部';
      state.sort = '推荐'; state.sortTouched = false;
      renderHome();
    } else {
      openFilter(kind);
    }
    return;
  }

  var opt = e.target.closest('[data-opt]');
  if (opt) {
    var k = opt.getAttribute('data-opt');
    var v = opt.getAttribute('data-val');
    if (k === 'genre') state.genre = v;
    else if (k === 'year') state.year = v;
    else { state.sort = v; state.sortTouched = true; }   // 用户手动选了排序，分区不再强行用自己的
    closeSheet();
    renderHome();
    return;
  }

  var dot = e.target.closest('[data-hero]');
  if (dot) {
    showSlide(parseInt(dot.getAttribute('data-hero'), 10) || 0);
    startHeroTimer();
    return;
  }

  var heroBtn = e.target.closest('[data-hero-play]');
  if (heroBtn) {
    var ht = heroBtn.getAttribute('data-title');
    $('q').value = ht;
    doSearch(ht);
    return;
  }

  var sb = e.target.closest('.srcbar');
  if (sb) {
    if (HAS_NATIVE && Android.openHealth) Android.openHealth();
    else __LTV.openHealth();
    return;
  }

  var rk = e.target.closest('.rank-item');
  if (rk) {
    var rt = rk.getAttribute('data-title');
    $('q').value = rt;
    doSearch(rt);
    return;
  }

  // 全库视图的入口与底部按钮
  var mo = e.target.closest('[data-more]');
  if (mo) { openMore(mo.getAttribute('data-more')); return; }

  if (e.target.closest('[data-more-back]')) { closeMore(); return; }

  if (e.target.closest('#moreShow')) {
    state.moreShown = (state.moreShown || 60) + 60;
    renderHome();
    return;
  }

  if (e.target.closest('#poolMore')) {
    if (POOL.loading) return;
    toast('继续同步片库…');
    pullPool(4, { append: true }).then(function(n) {
      if (n < 0) { toast('同步失败，换个网络再试'); renderHome(); return; }
      toast(n ? '新增 ' + n + ' 部' : '没有更多新片了');
      renderHome();
    });
    return;
  }

  if (e.target.closest('#poolSync')) { refreshPool(true); return; }

  var p = e.target.closest('.poster');
  if (!p) return;
  var title = p.getAttribute('data-title');
  if (p.getAttribute('data-detail') === '1') {
    var cards = Array.prototype.slice.call(document.querySelectorAll('.grid .poster'));
    openDetail(cards.indexOf(p));
  } else {
    $('q').value = title;
    doSearch(title);
  }
});

$('go').addEventListener('click', function(){ doSearch($('q').value); });
$('q').addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch($('q').value); });
$('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });

renderCats();
initPool();
if (CFG.mode === 'server') toast('当前为服务模式，请在 ⚙ 中切换为直连模式');
</script>
